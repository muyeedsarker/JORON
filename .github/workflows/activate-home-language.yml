name: Activate JORON Three-Language System
on:
  push:
    branches: [work/joron-step1-language]
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load global language scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = '<script src="assets/joron-language.js"></script>'
          for p in sorted(Path('.').glob('*.html')):
              s = p.read_text(encoding='utf-8')
              if 'assets/joron-language.js' not in s and '</head>' in s:
                  s = s.replace('</head>', tag + '</head>', 1)
                  p.write_text(s, encoding='utf-8')
          p = Path('index.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              home_tag = '<script src="assets/joron-home-language.js"></script>'
              if home_tag not in s and '</head>' in s:
                  s = s.replace('</head>', home_tag + '</head>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit language activation
        run: |
          git config user.name 'JORON Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.html'
          git diff --cached --quiet || git commit -m 'feat: activate three-language system across all pages'
          git push
