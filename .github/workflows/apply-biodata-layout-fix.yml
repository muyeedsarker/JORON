name: Apply Smart Biodata layout fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/joron-biodata-layout-fix.css'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach isolated layout CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('smart-biodata.html')
          s=p.read_text(encoding='utf-8')
          tag='<link rel="stylesheet" href="assets/joron-biodata-layout-fix.css">'
          if tag not in s:
              s=s.replace('</head>', tag+'\n</head>', 1)
              p.write_text(s, encoding='utf-8')
              print('Attached layout fix')
          else:
              print('Layout fix already attached')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-biodata.html
          git diff --cached --quiet || git commit -m 'Fix Smart Biodata layout overlap'
          git push
