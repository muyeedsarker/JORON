name: Apply JORON Theme v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach JORON Theme v2 to all live HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='assets/joron-theme-v2.css'
          link=f'<link rel="stylesheet" href="{marker}">'
          skip={
              'index-backup.html','index.html.before-design','index.html.before-home-premium','index.html.before-premium',
              'index_backup_before_new_design.html','login.html.before-design','login.html.before-premium',
              'biodata.html.before-design','biodata.html.before-premium','payment.html.before-design','payment.html.before-premium',
              'profile.html.backup','profile.html.bak','profile.html.before-design','profile.html.before-premium',
              'profiles.html.before-premium','signup.html.before-design','signup.html.before-premium'
          }
          changed=[]
          for p in Path('.').glob('*.html'):
              if p.name in skip or '.bak' in p.name or '.backup' in p.name:
                  continue
              s=p.read_text(encoding='utf-8')
              if marker in s:
                  continue
              if '</head>' in s:
                  s=s.replace('</head>',link+'</head>',1)
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Theme v2 attached to', len(changed), 'pages')
          print('\n'.join(changed))
          PY
      - name: Commit theme rollout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' assets/joron-theme-v2.css .github/workflows/apply-joron-theme-v2.yml
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m "Apply JORON Theme v2 globally"
          git push origin HEAD:main
