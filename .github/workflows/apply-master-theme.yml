name: Apply JORON Master Theme

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "assets/**"
      - ".github/workflows/apply-master-theme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared JORON theme
        shell: bash
        run: |
          set -e

          if [ ! -f "assets/joron-theme.css" ]; then
            echo "assets/joron-theme.css not found."
            exit 0
          fi

          shopt -s nullglob

          for file in *.html; do
            case "$file" in
              *before-*|*backup*|*.bak)
                continue
                ;;
            esac

            python3 - "$file" <<'PY'
import sys
from pathlib import Path

file_path = Path(sys.argv[1])
text = file_path.read_text(encoding="utf-8")

theme = '<link rel="stylesheet" href="assets/joron-theme.css">'

if theme not in text and "</head>" in text:
    text = text.replace(
        "</head>",
        "\n" + theme + "\n</head>",
        1
    )
    file_path.write_text(text, encoding="utf-8")
    print(f"Theme added: {file_path}")
else:
    print(f"No change needed: {file_path}")
PY

          done

      - name: Check changes
        shell: bash
        run: |
          git status --short

      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config user.name "JORON Theme Bot"
          git config user.email "actions@github.com"

          git add "*.html"

          if git diff --cached --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi

          git commit -m "Apply JORON master theme"

          git push
