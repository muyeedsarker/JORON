name: Apply JORON Master Theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "assets/**"

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply JORON theme
        shell: bash
        run: |
          set -e

          if [ ! -f "assets/joron-theme.css" ]; then
            echo "JORON theme CSS not found. Nothing to do."
            exit 0
          fi

          changed=0

          shopt -s nullglob

          for file in *.html; do

            case "$file" in
              *before-*|*backup*|*.bak)
                continue
                ;;
            esac

            if grep -q 'assets/joron-theme.css' "$file"; then
              echo "Already applied: $file"
              continue
            fi

            python3 - "$file" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text(encoding="utf-8")

theme = '<link rel="stylesheet" href="assets/joron-theme.css">'

if theme not in text and "</head>" in text:
    text = text.replace(
        "</head>",
        "\n" + theme + "\n</head>",
        1
    )
    path.write_text(text, encoding="utf-8")
    print(f"Theme added: {path}")
PY

            changed=1

          done

          echo "Theme application finished."
          echo "Changed: $changed"

      - name: Commit theme changes
        shell: bash
        run: |
          set -e

          git config user.name "JORON Theme Bot"
          git config user.email "actions@github.com"

          git add "*.html"

          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git commit -m "Apply JORON master theme"
          git push
