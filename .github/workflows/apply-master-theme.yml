name: Check JORON Master Theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "assets/joron-reference-theme.css"
      - ".github/workflows/apply-master-theme.yml"

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JORON theme file
        shell: bash
        run: |
          set -e

          if [ ! -f "assets/joron-reference-theme.css" ]; then
            echo "ERROR: assets/joron-reference-theme.css not found."
            exit 1
          fi

          echo "OK: JORON theme CSS exists."

      - name: Check HTML theme links
        shell: bash
        run: |
          set -e

          found=0

          for file in *.html; do
            [ -f "$file" ] || continue

            if grep -q 'assets/joron-reference-theme.css' "$file"; then
              echo "OK: $file uses JORON reference theme."
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No HTML page is linked to the JORON reference theme."
            exit 1
          fi

          echo "JORON theme check completed successfully."