name: Apply JORON Master Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply theme
        shell: bash
        run: |
          set -e

          if [ ! -f "assets/joron-theme.css" ]; then
            echo "assets/joron-theme.css not found"
            exit 0
          fi

          for file in *.html; do
            [ -f "$file" ] || continue

            if ! grep -q 'assets/joron-theme.css' "$file"; then
              sed -i 's#</head>#<link rel="stylesheet" href="assets/joron-theme.css">\n</head>#' "$file"
            fi
          done

      - name: Save changes
        shell: bash
        run: |
          git config user.name "JORON Theme Bot"
          git config user.email "actions@github.com"

          git add "*.html"

          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi

          git commit -m "Apply JORON master theme"
          git push
