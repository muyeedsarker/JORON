name: Apply JORON Master Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check theme CSS
        run: |
          if [ ! -f "assets/joron-theme.css" ]; then
            echo "Theme CSS file not found."
            exit 0
          fi

      - name: Apply theme to HTML pages
        shell: bash
        run: |
          set -e

          changed=0

          for file in *.html; do
            [ -f "$file" ] || continue

            case "$file" in
              *before-*|*backup*|*.bak)
                continue
                ;;
            esac

            if grep -q 'assets/joron-theme.css' "$file"; then
              echo "Already applied: $file"
              continue
            fi

            python3 - "$file" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text(encoding="utf-8")

theme = '<link rel="stylesheet" href="assets/joron-theme.css">'

if theme not in text and "</head>" in text:
    text = text.replace(
        "</head>",
        "\n" + theme + "\n</head>",
        1
    )
    path.write_text(text, encoding="utf-8")
    print("Theme added:", path)
    sys.exit(10)

print("No change needed:", path)
PY

            code=$?

            if [ "$code" -eq 10 ]; then
              changed=1
            elif [ "$code" -ne 0 ]; then
              exit "$code"
            fi
          done

          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: Commit changes
        if: env.changed == '1'
        run: |
          git config user.name "JORON Theme Bot"
          git config user.email "actions@github.com"

          git add '*.html'

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Apply JORON master theme"
          git push

      - name: Finish
        run: |
          echo "JORON Master Theme workflow completed."
