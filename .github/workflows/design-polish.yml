name: JORON Design Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish homepage visual design
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'background:#fff9fc;line-height:1.7': 'background:linear-gradient(145deg,#fff8fb 0%,#ffffff 42%,#f7f1ff 72%,#f0fff8 100%);line-height:1.7',
            'background:#ffffffee;backdrop-filter:blur(15px);border-bottom:1px solid #00000012;box-shadow:0 8px 30px #00000010': 'background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid #ead7e7;box-shadow:0 10px 32px rgba(66,19,78,.12)',
            'background:linear-gradient(90deg,#35105a,#64158f,#087b59)': 'background:linear-gradient(90deg,#5a168d,#b20b4d,#087b59)',
            'background:linear-gradient(105deg,#d20b5a,#7b1bb0);color:#fff;border:0': 'background:linear-gradient(135deg,#c80b57 0%,#e51b73 45%,#741bb0 100%);color:#fff;border:0',
            'box-shadow:0 9px 26px rgba(210,11,90,.28)': 'box-shadow:0 12px 30px rgba(178,11,77,.32),inset 0 1px 0 rgba(255,255,255,.28)',
            'color:#066d4f;border-color:#72c8a7;background:#fff': 'color:#075f49;border-color:#63b998;background:linear-gradient(180deg,#ffffff,#effcf7);box-shadow:0 7px 18px rgba(8,123,89,.10)',
            'background:#fff;border:1px solid #d9d1dc;border-radius:12px;font-size:13px;font-weight:900': 'background:linear-gradient(180deg,#ffffff,#fbf7fc);border:1px solid #d8c7df;border-radius:12px;font-size:13px;font-weight:900;box-shadow:0 5px 14px rgba(70,20,84,.08)',
            'background:#fff;border:1px solid #e1d8e6;border-radius:15px;padding:10px 13px;box-shadow:0 15px 40px #00000018': 'background:rgba(255,255,255,.94);border:1px solid #e5d8e8;border-radius:15px;padding:10px 13px;box-shadow:0 16px 40px rgba(49,20,70,.14)',
            'background:linear-gradient(135deg,#fff4f8,#f8f0ff 55%,#edfff7)': 'background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.95),transparent 28%),radial-gradient(circle at 88% 18%,rgba(229,201,244,.78),transparent 28%),linear-gradient(135deg,#fff0f6 0%,#f5edff 52%,#e9fff5 100%)',
          }
          for a,b in replacements.items():
              if a in s:
                  s=s.replace(a,b)
          # Keep the existing button positions, labels and sizes; only add richer visual states.
          marker = '.menu a:hover{transform:translateY(-1px);box-shadow:0 7px 18px #00000016}'
          extra = '.menu a:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(70,20,84,.16)}.menu .join:hover,.btn.primary:hover{filter:saturate(1.12) brightness(1.03);transform:translateY(-2px)}.btn.green:hover{background:linear-gradient(180deg,#f5fffb,#e5faf2);transform:translateY(-2px);box-shadow:0 10px 24px rgba(8,123,89,.14)}.btn:active,.menu a:active{transform:translateY(0) scale(.98)}'
          if marker in s and extra not in s:
              s=s.replace(marker, marker+extra)
          p.write_text(s,encoding='utf-8')
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: polish JORON homepage colors and button design"
          git push
