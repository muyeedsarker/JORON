name: Fix JORON header navigation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix mobile header labels and relationship button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<button class="icon-btn" aria-label="Menu">☰</button>'
          new = '<details class="mobile-menu"><summary class="icon-btn" aria-label="মেনু">☰<small>মেনু</small></summary><div class="mobile-menu-panel"><a href="index.html">🏠 হোম</a><a href="matching.html">❤️ Match</a><a href="profiles.html">👥 Profiles</a><a href="payment.html">💎 Premium</a><a href="login.html">🔒 Login</a><a href="signup.html">💗 Signup</a></div></details>'
          s = s.replace(old, new, 1)

          old = '<a class="profile-btn" href="signup.html" aria-label="Profile তৈরি">♥</a>'
          new = '<a class="profile-btn relationship-btn" href="signup.html" aria-label="সম্পর্ক জুড়ে দিন"><span>♥</span><small>সম্পর্ক জুড়ে দিন</small></a>'
          s = s.replace(old, new, 1)

          css = '''<style>
          .mobile-menu{position:relative;z-index:100}.mobile-menu summary{list-style:none;display:grid;place-items:center;gap:1px;cursor:pointer}.mobile-menu summary::-webkit-details-marker{display:none}.mobile-menu summary small{font:900 8px system-ui;color:#30143f;line-height:1}.mobile-menu-panel{position:absolute;top:54px;left:0;width:210px;background:#fff;border:1px solid #eadfea;border-radius:18px;padding:8px;box-shadow:0 14px 30px rgba(40,16,53,.18)}.mobile-menu-panel a{display:block;padding:12px 13px;border-radius:12px;font-weight:900;color:#30143f}.mobile-menu-panel a:hover{background:#f8efff}.relationship-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 9px!important;text-align:center;line-height:1.05}.relationship-btn span{font-size:22px}.relationship-btn small{font:900 8px system-ui;color:#fff;white-space:nowrap}.icon-btn{padding:5px 8px}.icon-btn small{display:block}@media(min-width:760px){.mobile-menu{display:none}}@media(max-width:560px){.relationship-btn{width:46px!important;min-width:46px}.relationship-btn small{font-size:7px}.mobile-menu summary{width:46px;height:46px}.mobile-menu-panel{top:51px}}
          </style>'''
          s = s.replace('</style></head>', css + '</style></head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit header fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-header-navigation.yml
          git diff --cached --quiet || git commit -m "fix: improve mobile header labels and relationship button"
          git push
