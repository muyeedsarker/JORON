name: Fix JORON header navigation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean header markup and apply premium 3D buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the malformed duplicate style blocks previously injected by automation.
          s = re.sub(r'<style>\s*\.mobile-menu\{.*?</style>', '', s, flags=re.S)

          # Normalize the mobile menu button.
          s = re.sub(
              r'<button class="icon-btn"[^>]*>☰</button>',
              '<details class="mobile-menu"><summary class="icon-btn" aria-label="মেনু"><span class="menu-icon">☰</span><small>মেনু</small></summary><div class="mobile-menu-panel"><a href="index.html">🏠 হোম</a><a href="matching.html">❤️ Match</a><a href="profiles.html">👥 Profiles</a><a href="payment.html">💎 Premium</a><a href="login.html">🔒 Login</a><a href="signup.html">💗 Signup</a></div></details>',
              s,
              count=1,
          )

          # Normalize the relationship button while preserving its destination.
          s = re.sub(
              r'<a class="profile-btn(?: relationship-btn)?" href="signup\.html"[^>]*>.*?</a>',
              '<a class="profile-btn relationship-btn" href="signup.html" aria-label="সম্পর্ক জুড়ে দিন"><span class="relationship-icon">♥</span><small>সম্পর্ক জুড়ে দিন</small></a>',
              s,
              count=1,
              flags=re.S,
          )

          css = '''<style id="joron-premium-header">
          .mobile-menu{position:relative;z-index:100}
          .mobile-menu summary{list-style:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-align:center;line-height:1}
          .mobile-menu summary::-webkit-details-marker{display:none}
          .mobile-menu .menu-icon{font-size:24px;font-weight:1000;line-height:1;text-shadow:0 2px 0 #b9a7c2,0 4px 7px rgba(55,20,75,.28);transform:translateY(-1px)}
          .mobile-menu summary small{font:900 8px system-ui;color:#30143f;line-height:1;white-space:nowrap}
          .mobile-menu-panel{position:absolute;top:55px;left:0;width:215px;background:rgba(255,255,255,.98);border:1px solid #eadfea;border-radius:18px;padding:8px;box-shadow:0 16px 34px rgba(40,16,53,.20);backdrop-filter:blur(8px)}
          .mobile-menu-panel a{display:block;padding:12px 13px;border-radius:12px;font-weight:900;color:#30143f}
          .mobile-menu-panel a:hover{background:#f8efff}
          .icon-btn{padding:5px 8px}
          .icon-btn small{display:block}
          .relationship-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 7px!important;text-align:center;line-height:1;border:0!important;background:linear-gradient(145deg,#ff4f9a 0%,#d90b62 48%,#7620ad 100%)!important;box-shadow:inset 0 2px 2px rgba(255,255,255,.38),inset 0 -4px 7px rgba(75,0,80,.22),0 8px 16px rgba(120,20,130,.24)!important;transform:translateY(0);transition:transform .18s ease,box-shadow .18s ease}
          .relationship-btn:hover{transform:translateY(-2px);box-shadow:inset 0 2px 2px rgba(255,255,255,.42),inset 0 -4px 8px rgba(75,0,80,.24),0 12px 22px rgba(120,20,130,.30)!important}
          .relationship-btn:active{transform:translateY(1px) scale(.97)}
          .relationship-icon{font-size:23px;color:#fff;line-height:1;text-shadow:0 2px 0 #a20b4d,0 4px 7px rgba(70,0,50,.34);filter:drop-shadow(0 2px 2px rgba(255,255,255,.18))}
          .relationship-btn small{font:900 8px system-ui;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(65,0,50,.35)}
          @media(min-width:760px){.mobile-menu{display:none}}
          @media(max-width:560px){.relationship-btn{width:46px!important;min-width:46px;height:46px!important;border-radius:15px!important}.relationship-icon{font-size:21px}.relationship-btn small{font-size:7px}.mobile-menu summary{width:46px;height:46px}.mobile-menu-panel{top:51px}}
          </style>'''

          # Remove any previous premium override, then add one clean final override.
          s = re.sub(r'<style id="joron-premium-header">.*?</style>', '', s, flags=re.S)
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit header fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-header-navigation.yml
          git diff --cached --quiet || git commit -m "fix: polish header menu and relationship button"
          git push
