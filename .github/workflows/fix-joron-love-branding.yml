name: Fix JORON LOVE branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace visible JORON branding with J❤️R❤️N
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              n = s.replace('JORON', 'J❤️R❤️N')
              if n != s:
                  p.write_text(n, encoding='utf-8')
          PY

      - name: Commit branding fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No branding changes needed."
            exit 0
          fi
          git commit -m "Update JORON branding to J❤️R❤️N"
          git push
