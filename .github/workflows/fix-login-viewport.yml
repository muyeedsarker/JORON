name: Fix JORON Login Viewport
on:
  push:
    paths:
      - '.github/workflows/fix-login-viewport.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('login.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('html,body{margin:0;min-height:100%;background:#08070a!important;', 'html,body{margin:0;width:100%;min-height:100%;background:#08070a!important;')
          s=s.replace('body{overflow-x:hidden}', 'body{overflow-x:hidden;overflow-y:hidden;height:100dvh}')
          s=s.replace('.login-page{min-height:100vh;display:flex;', '.login-page{height:100dvh;min-height:100dvh;display:flex;')
          s=s.replace('.login-shell{width:min(100%,470px);min-height:100vh;', '.login-shell{width:min(100%,470px);height:100dvh;min-height:100dvh;')
          s=s.replace('.hero img{width:100%!important;height:auto!important;', '.hero img{width:100%!important;height:auto!important;transform:translateY(18px)!important;')
          s=s.replace('.login-panel{position:relative;z-index:4;padding:0 22px 28px;', '.login-panel{position:relative;z-index:4;padding:0 22px 28px;margin-top:18px;')
          s=s.replace('<meta name="joron-login-version" content="2026-09-02-fix-6">','<meta name="joron-login-version" content="2026-09-02-fix-7">')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add login.html
          git commit -m 'fix: lock mobile login viewport and move hero image down' || true
          git rm .github/workflows/fix-login-viewport.yml
          git commit -m 'chore: remove one-time login viewport workflow' || true
          git push