name: Fix signup page layout
on:
  push:
    paths:
      - '.github/workflows/fix-signup-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'signup layout auto-fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch signup page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('signup.html')
          s=p.read_text(encoding='utf-8')
          css='''\n<style id="joron-signup-consistent-theme">\nbody{padding:0!important;background:linear-gradient(145deg,#fff,#fff7fb 48%,#f5efff)!important;color:#20202b!important}\n.joron-signup-top{background:linear-gradient(90deg,#64158f,#d90b62,#087b59);color:#fff;text-align:center;font-size:11px;font-weight:800;padding:7px 10px}\n.joron-signup-header{background:rgba(255,255,255,.97);border-bottom:1px solid #eadfea;box-shadow:0 5px 20px rgba(70,25,90,.08);position:relative;z-index:100}\n.joron-signup-head{width:min(1120px,92%);min-height:82px;margin:auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:7px}\n.joron-signup-brand{text-align:center;color:#64158f;font:700 29px Georgia,serif;line-height:1.05}.joron-signup-brand small{display:block;font:800 8px Arial,sans-serif;color:#444;margin-top:3px}\n.joron-signup-menu,.joron-signup-rel{width:46px;height:46px;border-radius:15px;border:1px solid #e2d8e6;background:#fff;box-shadow:0 6px 15px rgba(70,25,90,.08);display:grid;place-items:center;font-size:22px;text-decoration:none;color:#20202b}\n.joron-signup-rel{background:linear-gradient(135deg,#d90b62,#7620ad);color:#fff;border:0;font-size:20px}.joron-signup-menu{position:relative}\n.joron-signup-nav{position:absolute;left:10px;right:10px;top:70px;background:#3a1250;border-radius:16px;padding:8px;box-shadow:0 14px 30px rgba(30,10,45,.25);display:none}.joron-signup-nav a{display:block;color:#fff;text-decoration:none;padding:11px 12px;border-radius:10px;font-weight:800}.joron-signup-nav a:hover{background:rgba(255,255,255,.12)}\n.joron-signup-menu:focus-within .joron-signup-nav,.joron-signup-menu:hover .joron-signup-nav{display:block}\n.joron-signup-box{width:min(600px,calc(100% - 24px));margin:20px auto 30px!important}\n.joron-signup-footer{background:#281035;color:#dffff3;text-align:center;padding:30px 12px 18px;margin-top:35px}.joron-signup-footer strong{font:700 28px Georgia,serif;color:#fff}.joron-signup-footer small{display:block;margin-top:7px}.joron-signup-copy{border-top:1px solid #ffffff22;margin-top:18px;padding-top:10px;font-size:10px}\n#selectedPlan{transition:.2s}.selected-plan.empty-plan{opacity:.75}\n@media(min-width:760px){.joron-signup-head{min-height:92px;grid-template-columns:54px 1fr 54px}.joron-signup-menu{display:none}.joron-signup-brand{font-size:34px}.joron-signup-rel{width:auto;min-width:110px;padding:0 12px;border-radius:14px;font-size:12px;font-family:Arial,sans-serif;font-weight:900}.joron-signup-nav{display:flex;position:static;background:none;box-shadow:none;padding:0;gap:8px}.joron-signup-nav a{color:#64158f;border:1px solid #eadfea;background:#fff;font-size:12px}.joron-signup-menu{display:none}.joron-signup-head:before{content:"";grid-column:1}.joron-signup-brand{grid-column:2}.joron-signup-rel{grid-column:3;justify-self:end}.joron-signup-box{margin-top:24px!important}}\n</style>'''
          if 'joron-signup-consistent-theme' not in s:
              s=s.replace('</head>',css+'</head>',1)
          header='''<div class="joron-signup-top">❤️ বিশ্বাস • সম্মান • সম্পর্ক</div><header class="joron-signup-header"><div class="joron-signup-head"><div class="joron-signup-menu" tabindex="0" aria-label="মেনু">☰<div class="joron-signup-nav"><a href="index.html">🏠 হোম</a><a href="smart-biodata.html">📋 Smart Biodata</a><a href="payment.html">💳 Payment</a><a href="login.html">🔐 Login</a></div></div><a class="joron-signup-brand" href="index.html">J❤️R❤️N<small>দুজনের গল্প, এক জোড়ন</small></a><a class="joron-signup-rel" href="index.html#relationship">❤️ সম্পর্ক জুড়ে দিন</a></div></header>'''
          if 'joron-signup-header' not in s:
              s=s.replace('<body>', '<body>'+header, 1)
          s=s.replace('<div class="signup-box">','<div class="signup-box joron-signup-box">',1)
          footer='''<footer class="joron-signup-footer"><strong>J❤️R❤️N</strong><small>বিশ্বাস • সম্মান • গোপনীয়তা</small><div class="joron-signup-copy">© 2026 J❤️R❤️N — Connecting Hearts, Building Futures</div></footer>'''
          if 'joron-signup-footer' not in s:
              s=s.replace('</body>',footer+'</body>',1)
          s=s.replace('<div class="selected-plan" id="selectedPlan">কোনো Membership নির্বাচন করা হয়নি।</div>','<div class="selected-plan empty-plan" id="selectedPlan">কোনো Membership নির্বাচন করা হয়নি।</div>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signup.html
          git diff --cached --quiet || git commit -m 'signup layout auto-fix'
          git push
