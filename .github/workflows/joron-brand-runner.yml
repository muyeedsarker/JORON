name: JORON Matrimony Brand Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply branding
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            perl -0pi -e 's#(<title>\s*)JORON(?=\s*[|—-])#$1JORON Matrimony#g; s#(<meta\s+name=["'"'"']description["'"'"']\s+content=["'"'"'][^"'"'"']*)JORON\s*—#$1JORON Matrimony —#gi; s#(>\s*)JORON(\s*<)#${1}JORON Matrimony$2#g; s#(>\s*)JORON\s*(?:—|\|)([^<]*<)#$1JORON Matrimony —$2#g; s#(alt=["'"'"'])JORON(\s+)#$1JORON Matrimony$2#g' "$file"
          done < <(find . -type f -name '*.html' -not -path './node_modules/*' -print0)
          rm -f brand-trigger.html
          git config user.name 'JORON Matrimony Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Apply JORON Matrimony branding across website'
            git push
          fi
