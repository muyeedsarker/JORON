name: JORON CSS Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy global CSS layers and keep one clean layer
        run: |
          python - <<'PY'
          from pathlib import Path
          legacy = [
            'assets/joron-reference-theme.css','assets/joron-theme-v2.css','assets/joron-master-theme.css',
            'assets/joron-ux-polish.css','assets/joron-visual-redesign-v1.css','assets/joron-visual-redesign-v2.css',
            'assets/joron-visual-redesign-v3.css','assets/joron-visual-redesign-v4.css','assets/joron-visual-redesign-v5.css',
            'assets/joron-live-fix.css','assets/joron-final-qa.css','joron-theme.css'
          ]
          clean='assets/joron-clean.css'
          changed=[]
          for p in Path('.').glob('*.html'):
              if any(x in p.name for x in ['.bak','.backup','.before-']) or p.name.startswith('index_backup') or p.name=='index-backup.html':
                  continue
              s=p.read_text(encoding='utf-8')
              old=s
              for marker in legacy:
                  import re
                  s=re.sub(r'<link[^>]+href=["\']'+re.escape(marker)+r'["\'][^>]*>\s*', '', s, flags=re.I)
              if clean not in s and '</head>' in s:
                  s=s.replace('</head>', f'<link rel="stylesheet" href="{clean}"></head>', 1)
              if s!=old:
                  p.write_text(s,encoding='utf-8'); changed.append(p.name)
          print('Cleaned pages:', len(changed), changed)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' assets/joron-clean.css .github/workflows/joron-css-cleanup.yml
          if git diff --cached --quiet; then echo 'No cleanup changes needed'; exit 0; fi
          git commit -m "Consolidate JORON global CSS into one clean layer"
          git push origin HEAD:main
