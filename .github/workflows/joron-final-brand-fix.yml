name: JORON Final Brand Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final brand polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<strong>J❤️R❤️N</strong><small>Connecting Hearts, Building Futures</small>'
          old2 = '<strong>J❤️R❤️N</strong><small>জোড়ন • Connecting Hearts, Building Futures</small>'
          new = '<strong>J❤️R❤️N</strong><small>জোড়ন • Connecting Hearts, Building Futures</small>'
          if old2 not in s:
              s = s.replace(old1, new, 1)
          if old2 not in s:
              raise SystemExit('Expected JORON brand text was not found in index.html')

          style = '''<style id="joron-final-brand-fix">
          .brand{position:relative;min-width:0}
          .brand div{min-width:0;text-align:center}
          .brand strong{display:block;white-space:nowrap;line-height:.95;font-family:Georgia,"Times New Roman",serif;font-weight:800;letter-spacing:1.5px;color:#64158f;text-shadow:0 2px 0 rgba(255,255,255,.9),0 5px 14px rgba(100,21,143,.18);animation:joronBrandFloat 2.8s ease-in-out infinite}
          .brand strong:after{content:"";display:block;width:76%;height:3px;margin:7px auto 0;border-radius:99px;background:linear-gradient(90deg,#64158f,#d90b62,#087b59);box-shadow:0 2px 7px rgba(100,21,143,.2)}
          .brand small{display:block;margin-top:6px;white-space:nowrap;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;font-size:8px!important;font-weight:900;line-height:1.1;color:#4d3b56;letter-spacing:.15px}
          @keyframes joronBrandFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
          .quick,.showcase,.card,.step,.cta,.trust div{background:linear-gradient(145deg,#fff 0%,#fff7fc 52%,#f3ebff 100%)}
          footer{background:linear-gradient(135deg,#281035,#64158f,#087b59)}
          @media(max-width:560px){.head{height:88px;grid-template-columns:50px minmax(0,1fr) 50px;gap:4px}.brand{gap:4px}.brand img{width:54px;height:54px}.brand strong{font-size:25px!important;letter-spacing:1px}.brand strong:after{height:2px;margin-top:5px}.brand small{font-size:7px!important;margin-top:4px;max-width:190px;overflow:hidden;text-overflow:ellipsis}.quick{margin-top:12px;margin-bottom:12px}.hero{padding:10px 0 22px}.section{padding:28px 0}footer{margin-top:22px;padding-top:24px}}
          @media(max-width:390px){.brand img{width:48px;height:48px}.brand strong{font-size:22px!important}.brand small{font-size:6.5px!important}}
          </style>'''
          if 'id="joron-final-brand-fix"' not in s:
              s = s.replace('</head>', style + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          common = '''<style id="joron-premium-page-skin">
          :root{--joron-p:#64158f;--joron-k:#d90b62;--joron-g:#087b59}
          body{background:radial-gradient(circle at 10% 0%,#ffe8f3 0,transparent 28%),radial-gradient(circle at 90% 10%,#eee1ff 0,transparent 30%),linear-gradient(145deg,#fff7fb,#f4efff 55%,#edfff7)!important}
          header{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(10px)}
          main{min-height:calc(100vh - 170px)}
          .card,.profile-card,.form-card,.login-card,.panel,.container>section{box-shadow:0 12px 32px rgba(70,25,90,.10)!important;border-color:#ead8ee!important}
          </style>'''
          for name in ('login.html','profile.html'):
              q=Path(name)
              if q.exists():
                  x=q.read_text(encoding='utf-8')
                  if 'id="joron-premium-page-skin"' not in x:
                      q.write_text(x.replace('</head>',common+'</head>',1),encoding='utf-8')
          PY
      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html login.html profile.html .github/workflows/joron-final-brand-fix.yml
          git diff --cached --quiet || git commit -m "style: finalize JORON master branding and premium pages"
          git push
