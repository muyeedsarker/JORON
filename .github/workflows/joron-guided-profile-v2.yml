name: JORON guided profile v2
on:
  push:
    paths: ['.github/workflows/joron-guided-profile-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build guided profile page
        run: |
          cat > onboarding.html <<'EOF'
<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7ef"><title>JORON — Create Profile</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fbf7ef,#fffdf8 55%,#f3e4e5);color:#2c2925;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}.wrap{width:min(650px,94%);margin:auto;padding:18px 0 35px}.card{background:#fffdf8;border:1px solid #dfcda8;border-radius:24px;box-shadow:0 10px 26px rgba(150,110,50,.08);padding:22px}.brand{text-align:center;color:#8d682d;font:800 34px "Playfair Display",serif;letter-spacing:2px}.tag{text-align:center;color:#746e65;margin:2px 0 18px}.progress{height:8px;background:#ead9b5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:20%;background:linear-gradient(90deg,#c79a45,#a85d68);transition:.25s}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:16px 0 20px}.step{text-align:center;font-size:10px;color:#746e65}.step b{display:flex;width:30px;height:30px;border:1px solid #dfcda8;border-radius:50%;align-items:center;justify-content:center;margin:0 auto 4px;background:#fbf7ef;color:#8d682d}.step.active b,.step.done b{background:#c79a45;color:#fff;border-color:#c79a45}.step.active{font-weight:800;color:#8d682d}.screen{display:none}.screen.active{display:block}.screen h1{font-family:"Noto Serif Bengali","Hind Siliguri",sans-serif;color:#8d682d;font-size:23px;margin:0 0 5px}.screen p{color:#746e65;font-size:13px;line-height:1.55;margin:0 0 14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.choice{border:2px solid #dfcda8;background:#fff;border-radius:17px;padding:15px 8px;text-align:center;font:800 15px "Hind Siliguri",sans-serif;color:#2c2925;cursor:pointer;min-height:58px}.choice.selected{border-color:#c79a45;background:#fff8e8;box-shadow:0 0 0 3px rgba(199,154,69,.12)}.field{margin:10px 0}.field label{display:block;font-weight:800;color:#493d35;font-size:13px;margin-bottom:5px}.field select{width:100%;height:49px;border:1px solid #dfcda8;border-radius:14px;background:#fff;padding:0 13px;font:inherit;color:#2c2925}.auto{padding:11px 12px;border-radius:13px;background:#edf5ed;border:1px solid #cbdacb;color:#536753;font-size:12px;font-weight:700;margin-top:10px}.hint{padding:12px;border-radius:14px;background:#f3e4e5;border:1px solid #ead9b5;color:#6b4c50;font-size:12px;margin-top:12px}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;min-height:48px;border-radius:15px;font:800 15px "Hind Siliguri",sans-serif;cursor:pointer}.back{background:#fff;border:1px solid #dfcda8;color:#746e65}.next{border:0;background:linear-gradient(135deg,#c79a45,#a85d68);color:#fff}.finish{text-align:center}.finish .big{font-size:45px}.finish a{display:flex;align-items:center;justify-content:center;min-height:49px;margin-top:10px;border-radius:15px;text-decoration:none;background:#c79a45;color:#fff;font-weight:800}.finish a.alt{background:#a85d68}@media(max-width:520px){.wrap{width:calc(100% - 18px);padding-top:10px}.card{padding:17px}.choices{grid-template-columns:1fr 1fr;gap:8px}.choice{padding:12px 5px}.screen h1{font-size:21px}.step{font-size:9px}.step b{width:27px;height:27px}}@media(max-width:370px){.choices{grid-template-columns:1fr}.step{font-size:8px}}
</style></head><body><main class="wrap"><section class="card"><div class="brand">JORON</div><div class="tag">সম্পর্ক জুড়ে দেয় জোড়ন ❤️</div><div class="progress"><i id="bar"></i></div><div class="steps"><div class="step active"><b>1</b>কার জন্য</div><div class="step"><b>2</b>দেশ/ভাষা</div><div class="step"><b>3</b>আপনি</div><div class="step"><b>4</b>ঠিকানা</div><div class="step"><b>5</b>পছন্দ</div></div>
<div class="screen active" data-step="1"><h1>👤 কার জন্য Profile তৈরি করছেন?</h1><p>একবার নির্বাচন করুন। পরের ধাপগুলো সেই অনুযায়ী সহজ হবে।</p><div class="choices"><button type="button" class="choice" data-key="profileFor" data-value="Myself">🙋 নিজের জন্য</button><button type="button" class="choice" data-key="profileFor" data-value="Son">👦 ছেলে</button><button type="button" class="choice" data-key="profileFor" data-value="Daughter">👧 মেয়ে</button><button type="button" class="choice" data-key="profileFor" data-value="Brother">👨 ভাই</button><button type="button" class="choice" data-key="profileFor" data-value="Sister">👩 বোন</button><button type="button" class="choice" data-key="profileFor" data-value="Friend">🤝 বন্ধু</button><button type="button" class="choice" data-key="profileFor" data-value="Relative">👪 আত্মীয়</button></div><div class="hint">Myself নির্বাচন করলে নিজের তথ্যের জন্য Profile তৈরি হবে।</div></div>
<div class="screen" data-step="2"><h1>🌍 দেশ ও ভাষা</h1><p>ফোনের ভাষা ও সময় অঞ্চল দেখে শুরুতেই দেশ, ভাষা ও মাতৃভাষা অটো নির্বাচন করা হবে।</p><div class="field"><label>দেশ</label><select id="country"></select></div><div class="field"><label>ভাষা</label><select id="language"></select></div><div class="field"><label>মাতৃভাষা</label><select id="motherTongue"></select></div><div id="localeAuto" class="auto">✓ ডিভাইসের তথ্য অনুযায়ী অটো-সিলেক্ট করা হয়েছে</div></div>
<div class="screen" data-step="3"><h1>👤 আপনার মৌলিক তথ্য</h1><p>লিঙ্গ ও ধর্ম নির্বাচন করলেই পরের সিস্টেম অটো সাজবে।</p><div class="choices"><button type="button" class="choice" data-key="gender" data-value="পুরুষ">👨 পুরুষ</button><button type="button" class="choice" data-key="gender" data-value="নারী">👩 নারী</button></div><div class="field"><label>ধর্ম</label><select id="religion"><option value="">নির্বাচন করুন</option><option>ইসলাম</option><option>হিন্দু</option><option>বৌদ্ধ</option><option>খ্রিস্টান</option><option>অন্যান্য</option></select></div><div class="field"><label>সম্প্রদায় / মত</label><select id="community"><option value="">আগে ধর্ম নির্বাচন করুন</option></select></div><div id="religionAuto" class="auto">⚙️ ধর্ম নির্বাচন করলে Community অটো সাজবে।</div></div>
<div class="screen" data-step="4"><h1>📍 কোথায় থাকেন?</h1><p>বাংলাদেশ হলে বিভাগ নির্বাচন করলে জেলা অটো আসবে।</p><div class="field"><label>বিভাগ</label><select id="division"><option value="">বিভাগ নির্বাচন করুন</option><option>ঢাকা</option><option>চট্টগ্রাম</option><option>রাজশাহী</option><option>খুলনা</option><option>বরিশাল</option><option>সিলেট</option><option>রংপুর</option><option>ময়মনসিংহ</option></select></div><div class="field"><label>জেলা</label><select id="district"><option value="">আগে বিভাগ নির্বাচন করুন</option></select></div></div>
<div class="screen" data-step="5"><h1>❤️ কেমন জীবনসঙ্গী চান?</h1><p>শুরুতে প্রয়োজনীয় পছন্দ দিন। বিস্তারিত preference পরে নেওয়া যাবে।</p><div class="choices"><button type="button" class="choice" data-key="marital" data-value="অবিবাহিত">অবিবাহিত</button><button type="button" class="choice" data-key="marital" data-value="ডিভোর্সড">ডিভোর্সড</button><button type="button" class="choice" data-key="education" data-value="SSC+">SSC বা বেশি</button><button type="button" class="choice" data-key="religious" data-value="হ্যাঁ">ধর্মীয় জীবন গুরুত্বপূর্ণ</button></div></div>
<div class="screen finish" data-step="6"><div class="big">🎉</div><h1>Profile Setup প্রস্তুত!</h1><p>প্রাথমিক তথ্য সংরক্ষিত হয়েছে। এখন Smart Biodata-তে বিস্তারিত তথ্য পূরণ করুন।</p><a href="smart-biodata.html">📝 Smart Biodata শুরু করুন</a><a class="alt" href="matching.html">❤️ পরে Matching দেখুন</a></div>
<div class="actions" id="actions"><button class="back" id="back" type="button">← পিছনে</button><button class="next" id="next" type="button">পরের ধাপ →</button></div></section></main>
<script>
const KEY='joronOnboarding',state=JSON.parse(localStorage.getItem(KEY)||'{}');let step=1;const $=id=>document.getElementById(id),screens=[...document.querySelectorAll('.screen')],steps=[...document.querySelectorAll('.step')];const save=()=>localStorage.setItem(KEY,JSON.stringify(state));function render(){screens.forEach(s=>s.classList.toggle('active',+s.dataset.step===step));steps.forEach((s,i)=>{s.classList.toggle('active',i+1===step);s.classList.toggle('done',i+1<step)});$('bar').style.width=(step===6?100:step*20)+'%';$('back').style.visibility=step===1?'hidden':'visible';$('next').textContent=step===5?'শেষ করুন →':'পরের ধাপ →';$('actions').style.display=step===6?'none':'flex';document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',state[b.dataset.key]===b.dataset.value))}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice[data-key="'+b.dataset.key+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state[b.dataset.key]=b.dataset.value;save()});
const countries=[['BD','বাংলাদেশ','বাংলা'],['IN','ভারত','বাংলা'],['PK','পাকিস্তান','উর্দু'],['SA','সৌদি আরব','আরবি'],['AE','সংযুক্ত আরব আমিরাত','আরবি'],['GB','যুক্তরাজ্য','ইংরেজি'],['US','যুক্তরাষ্ট্র','ইংরেজি'],['CA','কানাডা','ইংরেজি'],['AU','অস্ট্রেলিয়া','ইংরেজি'],['MY','মালয়েশিয়া','মালয়'],['SG','সিঙ্গাপুর','ইংরেজি'],['IT','ইতালি','ইতালীয়'],['DE','জার্মানি','জার্মান'],['FR','ফ্রান্স','ফরাসি'],['JP','জাপান','জাপানি'],['OTHER','অন্যান্য','ইংরেজি']];const langs=['বাংলা','ইংরেজি','উর্দু','আরবি','হিন্দি','মালয়','ইতালীয়','জার্মান','ফরাসি','জাপানি','অন্যান্য'];const tongues=['বাংলা','ইংরেজি','উর্দু','হিন্দি','আরবি','অসমিয়া','মারাঠি','নেপালি','তামিল','তেলুগু','মালয়','অন্যান্য'];$('country').innerHTML=countries.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('');$('language').innerHTML=langs.map(x=>'<option>'+x+'</option>').join('');$('motherTongue').innerHTML=tongues.map(x=>'<option>'+x+'</option>').join('');const nav=(navigator.language||'').toLowerCase(),tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();let auto='BD';if(nav.startsWith('en-us'))auto='US';else if(nav.startsWith('en-gb')||tz.includes('london'))auto='GB';else if(nav.startsWith('hi')||tz.includes('kolkata')||tz.includes('delhi'))auto='IN';else if(nav.startsWith('ur-pk')||tz.includes('karachi')||tz.includes('islamabad'))auto='PK';else if(nav.startsWith('ar')||tz.includes('dubai')||tz.includes('riyadh'))auto=tz.includes('dubai')?'AE':'SA';$('country').value=state.country||auto;function locale(){const c=countries.find(x=>x[0]===$('country').value)||countries[0];$('language').value=state.language||c[2];$('motherTongue').value=state.motherTongue||(c[2]==='বাংলা'?'বাংলা':c[2]);state.country=$('country').value;state.language=$('language').value;state.motherTongue=$('motherTongue').value;save()}locale();$('country').onchange=()=>{const c=countries.find(x=>x[0]===$('country').value);state.country=$('country').value;$('language').value=c?c[2]:'ইংরেজি';$('motherTongue').value=c&&c[2]==='বাংলা'?'বাংলা':(c?c[2]:'ইংরেজি');state.language=$('language').value;state.motherTongue=$('motherTongue').value;save();$('localeAuto').textContent='✓ দেশ অনুযায়ী ভাষা ও মাতৃভাষা অটো সাজানো হয়েছে'};$('language').onchange=()=>{state.language=$('language').value;save()};$('motherTongue').onchange=()=>{state.motherTongue=$('motherTongue').value;save()};
const communities={ইসলাম:['সুন্নি','শিয়া','আহলে হাদিস','অন্যান্য'],হিন্দু:['সনাতন হিন্দু','অন্যান্য'],বৌদ্ধ:['থেরবাদ','অন্যান্য'],খ্রিস্টান:['ক্যাথলিক','প্রোটেস্ট্যান্ট','অন্যান্য'],অন্যান্য:['অন্যান্য']};function religion(){const r=$('religion').value;$('community').innerHTML='<option value="">নির্বাচন করুন</option>'+(communities[r]||[]).map(x=>'<option>'+x+'</option>').join('');if(state.community)$('community').value=state.community;if(r){state.religion=r;save();$('religionAuto').textContent='✓ '+r+' অনুযায়ী Community অটো সাজানো হয়েছে'}}$('religion').onchange=religion;$('community').onchange=()=>{state.community=$('community').value;save()};if(state.religion){$('religion').value=state.religion;religion()}
const districts={ঢাকা:['ঢাকা','গাজীপুর','নারায়ণগঞ্জ','নরসিংদী','মানিকগঞ্জ','মুন্সীগঞ্জ','টাঙ্গাইল','কিশোরগঞ্জ','ফরিদপুর','গোপালগঞ্জ','মাদারীপুর','রাজবাড়ী','শরীয়তপুর'],চট্টগ্রাম:['চট্টগ্রাম','কক্সবাজার','কুমিল্লা','ফেনী','নোয়াখালী','লক্ষ্মীপুর','চাঁদপুর','ব্রাহ্মণবাড়িয়া','রাঙ্গামাটি','খাগড়াছড়ি','বান্দরবান'],রাজশাহী:['রাজশাহী','বগুড়া','জয়পুরহাট','নওগাঁ','নাটোর','চাঁপাইনবাবগঞ্জ','পাবনা','সিরাজগঞ্জ'],খুলনা:['খুলনা','বাগেরহাট','চুয়াডাঙ্গা','যশোর','ঝিনাইদহ','কুষ্টিয়া','মাগুরা','মেহেরপুর','নড়াইল','সাতক্ষীরা'],বরিশাল:['বরিশাল','ভোলা','ঝালকাঠি','পটুয়াখালী','পিরোজপুর','বরগুনা'],সিলেট:['সিলেট','মৌলভীবাজার','হবিগঞ্জ','সুনামগঞ্জ'],রংপুর:['রংপুর','দিনাজপুর','কুড়িগ্রাম','গাইবান্ধা','লালমনিরহাট','নীলফামারী','পঞ্চগড়','ঠাকুরগাঁও'],ময়মনসিংহ:['ময়মনসিংহ','জামালপুর','নেত্রকোনা','শেরপুর']};function districtsFill(){const d=$('division').value;$('district').innerHTML='<option value="">জেলা নির্বাচন করুন</option>'+(districts[d]||[]).map(x=>'<option>'+x+'</option>').join('');if(state.district)$('district').value=state.district}$('division').onchange=()=>{state.division=$('division').value;state.district='';districtsFill();save()};$('district').onchange=()=>{state.district=$('district').value;save()};if(state.division){$('division').value=state.division;districtsFill()}
$('back').onclick=()=>{if(step>1){step--;render()}};$('next').onclick=()=>{if(step===1&&!state.profileFor)return alert('Profile কার জন্য তৈরি করছেন তা নির্বাচন করুন।');if(step===2&&!state.country)return alert('দেশ নির্বাচন করুন।');if(step===3&&(!state.gender||!state.religion))return alert('লিঙ্গ ও ধর্ম নির্বাচন করুন।');if(step===4&&!state.division)return alert('বিভাগ নির্বাচন করুন।');if(step<6)step++;render()};render();
</script></body></html>
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onboarding.html
          git commit -m 'feat: build LIMIT-style guided JORON profile setup' || true
          git push
          rm -f .github/workflows/joron-guided-profile-v2.yml
          git add -u .github/workflows/joron-guided-profile-v2.yml || true
          git commit -m 'chore: remove one-time guided profile workflow' || true
          git push || true
