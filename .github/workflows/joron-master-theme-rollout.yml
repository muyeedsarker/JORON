name: Roll out JORON Master Theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add master theme and UX polish to every active HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          markers=['assets/joron-master-theme.css','assets/joron-ux-polish.css','assets/joron-visual-redesign-v1.css','assets/joron-visual-redesign-v2.css']
          skip={
            'index-backup.html','index.html.before-design','index.html.before-home-premium',
            'index.html.before-premium','index_backup_before_new_design.html',
            'login.html.before-design','login.html.before-premium',
            'biodata.html.before-design','biodata.html.before-premium',
            'payment.html.before-design','payment.html.before-premium'
          }
          for p in Path('.').glob('*.html'):
              if p.name in skip or '.bak' in p.name or '.backup' in p.name:
                  continue
              s=p.read_text(encoding='utf-8')
              for marker in markers:
                  tag=f'<link rel="stylesheet" href="{marker}">'
                  if marker not in s and '</head>' in s:
                      s=s.replace('</head>',tag+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit rollout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add '*.html' assets/joron-master-theme.css assets/joron-ux-polish.css assets/joron-visual-redesign-v1.css assets/joron-visual-redesign-v2.css .github/workflows/joron-master-theme-rollout.yml
          if git diff --cached --quiet; then echo 'No rollout changes needed'; exit 0; fi
          git commit -m "Apply JORON visual redesign v2 across active pages"
          git push origin HEAD:main
