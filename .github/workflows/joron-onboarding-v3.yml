  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate onboarding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('onboarding.html')
          html='''<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7ef"><title>JORON — Create Profile</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fbf7ef,#fffdf8 55%,#f3e4e5);color:#2c2925;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}.wrap{width:min(620px,94%);margin:auto;padding:14px 0 28px}.card{background:#fffdf8;border:1px solid #dfcda8;border-radius:24px;box-shadow:0 10px 26px rgba(150,110,50,.08);padding:20px}.brand{text-align:center;color:#8d682d;font:800 33px "Playfair Display",serif;letter-spacing:2px}.tag{text-align:center;color:#746e65;margin:2px 0 17px}.progress{height:8px;background:#ead9b5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:16.67%;background:linear-gradient(90deg,#c79a45,#a85d68);transition:.2s}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:15px 0 19px}.step{text-align:center;font-size:9px;color:#746e65}.step b{display:flex;width:29px;height:29px;border:1px solid #dfcda8;border-radius:50%;align-items:center;justify-content:center;margin:auto auto 3px;background:#fbf7ef;color:#8d682d}.step.active b,.step.done b{background:#c79a45;color:#fff;border-color:#c79a45}.step.active{font-weight:900;color:#8d682d}.screen{display:none}.screen.active{display:block;animation:in .16s ease}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}h1{font-family:"Noto Serif Bengali","Hind Siliguri",sans-serif;color:#8d682d;font-size:23px;margin:0 0 6px}p{color:#746e65;font-size:13px;line-height:1.55;margin:0 0 13px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.choice{border:2px solid #dfcda8;background:#fff;border-radius:17px;padding:15px 8px;min-height:56px;text-align:center;font:800 15px "Hind Siliguri",sans-serif;color:#2c2925;cursor:pointer}.choice.selected{border-color:#c79a45;background:#fff8e8;box-shadow:0 0 0 3px #c79a4520}.field{margin:9px 0}.field label{display:block;font-weight:800;color:#493d35;font-size:13px;margin-bottom:5px}select{width:100%;height:48px;border:1px solid #dfcda8;border-radius:14px;background:#fff;padding:0 12px;font:inherit;color:#2c2925}.auto,.hint{display:block;padding:11px 12px;border-radius:13px;font-size:12px;font-weight:700;margin-top:11px}.auto{background:#edf5ed;border:1px solid #cbdacb;color:#536753}.hint{background:#f3e4e5;border:1px solid #ead9b5;color:#6b4c50}.actions{display:flex;gap:9px;margin-top:19px}.actions button{flex:1;min-height:48px;border-radius:15px;font:800 15px "Hind Siliguri",sans-serif;cursor:pointer}.back{background:#fff;border:1px solid #dfcda8;color:#746e65}.next{border:0;background:linear-gradient(135deg,#c79a45,#a85d68);color:#fff}.finish{text-align:center}.finish .big{font-size:45px}.finish a{display:flex;align-items:center;justify-content:center;min-height:49px;margin-top:10px;border-radius:15px;text-decoration:none;background:#c79a45;color:#fff;font-weight:900}.finish a.alt{background:#a85d68}@media(max-width:420px){.wrap{width:calc(100% - 18px);padding-top:9px}.card{padding:17px}.screen h1{font-size:21px}.step{font-size:8px}.step b{width:27px;height:27px}.choices{gap:8px}.choice{padding:13px 5px}}
</style></head><body><main class="wrap"><section class="card"><div class="brand">JORON</div><div class="tag">সম্পর্ক জুড়ে দেয় জোড়ন ❤️</div><div class="progress"><i id="bar"></i></div><div class="steps"><div class="step active"><b>1</b>কার জন্য</div><div class="step"><b>2</b>দেশ/ভাষা</div><div class="step"><b>3</b>আপনি</div><div class="step"><b>4</b>ঠিকানা</div><div class="step"><b>5</b>পছন্দ</div><div class="step"><b>6</b>শেষ</div></div><div class="screen active" data-step="1"><h1>👤 কার জন্য Profile তৈরি করছেন?</h1><p>একটি অপশন নির্বাচন করুন। তারপর শুধু <b>Next</b> চাপুন।</p><div class="choices"><button class="choice" data-key="profileFor" data-value="Myself">🙋 নিজের জন্য</button><button class="choice" data-key="profileFor" data-value="Son">👦 ছেলের জন্য</button><button class="choice" data-key="profileFor" data-value="Daughter">👧 মেয়ের জন্য</button><button class="choice" data-key="profileFor" data-value="Brother">👨 ভাইয়ের জন্য</button><button class="choice" data-key="profileFor" data-value="Sister">👩 বোনের জন্য</button><button class="choice" data-key="profileFor" data-value="Friend">🤝 বন্ধুর জন্য</button><button class="choice" data-key="profileFor" data-value="Relative">👪 আত্মীয়ের জন্য</button></div><div class="hint">✓ এই নির্বাচন Smart Biodata-তেও অটো যাবে।</div></div><div class="screen" data-step="2"><h1>🌍 দেশ ও ভাষা</h1><p>আপনার ফোনের ভাষা ও সময় অঞ্চল দেখে JORON সম্ভাব্য দেশ ও ভাষা নিজে বেছে নেবে।</p><div class="field"><label>দেশ</label><select id="country"></select></div><div class="field"><label>ভাষা</label><select id="language"></select></div><div class="field"><label>মাতৃভাষা</label><select id="motherTongue"></select></div><div class="auto" id="localeAuto">⚡ Smart Auto Detect চালু আছে</div></div><div class="screen" data-step="3"><h1>⚧ আপনার লিঙ্গ</h1><p>লিঙ্গ নির্বাচন করলেই Partner Gender অটো সেট হবে।</p><div class="choices"><button class="choice" data-key="gender" data-value="পুরুষ">👨 পুরুষ</button><button class="choice" data-key="gender" data-value="নারী">👩 নারী</button></div><div class="auto" id="partnerAuto">⚙️ Partner Gender অটো হবে</div></div><div class="screen" data-step="4"><h1>🕌 ধর্ম ও ঠিকানা</h1><p>ধর্মের সঙ্গে Community অটো বদলাবে। বাংলাদেশ হলে বিভাগ থেকে জেলা অটো আসবে।</p><div class="field"><label>ধর্ম</label><select id="religion"><option value="">নির্বাচন করুন</option><option>ইসলাম</option><option>হিন্দু</option><option>বৌদ্ধ</option><option>খ্রিস্টান</option><option>অন্যান্য</option></select></div><div class="field"><label>সম্প্রদায় / মত</label><select id="community"><option value="">আগে ধর্ম নির্বাচন করুন</option></select></div><div class="field"><label>বিভাগ</label><select id="division"><option value="">বিভাগ নির্বাচন করুন</option><option>ঢাকা</option><option>চট্টগ্রাম</option><option>রাজশাহী</option><option>খুলনা</option><option>বরিশাল</option><option>সিলেট</option><option>রংপুর</option><option>ময়মনসিংহ</option></select></div><div class="field"><label>জেলা</label><select id="district"><option value="">আগে বিভাগ নির্বাচন করুন</option></select></div></div><div class="screen" data-step="5"><h1>❤️ কেমন জীবনসঙ্গী চান?</h1><p>শুধু প্রাথমিক পছন্দ দিন। বিস্তারিত পরে Smart Biodata-তে পূরণ করা যাবে।</p><div class="choices"><button class="choice" data-key="marital" data-value="অবিবাহিত">💍 অবিবাহিত</button><button class="choice" data-key="marital" data-value="ডিভোর্সড">💞 ডিভোর্সড</button><button class="choice" data-key="education" data-value="SSC+">🎓 SSC বা বেশি</button><button class="choice" data-key="religious" data-value="হ্যাঁ">🕌 ধর্মীয় জীবন গুরুত্বপূর্ণ</button></div></div><div class="screen finish" data-step="6"><div class="big">🎉</div><h1>Profile Setup সম্পন্ন!</h1><p>আপনার প্রাথমিক তথ্য সংরক্ষিত হয়েছে। এখন Smart Biodata-তে এক ধাপ করে বিস্তারিত তথ্য দিন।</p><a href="smart-biodata.html">📝 Smart Biodata শুরু করুন</a><a class="alt" href="matching.html">❤️ Matching দেখুন</a></div><div class="actions" id="actions"><button class="back" id="back" type="button">← পিছনে</button><button class="next" id="next" type="button">Next →</button></div></section></main><script>
const KEY='joronOnboarding';let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}let step=Number(state.onboardingStep||1);if(step<1||step>6)step=1;const $=id=>document.getElementById(id),screens=[...document.querySelectorAll('.screen')],steps=[...document.querySelectorAll('.step')];const save=()=>{state.onboardingStep=step;localStorage.setItem(KEY,JSON.stringify(state))};function render(){screens.forEach(s=>s.classList.toggle('active',+s.dataset.step===step));steps.forEach((s,i)=>{s.classList.toggle('active',i+1===step);s.classList.toggle('done',i+1<step)});$('bar').style.width=(step/6*100)+'%';$('back').style.visibility=step===1?'hidden':'visible';$('next').textContent=step===5?'শেষ করুন →':'Next →';$('actions').style.display=step===6?'none':'flex';save();window.scrollTo({top:0,behavior:'smooth'})}const countries=[['BD','বাংলাদেশ','বাংলা'],['IN','ভারত','হিন্দি'],['PK','পাকিস্তান','উর্দু'],['SA','সৌদি আরব','আরবি'],['AE','সংযুক্ত আরব আমিরাত','আরবি'],['MY','মালয়েশিয়া','মালয়'],['SG','সিঙ্গাপুর','ইংরেজি'],['GB','যুক্তরাজ্য','ইংরেজি'],['US','যুক্তরাষ্ট্র','ইংরেজি'],['CA','কানাডা','ইংরেজি'],['AU','অস্ট্রেলিয়া','ইংরেজি'],['IT','ইতালি','ইতালীয়'],['DE','জার্মানি','জার্মান'],['FR','ফ্রান্স','ফরাসি'],['JP','জাপান','জাপানি'],['OTHER','অন্যান্য','অন্যান্য']];$('country').innerHTML=countries.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');const langs=['বাংলা','হিন্দি','উর্দু','আরবি','ইংরেজি','মালয়','ইতালীয়','জার্মান','ফরাসি','জাপানি','অন্যান্য'];$('language').innerHTML=langs.map(x=>`<option>${x}</option>`).join('');$('motherTongue').innerHTML=langs.map(x=>`<option>${x}</option>`).join('');function detect(){const l=(navigator.language||'').toLowerCase(),tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();let code='BD';if(l.startsWith('hi'))code='IN';else if(l.startsWith('ur'))code='PK';else if(l.startsWith('ar'))code=tz.includes('riyadh')?'SA':'AE';else if(l.startsWith('ms'))code='MY';else if(l.startsWith('it'))code='IT';else if(l.startsWith('de'))code='DE';else if(l.startsWith('fr'))code='FR';else if(l.startsWith('ja'))code='JP';else if(l.startsWith('en')){if(tz.includes('london'))code='GB';else if(tz.includes('toronto')||tz.includes('vancouver'))code='CA';else if(tz.includes('sydney')||tz.includes('melbourne'))code='AU';else if(tz.includes('america'))code='US'}const x=countries.find(a=>a[0]===code)||countries[0];$('country').value=state.country||x[0];$('language').value=state.language||x[2];$('motherTongue').value=state.motherTongue||x[2];$('localeAuto').textContent=state.country?'✓ আপনার আগের নির্বাচন রাখা হয়েছে':'✓ ডিভাইস অনুযায়ী দেশ ও ভাষা অটো নির্বাচন হয়েছে'}detect();$('country').onchange=()=>{state.country=$('country').value;const x=countries.find(a=>a[0]===state.country);if(x){$('language').value=x[2];$('motherTongue').value=x[2];state.language=x[2];state.motherTongue=x[2]}save()};$('language').onchange=()=>{state.language=$('language').value;save()};$('motherTongue').onchange=()=>{state.motherTongue=$('motherTongue').value;save()};const communities={ইসলাম:['সুন্নি','শিয়া','আহলে হাদিস','অন্যান্য'],হিন্দু:['সনাতন হিন্দু','অন্যান্য'],বৌদ্ধ:['থেরবাদ','অন্যান্য'],খ্রিস্টান:['ক্যাথলিক','প্রোটেস্ট্যান্ট','অন্যান্য'],অন্যান্য:['অন্যান্য']};$('religion').onchange=()=>{state.religion=$('religion').value;$('community').innerHTML='<option value="">নির্বাচন করুন</option>'+(communities[state.religion]||[]).map(x=>`<option>${x}</option>`).join('');save()};$('community').onchange=()=>{state.community=$('community').value;save()};const divisions={ঢাকা:['ঢাকা','গাজীপুর','নারায়ণগঞ্জ','নরসিংদী','মানিকগঞ্জ','মুন্সীগঞ্জ','টাঙ্গাইল','কিশোরগঞ্জ','ফরিদপুর','গোপালগঞ্জ','মাদারীপুর','রাজবাড়ী','শরীয়তপুর'],চট্টগ্রাম:['চট্টগ্রাম','কুমিল্লা','ফেনী','ব্রাহ্মণবাড়িয়া','চাঁদপুর','লক্ষ্মীপুর','নোয়াখালী','কক্সবাজার','রাঙ্গামাটি','খাগড়াছড়ি','বান্দরবান'],রাজশাহী:['রাজশাহী','বগুড়া','পাবনা','সিরাজগঞ্জ','নাটোর','জয়পুরহাট','চাঁপাইনবাবগঞ্জ','নওগাঁ'],খুলনা:['খুলনা','যশোর','সাতক্ষীরা','বাগেরহাট','ঝিনাইদহ','মাগুরা','নড়াইল','কুষ্টিয়া','চুয়াডাঙ্গা','মেহেরপুর'],বরিশাল:['বরিশাল','ভোলা','পটুয়াখালী','পিরোজপুর','বরগুনা','ঝালকাঠি'],সিলেট:['সিলেট','মৌলভীবাজার','হবিগঞ্জ','সুনামগঞ্জ'],রংপুর:['রংপুর','দিনাজপুর','গাইবান্ধা','কুড়িগ্রাম','লালমনিরহাট','নীলফামারী','পঞ্চগড়','ঠাকুরগাঁও'],ময়মনসিংহ:['ময়মনসিংহ','জামালপুর','নেত্রকোনা','শেরপুর']};$('division').onchange=()=>{$('district').innerHTML='<option value="">জেলা নির্বাচন করুন</option>'+(divisions[$('division').value]||[]).map(x=>`<option>${x}</option>`).join('');state.division=$('division').value;state.district='';save()};$('district').onchange=()=>{state.district=$('district').value;save()};document.querySelectorAll('.choice').forEach(b=>{b.type='button';b.onclick=()=>{const k=b.dataset.key;document.querySelectorAll('.choice[data-key="'+k+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state[k]=b.dataset.value;if(k==='gender'){state.partnerGender=b.dataset.value==='পুরুষ'?'নারী':'পুরুষ';$('partnerAuto').textContent='✓ Partner Gender অটো: '+state.partnerGender}save()}});function restore(){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',state[b.dataset.key]===b.dataset.value));if(state.gender){state.partnerGender=state.partnerGender||(state.gender==='পুরুষ'?'নারী':'পুরুষ');$('partnerAuto').textContent='✓ Partner Gender অটো: '+state.partnerGender}$('religion').value=state.religion||'';$('religion').dispatchEvent(new Event('change'));$('community').value=state.community||'';$('country').value=state.country||$('country').value;$('language').value=state.language||$('language').value;$('motherTongue').value=state.motherTongue||$('motherTongue').value;$('division').value=state.division||'';$('division').dispatchEvent(new Event('change'));$('district').value=state.district||''}function valid(){if(step===1)return!!state.profileFor;if(step===3)return!!state.gender;if(step===4)return!!state.religion;return true}$('back').onclick=()=>{if(step>1){step--;render()}};$('next').onclick=()=>{if(!valid()){alert('এই ধাপের তথ্য নির্বাচন করুন।');return}if(step<5){step++;render()}else{step=6;render()}};restore();render();
</script></body></html>'''
          p.write_text(html,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
