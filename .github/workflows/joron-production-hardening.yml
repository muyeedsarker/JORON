name: JORON Production Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, 'JORON: Apply production hardening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe backend and persistence hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          signup = (root/'signup.html').read_text(encoding='utf-8')
          m = re.search(r'(?:const|let|var)\s+firebaseConfig\s*=\s*(\{.*?\})\s*;', signup, re.S)
          if not m:
              raise SystemExit('firebaseConfig not found in signup.html')

          cfg = m.group(1)
          assets = root/'assets'
          assets.mkdir(exist_ok=True)
          (assets/'firebase-config.js').write_text(
              'export const firebaseConfig = '+cfg+';\n', encoding='utf-8'
          )

          bio = root/'smart-biodata.html'
          s = bio.read_text(encoding='utf-8')
          marker = '<!-- JORON-FIRESTORE-BIODATA-V1 -->'
          if marker not in s:
              module = r'''<!-- JORON-FIRESTORE-BIODATA-V1 -->
          <script type="module">
          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
          import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
          import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
          import { firebaseConfig } from "./assets/firebase-config.js";

          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);
          const form = document.getElementById("form");
          const notice = document.getElementById("notice");
          const ids = ["name","nickname","dob","age","gender","height","blood","marital","nationality","language","religion","practice","division","district","upazila","postOffice","area","pdistrict","addressPrivacy","eduSystem","education","institution","profession","income","about"];
          const safeIds = ["name","nickname","age","gender","height","marital","division","district","upazila","eduSystem","education","profession"];

          function valueOf(id){ const el=document.getElementById(id); return el ? (el.type === "checkbox" ? el.checked : el.value) : ""; }
          function collect(){ const data={}; ids.forEach(id=>{const el=document.getElementById(id); if(el) data[id]=valueOf(id);}); return data; }
          function fill(data){ ids.forEach(id=>{const el=document.getElementById(id); if(!el || data[id]===undefined) return; if(el.type !== "checkbox") el.value=data[id] ?? "";}); }
          function publicProjection(data){ const out={}; safeIds.forEach(id=>{if(data[id]!==undefined) out[id]=data[id];}); return out; }

          onAuthStateChanged(auth, async user => {
            if(!user){ location.href = "login.html?next=smart-biodata.html"; return; }
            try{
              const snap = await getDoc(doc(db,"biodata",user.uid));
              if(snap.exists()) fill(snap.data());
            }catch(e){ console.error("JORON biodata load failed",e); }
          });

          form?.addEventListener("submit", async ev => {
            ev.preventDefault();
            ev.stopImmediatePropagation();
            const user=auth.currentUser;
            if(!user){ alert("আগে Login করুন।"); location.href="login.html?next=smart-biodata.html"; return; }
            const data=collect();
            data.uid=user.uid;
            data.email=user.email || "";
            data.updatedAt=serverTimestamp();
            try{
              await setDoc(doc(db,"biodata",user.uid),data,{merge:true});
              await setDoc(doc(db,"publicProfiles",user.uid),{...publicProjection(data),uid:user.uid,updatedAt:serverTimestamp()},{merge:true});
              localStorage.setItem("joronSmartBiodata",JSON.stringify({...data,updatedAt:Date.now()}));
              if(notice){ notice.textContent="❤️ আপনার Smart Biodata Firebase-এ সংরক্ষিত হয়েছে।"; notice.style.display="block"; }
              alert("Smart Biodata সফলভাবে সংরক্ষিত হয়েছে।");
            }catch(e){ console.error(e); alert("তথ্য সংরক্ষণ করা যায়নি। Firebase/নেটওয়ার্ক সংযোগ পরীক্ষা করুন।"); }
          }, true);
          </script>
          '''
              s = s.replace('</body>', module + '\n</body>')
              bio.write_text(s, encoding='utf-8')

          for name in ['profiles.html','matching.html']:
              p=root/name
              if p.exists():
                  t=p.read_text(encoding='utf-8')
                  t=t.replace('collection(db,"biodata")','collection(db,"publicProfiles")')
                  t=t.replace("collection(db, 'biodata')","collection(db, 'publicProfiles')")
                  t=t.replace('collection(db,`biodata`)', 'collection(db,`publicProfiles`)')
                  p.write_text(t,encoding='utf-8')

          lp=root/'login.html'
          if lp.exists():
              t=lp.read_text(encoding='utf-8')
              t=t.replace('<b>100%</b><span>নিরাপদ প্ল্যাটফর্ম</span>','<b>🔐</b><span>Privacy-first</span>')
              t=t.replace('100% নিরাপদ প্ল্যাটফর্ম','Privacy-first platform')
              t=t.replace('100% নিরাপদ','Privacy-first')
              lp.write_text(t,encoding='utf-8')

          rules = r'''rules_version = '2';

          service cloud.firestore {
            match /databases/{database}/documents {
              function signedIn() { return request.auth != null; }
              function own(uid) { return signedIn() && request.auth.uid == uid; }

              match /biodata/{userId} {
                allow read, create, update, delete: if own(userId);
              }

              match /publicProfiles/{userId} {
                allow read: if signedIn();
                allow create, update, delete: if own(userId);
              }

              match /interests/{interestId} {
                allow create: if signedIn()
                  && request.resource.data.fromUserId == request.auth.uid
                  && request.resource.data.profileId != request.auth.uid
                  && request.resource.data.status == 'pending';
                allow read: if signedIn()
                  && (resource.data.fromUserId == request.auth.uid || resource.data.profileId == request.auth.uid);
                allow update: if signedIn()
                  && resource.data.profileId == request.auth.uid
                  && request.resource.data.fromUserId == resource.data.fromUserId
                  && request.resource.data.profileId == resource.data.profileId
                  && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','updatedAt'])
                  && request.resource.data.status in ['pending','accepted','rejected'];
                allow delete: if signedIn() && resource.data.fromUserId == request.auth.uid;
              }

              match /users/{userId} {
                allow read: if own(userId);
                allow create: if own(userId)
                  && (!request.resource.data.keys().hasAny(['membershipStatus','admin','isAdmin']) || request.resource.data.membershipStatus == 'pending');
                allow update: if own(userId)
                  && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['admin','isAdmin'])
                  && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['membershipStatus','paymentStatus'])
                    || (request.resource.data.membershipStatus == 'pending' && request.resource.data.paymentStatus == 'pending'));
                allow delete: if own(userId);
              }

              match /payments/{userId} {
                allow read: if own(userId);
                allow create: if own(userId)
                  && request.resource.data.uid == request.auth.uid
                  && request.resource.data.paymentStatus == 'pending'
                  && request.resource.data.membershipStatus == 'pending';
                allow update: if own(userId)
                  && request.resource.data.uid == resource.data.uid
                  && request.resource.data.paymentStatus == 'pending'
                  && request.resource.data.membershipStatus == 'pending'
                  && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['senderNumber','transactionId','updatedAt']);
                allow delete: if own(userId);
              }

              match /chats/{chatId} {
                allow read, create: if signedIn()
                  && chatId.matches('^' + request.auth.uid + '_.*$|^.*_' + request.auth.uid + '$');
                match /messages/{messageId} {
                  allow read, create: if signedIn()
                    && chatId.matches('^' + request.auth.uid + '_.*$|^.*_' + request.auth.uid + '$')
                    && request.resource.data.senderId == request.auth.uid;
                  allow update, delete: if signedIn()
                    && chatId.matches('^' + request.auth.uid + '_.*$|^.*_' + request.auth.uid + '$')
                    && resource.data.senderId == request.auth.uid;
                }
              }

              match /{document=**} { allow read, write: if false; }
            }
          }
          '''
          (root/'firestore.rules').write_text(rules,encoding='utf-8')
          PY

          git config user.name "JORON Hardening Bot"
          git config user.email "joron-hardening@users.noreply.github.com"
          git add assets/firebase-config.js smart-biodata.html profiles.html matching.html login.html firestore.rules
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "JORON: Production hardening applied [skip ci]"
          git push
