name: Apply JORON Reference Theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared theme and universal Home/Back controls
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='assets/joron-reference-theme.css'
          nav_marker='joron-global-page-nav'
          nav_html='''<div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div>'''
          nav_css='''<style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%!important;display:flex!important;flex-direction:row!important;gap:10px!important;justify-content:center!important;align-items:stretch!important;padding:14px 0 24px!important;margin:0!important;clear:both!important;box-sizing:border-box!important}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0!important;width:50%!important;max-width:360px!important;height:54px!important;min-height:54px!important;box-sizing:border-box!important;margin:0!important;padding:0 16px!important;display:flex!important;align-items:center!important;justify-content:center!important;vertical-align:middle!important;border:2px solid rgba(255,255,255,.95)!important;border-radius:15px!important;color:#fff!important;background:linear-gradient(135deg,#087b59,#10a978)!important;font:900 15px/1 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif!important;text-decoration:none!important;cursor:pointer!important;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35)!important;transition:filter .2s!important;appearance:none!important;-webkit-appearance:none!important}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)!important}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:none!important;filter:brightness(1.06)!important}@media(max-width:600px){.joron-global-page-nav{gap:6px!important;padding:12px 2px 20px!important}.joron-global-page-nav a,.joron-global-page-nav button{width:50%!important;height:50px!important;min-height:50px!important;padding:0 8px!important;font-size:13px!important;border-width:1.5px!important;border-radius:12px!important}}</style>'''
          skip={'index-backup.html','index.html.before-design','index.html.before-home-premium','index.html.before-premium','index_backup_before_new_design.html','login.html.before-design','login.html.before-premium','biodata.html.before-design','biodata.html.before-premium','payment.html.before-design','payment.html.before-premium'}
          for p in Path('.').glob('*.html'):
              if p.name in skip or '.bak' in p.name or '.backup' in p.name: continue
              s=p.read_text(encoding='utf-8')
              if marker not in s and '</head>' in s: s=s.replace('</head>',f'<link rel="stylesheet" href="{marker}"></head>',1)
              if p.name!='index.html' and nav_marker not in s and '</body>' in s: s=s.replace('</body>',nav_css+nav_html+'</body>',1)
              p.write_text(s,encoding='utf-8')
          for p in Path('.').glob('TEMP_CHECK*.txt'): p.unlink()
          PY
      - name: Commit theme rollout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' assets/joron-reference-theme.css .github/workflows/joron-reference-theme.yml
          git add -u TEMP_CHECK.txt TEMP_CHECK2.txt TEMP_CHECK3.txt || true
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m "Perfectly align universal JORON Home and Back buttons"
          git push origin HEAD:main
