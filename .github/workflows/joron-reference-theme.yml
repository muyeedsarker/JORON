name: Apply JORON Master Theme v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply master visual theme without changing functionality
        run: |
          python - <<'PY'
          from pathlib import Path

          master='assets/joron-master-theme-v2.css'
          reference='assets/joron-reference-theme.css'
          master_marker='joron-master-theme-v2-link'
          nav_marker='joron-global-page-nav'
          nav_html='''<div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div>'''
          nav_css='''<style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%!important;display:flex!important;flex-direction:row!important;gap:10px!important;justify-content:center!important;align-items:stretch!important;padding:14px 0 24px!important;margin:0!important;clear:both!important;box-sizing:border-box!important}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0!important;width:50%!important;max-width:360px!important;height:54px!important;min-height:54px!important;box-sizing:border-box!important;margin:0!important;padding:0 16px!important;display:flex!important;align-items:center!important;justify-content:center!important;border:2px solid rgba(255,255,255,.95)!important;border-radius:999px!important;color:#fff!important;background:linear-gradient(135deg,#e81768,#a33ac7)!important;font:900 15px/1 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif!important;text-decoration:none!important;cursor:pointer!important;box-shadow:0 9px 24px rgba(232,23,104,.25),inset 0 1px 0 rgba(255,255,255,.3)!important;appearance:none!important;-webkit-appearance:none!important}.joron-global-page-nav button{background:linear-gradient(135deg,#6f2aa5,#a33ac7)!important}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{filter:brightness(1.08)!important}@media(max-width:600px){.joron-global-page-nav{gap:6px!important;padding:12px 2px 20px!important}.joron-global-page-nav a,.joron-global-page-nav button{width:50%!important;height:50px!important;min-height:50px!important;padding:0 8px!important;font-size:13px!important;border-width:1.5px!important}}

/* JORON Global Brand */
.joron-brand-equal,.brand,.brand div,.headin .brand{font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif!important}
.joron-brand-equal{display:inline-flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important;text-align:center!important;line-height:1.08!important}
.joron-brand-equal .joron-name,.joron-brand-equal .joron-tagline{font-size:clamp(17px,4.4vw,27px)!important;font-weight:900!important;line-height:1.08!important;margin:0!important;padding:0!important}
.joron-brand-equal .joron-name{color:#fff!important}.joron-brand-equal .joron-tagline{color:#f1cde0!important}.joron-brand-equal .heart{color:#ff4fa3!important}
.brand small,.brand .tagline{font-weight:900!important;line-height:1.08!important}
</style>'''

          skip={
            'index-backup.html','index.html.before-design','index.html.before-home-premium','index.html.before-premium',
            'index_backup_before_new_design.html','login.html.before-design','login.html.before-premium',
            'biodata.html.before-design','biodata.html.before-premium','payment.html.before-design','payment.html.before-premium'
          }

          for p in Path('.').glob('*.html'):
              if p.name in skip or '.bak' in p.name or '.backup' in p.name:
                  continue
              s=p.read_text(encoding='utf-8')
              if '</head>' not in s:
                  continue
              if master_marker not in s:
                  s=s.replace('</head>',f'<link id="{master_marker}" rel="stylesheet" href="{master}"></head>',1)
              if reference not in s:
                  s=s.replace('</head>',f'<link rel="stylesheet" href="{reference}"></head>',1)
              if p.name!='index.html' and nav_marker not in s and '</body>' in s:
                  s=s.replace('</body>',nav_css+nav_html+'</body>',1)
              p.write_text(s,encoding='utf-8')

          for p in Path('.').glob('TEMP_CHECK*.txt'):
              p.unlink()
          PY
      - name: Commit theme rollout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' assets/joron-master-theme-v2.css assets/joron-reference-theme.css .github/workflows/joron-reference-theme.yml
          git add -u TEMP_CHECK.txt TEMP_CHECK2.txt TEMP_CHECK3.txt || true
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m "Apply JORON Master Theme v2 across all pages"
          git push origin HEAD:main
