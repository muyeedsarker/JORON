name: JORON Smart Biodata automation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/joron-smart-biodata-auto.yml'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance guided auto selections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/smart-biodata-firebase-legacy.js')
          s=p.read_text()
          marker='function initGuidedSteps(){'
          if 'JORON AUTO PROFILE PANEL v1' not in s:
              inject=r'''
// JORON AUTO PROFILE PANEL v1 — visible Profile-for, partner gender and mother tongue helpers.
function initAutoProfilePanel(){
 const form=document.getElementById('form'); if(!form)return;
 const sections=[...form.querySelectorAll(':scope > section.card')]; if(!sections.length)return;
 const personal=sections[0];
 const panel=document.createElement('div'); panel.id='joronAutoProfilePanel'; panel.className='card';
 panel.innerHTML=`<h2>✨ Smart Auto Selection</h2><p class="hint">একটি তথ্য নির্বাচন করলে JORON প্রয়োজনীয় পরের তথ্য নিজে সাজিয়ে দেবে।</p><div class="grid">
 <div class="field"><label>এই Profile কার জন্য?<select id="profileForSelect"><option value="">নির্বাচন করুন</option><option value="Myself">নিজের জন্য (Myself)</option><option value="Son">ছেলের জন্য (Son)</option><option value="Daughter">মেয়ের জন্য (Daughter)</option><option value="Brother">ভাইয়ের জন্য (Brother)</option><option value="Sister">বোনের জন্য (Sister)</option><option value="Friend">বন্ধুর জন্য (Friend)</option><option value="Relative">আত্মীয়ের জন্য (Relative)</option></select></label></div>
 <div class="field"><label>জীবনসঙ্গী হিসেবে খুঁজছি<select id="partnerGenderSelect"><option value="">অটো নির্বাচন হবে</option><option value="পুরুষ">পুরুষ</option><option value="নারী">নারী</option></select></label></div>
 <div class="field"><label>মাতৃভাষা<select id="motherTongueSelect"><option>বাংলা</option><option>হিন্দি</option><option>উর্দু</option><option>আরবি</option><option>ইংরেজি</option><option>অন্যান্য</option></select></label></div>
 <div class="field"><label>দেশ <select id="countrySelect"><option value="BD">বাংলাদেশ</option><option value="IN">ভারত</option><option value="PK">পাকিস্তান</option><option value="SA">সৌদি আরব</option><option value="AE">সংযুক্ত আরব আমিরাত</option><option value="MY">মালয়েশিয়া</option><option value="GB">যুক্তরাজ্য</option><option value="US">যুক্তরাষ্ট্র</option><option value="CA">কানাডা</option><option value="AU">অস্ট্রেলিয়া</option><option value="OTHER">অন্যান্য</option></select></label></div></div>`;
 personal.insertBefore(panel,personal.firstElementChild);
 const pf=document.getElementById('profileForSelect'),pg=document.getElementById('partnerGenderSelect'),mt=document.getElementById('motherTongueSelect'),cs=document.getElementById('countrySelect'),g=document.getElementById('gender'),lang=document.getElementById('language'),nat=document.getElementById('nationality');
 let o={};try{o=JSON.parse(localStorage.getItem('joronOnboarding')||'{}')||{}}catch{}
 if(o.profileFor)pf.value=o.profileFor;
 const setPartner=()=>{const v=g?.value;const pv=v==='পুরুষ'?'নারী':v==='নারী'?'পুরুষ':'';if(pv){pg.value=pv;ensureHidden('partnerGender',pv)}};
 if(o.partnerGender)pg.value=o.partnerGender; else setPartner();
 if(o.language){lang.value=o.language;mt.value=o.language==='বাংলা'?'বাংলা':mt.value}
 if(o.country)cs.value=o.country;
 const countryNames={BD:'বাংলাদেশি',IN:'ভারতীয়',PK:'পাকিস্তানি',SA:'সৌদি আরবের',AE:'সংযুক্ত আরব আমিরাতের',MY:'মালয়েশীয়',GB:'ব্রিটিশ',US:'আমেরিকান',CA:'কানাডিয়ান',AU:'অস্ট্রেলিয়ান',OTHER:''};
 const saveState=()=>{try{const x=JSON.parse(localStorage.getItem('joronOnboarding')||'{}')||{};x.profileFor=pf.value;x.partnerGender=pg.value;x.country=cs.value;x.motherTongue=mt.value;localStorage.setItem('joronOnboarding',JSON.stringify(x))}catch{}};
 pf.onchange=()=>{ensureHidden('profileFor',pf.value);saveState()}; pg.onchange=()=>{ensureHidden('partnerGender',pg.value);saveState()}; mt.onchange=()=>{ensureHidden('motherTongue',mt.value);saveState()}; cs.onchange=()=>{ensureHidden('country',cs.value);if(nat&&!nat.value&&countryNames[cs.value])nat.value=countryNames[cs.value];saveState()}; g?.addEventListener('change',()=>{setPartner();saveState()});
 ensureHidden('profileFor',pf.value);ensureHidden('partnerGender',pg.value);ensureHidden('motherTongue',mt.value);ensureHidden('country',cs.value);
}
initAutoProfilePanel();

'''
              s=s.replace(marker,inject+marker,1)
              p.write_text(s)
          PY
      - name: Commit enhancement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/smart-biodata-firebase-legacy.js
          git diff --cached --quiet || git commit -m 'feat: add visible profile-for and smart auto selections'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/joron-smart-biodata-auto.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time Smart Biodata workflow' || true
          git push || true

# one-time trigger refresh
