name: JORON 2026 Theme Migration

on:
  push:
    branches: [main]
    paths:
      - 'assets/joron-theme-2026.css'
      - '.github/workflows/joron-theme-2026-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'JORON 2026')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive legacy CSS and duplicate HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/_archive/html-backups assets/_archive/css
          find assets -maxdepth 1 -type f -name '*.css' ! -name 'joron-theme-2026.css' -print0 | while IFS= read -r -d '' f; do mv "$f" assets/_archive/css/; done
          if [ -f joron-theme.css ]; then mv joron-theme.css assets/_archive/css/; fi
          shopt -s nullglob
          for f in *-backup*.html *.bak *.before-* *.backup joron-splash-login-*.html JORON-splash-login-*.html login-fixed.html signup-professional-preview.html; do
            [ -f "$f" ] || continue
            mv "$f" assets/_archive/html-backups/
          done
      - name: Wire single theme into production HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          theme='<link rel="stylesheet" href="assets/joron-theme-2026.css">'
          tag_re=re.compile(r'<link\b[^>]*?rel=["\']stylesheet["\'][^>]*?>',re.I|re.S)
          href_re=re.compile(r'href=["\'][^"\']+\.css(?:\?[^"\']*)?["\']',re.I)
          for p in sorted(Path('.').glob('*.html')):
              text=p.read_text(encoding='utf-8')
              new=tag_re.sub(lambda m:'' if href_re.search(m.group(0)) else m.group(0),text)
              if 'assets/joron-theme-2026.css' not in new:
                  marker=re.search(r'</head\s*>',new,re.I)
                  if not marker: raise SystemExit(f'No </head> found in {p}')
                  new=new[:marker.start()]+theme+'\n'+new[marker.start():]
              if new!=text: p.write_text(new,encoding='utf-8')
          PY
      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > assets/_archive/README.md <<'EOF'
          # JORON archive
          Legacy CSS overrides and backup/preview HTML files are retained here for rollback.
          Production pages use `assets/joron-theme-2026.css` as the single site theme.
          Functional Firebase/auth/Firestore scripts and existing form IDs were not intentionally renamed.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: migrate JORON to 2026 single theme' || true
          git push
          git rm .github/workflows/joron-theme-2026-migration.yml
          git commit -m 'chore: remove one-time JORON 2026 migration workflow'
          git push
