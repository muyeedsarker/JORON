name: Patch Smart Biodata onboarding bridge
on:
  push:
    paths:
      - '.github/workflows/patch-biodata-onboarding-bridge.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/smart-biodata-firebase-legacy.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const sections=[...form.querySelectorAll(":scope > section.card")];if(!sections.length)return;', 'if(document.getElementById("joronAutoProfilePanel"))return;\n const sections=[...form.querySelectorAll(":scope > .card")];if(!sections.length)return;', 1)
          s=s.replace('const sections=[...form.querySelectorAll(":scope > section.card")];\n if(sections.length<2)return;', 'const sections=[...form.querySelectorAll(":scope > .card")];\n if(sections.length<2)return;', 1)
          s=s.replace('if(o.language){lang.value=o.language;mt.value=o.language==="বাংলা"?"বাংলা":mt.value}', 'const languageNames={bn:"বাংলা",en:"ইংরেজি",hi:"হিন্দি",ur:"উর্দু",ar:"আরবি",ms:"মালয়",it:"ইতালীয়",de:"জার্মান",fr:"ফরাসি",ja:"জাপানি",ko:"কোরিয়ান"};\n if(o.language){const ln=languageNames[o.language]||o.language;if(lang&&!lang.value)lang.value=ln;if(mt&&!mt.value)mt.value=ln}\n if(o.motherTongue){const mtName=languageNames[o.motherTongue]||o.motherTongue;if(mt)mt.value=mtName;ensureHidden("motherTongue",mtName)}', 1)
          s=s.replace('if(o.country)cs.value=o.country;', 'if(o.country)cs.value=o.country;\n if(o.country)ensureHidden("country",o.country);', 1)
          s=s.replace('if(o.profileFor)pf.value=o.profileFor;', 'if(o.profileFor)pf.value=o.profileFor;\n ensureHidden("profileFor",pf.value);', 1)
          old='if(o.partnerGender)pg.value=o.partnerGender;else setPartner();'
          new='if(o.partnerGender)pg.value=o.partnerGender;else setPartner();\n ensureHidden("partnerGender",pg.value);'
          s=s.replace(old,new,1)
          s=s.replace('if(o.gender && !o.partnerGender){ensureHidden("partnerGender",o.gender==="পুরুষ"?"নারী":"পুরুষ")}', 'if(o.gender && !o.partnerGender){ensureHidden("partnerGender",o.gender==="পুরুষ"?"নারী":"পুরুষ")}\n',1)
          s=s.replace('if(s.exists()){fill(s.data());ageFromDob();autoProfileLogic();initAutoProfilePanel()}', 'if(s.exists()){fill(s.data());ageFromDob();applyOnboarding();autoProfileLogic();initAutoProfilePanel()}else{applyOnboarding();}', 1)
          marker='initAutoProfilePanel();\n\nfunction initGuidedSteps(){'
          bridge='''initAutoProfilePanel();\n\nfunction syncOnboardingAddress(){\n try{\n  const o=JSON.parse(localStorage.getItem("joronOnboarding")||"{}")||{};\n  const d=document.getElementById("division"),dist=document.getElementById("district");\n  if(d && !d.value && o.division){d.value=o.division;d.dispatchEvent(new Event("change",{bubbles:true}))}\n  setTimeout(()=>{if(dist && !dist.value && o.district){dist.value=o.district;dist.dispatchEvent(new Event("change",{bubbles:true}))}},120);\n }catch(e){console.warn("JORON address bridge",e)}\n}\ndocument.addEventListener("joron-address-ready",syncOnboardingAddress);\n\nfunction initGuidedSteps(){'''
          if marker in s:s=s.replace(marker,bridge,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/smart-biodata-firebase-legacy.js .github/workflows/patch-biodata-onboarding-bridge.yml
          git commit -m 'fix: sync onboarding data into Smart Biodata reliably' || exit 0
          git rm .github/workflows/patch-biodata-onboarding-bridge.yml
          git commit -m 'chore: remove one-time biodata patch workflow'
          git push