name: Final JORON Home Cleanup
on:
  push:
    paths:
      - ".github/workflows/remove-success-and-yes.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Success and top Yes button only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('J❤️R❤️N <span>Success</span>', 'J❤️R❤️N', 1)
          # Remove the green verification check attached to the brand only.
          s=s.replace('.brand:after{content:"✓"!important}', '.brand:after{content:""!important;display:none!important}', 1)
          s=s.replace('.brand:after{content:"✓";', '.brand:after{content:"";display:none!important;', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove Success and top verification button from JORON home"
          git push
