name: Final JORON Home Cleanup
on:
  push:
    paths:
      - ".github/workflows/remove-success-and-yes.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only Success and top verification check
        run: |
          sed -i 's/J❤️R❤️N <span>Success<\/span>/J❤️R❤️N/' index.html
          sed -i 's/\.brand:after{content:"✓"!important}/.brand:after{content:""!important;display:none!important}/' index.html
          sed -i 's/\.brand:after{content:"✓";/.brand:after{content:"";display:none!important;/' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Success and top verification check from JORON home"
          git push
