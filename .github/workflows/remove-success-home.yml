name: Remove Success from JORON Home
on:
  push:
    paths:
      - ".github/workflows/remove-success-home.yml"
permissions:
  contents: write
jobs:
  fix-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Success text only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='J❤️R❤️N <span>Success</span>'
          new='J❤️R❤️N'
          if old in s:
              s=s.replace(old,new,1)
          else:
              s=s.replace('<span>Success</span>','',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove Success from JORON home heading"
          git push
