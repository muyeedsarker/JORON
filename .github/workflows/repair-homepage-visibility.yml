name: JORON Homepage Visibility Repair

on:
  push:
    paths:
      - '.github/workflows/repair-homepage-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair homepage visibility without changing design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'joron-emergency-visibility-fix'
          css = '''<style id="joron-emergency-visibility-fix">
          html, body { visibility: visible !important; opacity: 1 !important; }
          body { display: block !important; }
          header, main, footer, section, nav, .wrap, .top, .head, .hero, .hero-card, .quick, .quick-grid, .showcase, .section, .cards, .card, .cta { visibility: visible !important; opacity: 1 !important; }
          </style>'''
          if marker not in s:
              if '</head>' not in s:
                  raise SystemExit('ERROR: index.html has no closing </head>; refusing to modify it')
              s = s.replace('</head>', css + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify homepage structure
        shell: bash
        run: |
          test -s index.html
          grep -q '<html' index.html
          grep -q '<body' index.html
          grep -q '</body>' index.html
          grep -q '</html>' index.html
          grep -q 'joron-emergency-visibility-fix' index.html
          echo 'JORON homepage structure and visibility override verified.'

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git commit -m 'Repair JORON homepage visibility'
          git push
