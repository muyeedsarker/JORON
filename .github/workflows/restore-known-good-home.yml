name: Restore JORON Known-Good Homepage

on:
  push:
    paths:
      - '.github/workflows/restore-known-good-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore homepage from known-good commit
        shell: bash
        run: |
          git show 5879628174d0527df86f969317fc30ddbfc9fa1b:index.html > index.html
          test -s index.html
          grep -q '<!doctype html>' index.html
          grep -q '</head>' index.html
          grep -q '<body>' index.html
          grep -q '</body>' index.html
          grep -q '</html>' index.html
          if grep -q 'data:image/jpeg;base64' index.html; then
            echo 'ERROR: splash/base64 corruption is still present.'
            exit 1
          fi
          echo 'Known-good JORON homepage restored and structure verified.'

      - name: Commit restored homepage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Homepage already matches known-good version.'
            exit 0
          fi
          git commit -m 'Restore JORON homepage from known-good version'
          git push
