name: JORON Smart Biodata Fields

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[biodata-fields-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert predefined Biodata fields to selects
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('smart-biodata.html')
          s=p.read_text(encoding='utf-8')
          marker='JORON_BIODATA_FIELDS_V3'
          if marker in s:
              print('Already applied')
              raise SystemExit(0)

          def repl(old,new):
              global s
              if old in s:
                  s=s.replace(old,new,1)
              else:
                  print('Pattern not found:', old[:90])

          # Height: select-only
          repl('<input id="height" placeholder="যেমন ৫\'৬\\\"">', '<select id="height"><option value="">উচ্চতা নির্বাচন করুন</option><option>৪\'৬\"</option><option>৪\'৭\"</option><option>৪\'৮\"</option><option>৪\'৯\"</option><option>৪\'১০\"</option><option>৪\'১১\"</option><option>৫\'০\"</option><option>৫\'১\"</option><option>৫\'২\"</option><option>৫\'৩\"</option><option>৫\'৪\"</option><option>৫\'৫\"</option><option>৫\'৬\"</option><option>৫\'৭\"</option><option>৫\'৮\"</option><option>৫\'৯\"</option><option>৫\'১০\"</option><option>৫\'১১\"</option><option>৬\'০\"</option><option>৬\'১\"</option><option>৬\'২\"</option><option>৬\'৩\"</option><option>৬\'৪\"</option><option>৬\'৫\"</option><option>৬\'৬\"</option></select>')

          # Address: select-only, with a simple Bangladesh district/upazila data model.
          repl('<input id="district">', '<select id="district"><option value="">জেলা নির্বাচন করুন</option></select>')
          repl('<input id="upazila">', '<select id="upazila"><option value="">উপজেলা / থানা নির্বাচন করুন</option></select>')
          repl('<input id="area">', '<select id="area"><option value="">এলাকা / গ্রাম নির্বাচন করুন</option></select>')
          repl('<input id="pdistrict">', '<select id="pdistrict"><option value="">Permanent জেলা নির্বাচন করুন</option></select>')

          # Education: predefined values become selects. Institution is a curated select; user can choose Other.
          repl('<input id="institution">', '<select id="institution"><option value="">প্রতিষ্ঠান নির্বাচন করুন</option><option>সরকারি প্রতিষ্ঠান</option><option>বেসরকারি প্রতিষ্ঠান</option><option>বিশ্ববিদ্যালয়</option><option>কলেজ</option><option>মাদরাসা</option><option>পলিটেকনিক / কারিগরি</option><option>মেডিকেল কলেজ</option><option>ইঞ্জিনিয়ারিং বিশ্ববিদ্যালয়</option><option>অন্যান্য</option></select>')
          repl('<input id="subject">', '<select id="subject"><option value="">বিষয় / বিভাগ নির্বাচন করুন</option><option>বিজ্ঞান</option><option>মানবিক</option><option>ব্যবসায় শিক্ষা</option><option>কম্পিউটার / ICT</option><option>মেডিকেল</option><option>ইঞ্জিনিয়ারিং</option><option>আইন</option><option>শিক্ষা</option><option>কৃষি</option><option>ইসলামিক স্টাডিজ</option><option>আরবি</option><option>অন্যান্য</option></select>')
          repl('<input id="passYear" type="number" min="1950" max="2035">', '<select id="passYear"><option value="">পাশের বছর নির্বাচন করুন</option>' + ''.join(f'<option>{y}</option>' for y in range(2035,1949,-1)) + '</select>')
          repl('<input id="extraEdu">', '<select id="extraEdu"><option value="">Certification নির্বাচন করুন</option><option>কোনো অতিরিক্ত Certification নেই</option><option>Professional Certification</option><option>IT / Computer Certification</option><option>Language Certification</option><option>Healthcare Certification</option><option>Teaching Certification</option><option>Other Certification</option></select>')

          # Predefined personal fields: no typing required.
          repl('<input id="nationality" value="বাংলাদেশী">', '<select id="nationality"><option>বাংলাদেশী</option><option>অন্যান্য</option><option>প্রকাশ করতে চাই না</option></select>')
          repl('<input id="language" value="বাংলা">', '<select id="language"><option>বাংলা</option><option>ইংরেজি</option><option>আরবি</option><option>হিন্দি</option><option>অন্যান্য</option><option>প্রকাশ করতে চাই না</option></select>')

          # Ready-made editable self-description: preserve textarea/edit capability if present.
          about = 'আমি সহজ-সরল, দায়িত্বশীল ও পরিবারকে গুরুত্ব দেওয়া একজন মানুষ। পারস্পরিক সম্মান, বিশ্বাস, সততা ও বোঝাপড়াকে একটি সুন্দর সম্পর্কের ভিত্তি মনে করি। জীবনে শান্তিপূর্ণ ও সুখী পারিবারিক পরিবেশকে গুরুত্ব দিই। একজন ভালো জীবনসঙ্গীর সঙ্গে পরস্পরকে সম্মান করে, সুখে-দুঃখে পাশে থেকে সুন্দর একটি জীবন গড়ে তুলতে চাই।'
          s=s.replace('<textarea id="about">', f'<textarea id="about" data-default="true">{about}', 1) if '<textarea id="about">' in s else s

          # Add dependent location logic without changing existing IDs used by save code.
          extra=r'''\n<!-- JORON_BIODATA_FIELDS_V3 -->\n<script>\n(function(){\n const data={\n  "ঢাকা":{"জেলা": ["ঢাকা","গাজীপুর","নারায়ণগঞ্জ","নরসিংদী","মানিকগঞ্জ","মুন্সীগঞ্জ","রাজবাড়ী","ফরিদপুর","গোপালগঞ্জ","মাদারীপুর","শরীয়তপুর" ]},\n  "চট্টগ্রাম":{"জেলা":["চট্টগ্রাম","কুমিল্লা","ফেনী","নোয়াখালী","চাঁদপুর","লক্ষ্মীপুর","ব্রাহ্মণবাড়িয়া","কক্সবাজার","খাগড়াছড়ি","রাঙামাটি","বান্দরবান"]},\n  "রাজশাহী":{"জেলা":["রাজশাহী","নাটোর","নওগাঁ","চাঁপাইনবাবগঞ্জ","পাবনা","সিরাজগঞ্জ","বগুড়া","জয়পুরহাট"]},\n  "খুলনা":{"জেলা":["খুলনা","বাগেরহাট","সাতক্ষীরা","যশোর","ঝিনাইদহ","মাগুরা","নড়াইল","কুষ্টিয়া","চুয়াডাঙ্গা","মেহেরপুর"]},\n  "বরিশাল":{"জেলা":["বরিশাল","ভোলা","পটুয়াখালী","পিরোজপুর","ঝালকাঠি","বরগুনা"]},\n  "সিলেট":{"জেলা":["সিলেট","মৌলভীবাজার","হবিগঞ্জ","সুনামগঞ্জ"]},\n  "রংপুর":{"জেলা":["রংপুর","দিনাজপুর","গাইবান্ধা","কুড়িগ্রাম","লালমনিরহাট","নীলফামারী","পঞ্চগড়","ঠাকুরগাঁও"]},\n  "ময়মনসিংহ":{"জেলা":["ময়মনসিংহ","জামালপুর","নেত্রকোনা","শেরপুর"]}\n };\n const d=document.getElementById('division'), ds=document.getElementById('district'), up=document.getElementById('upazila'), area=document.getElementById('area'), pd=document.getElementById('pdistrict');\n function fill(sel,items,first){if(!sel)return; sel.innerHTML='<option value="">'+first+'</option>'; (items||[]).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;sel.appendChild(o)});}\n function districts(){const list=(data[d&&d.value]||{}).জেলা||[];fill(ds,list,'জেলা নির্বাচন করুন');fill(pd,list,'Permanent জেলা নির্বাচন করুন');fill(up,[],'উপজেলা / থানা নির্বাচন করুন');fill(area,[],'এলাকা / গ্রাম নির্বাচন করুন');}\n d&&d.addEventListener('change',districts);\n ds&&ds.addEventListener('change',()=>{fill(up,['সদর উপজেলা / থানা','সিটি কর্পোরেশন এলাকা','অন্যান্য উপজেলা / থানা'],'উপজেলা / থানা নির্বাচন করুন');fill(area,[],'এলাকা / গ্রাম নির্বাচন করুন')});\n up&&up.addEventListener('change',()=>fill(area,['সদর','শহর এলাকা','গ্রাম এলাকা','অন্যান্য'],'এলাকা / গ্রাম নির্বাচন করুন'));\n districts();\n})();\n</script>\n'''
          s=s.replace('</body>',extra+'</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "JORON Premium Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-biodata.html .github/workflows/smart-biodata-fields.yml
          git rm .github/workflows/smart-biodata-fields.yml
          git diff --cached --quiet || git commit -m "feat: complete Smart Biodata select fields [biodata-fields-applied]"
          git push
