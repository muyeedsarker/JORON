name: Wire Smart Biodata enhancements

on:
  push:
    paths:
      - '.github/workflows/wire-master-autosave.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach Smart Biodata helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('smart-biodata.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="assets/master-profile-autosave.js"></script>','<script src="assets/biodata-smart-fields.js"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Add brand field styling without touching address markup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('smart-biodata.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="joron-smart-fields-brand">\ninput[list]{width:100%!important}\n.form-section,.bio-card{background:linear-gradient(145deg,#fff 0%,#fffafd 55%,#f7efff 100%)!important;border:1px solid #eadfea!important;border-radius:24px!important;box-shadow:0 10px 28px rgba(70,25,90,.10)!important}\n.field input,.field select,.field textarea{background:#fff!important;color:#20202b!important;border:1px solid #e2d8e6!important;border-radius:14px!important}\n.field input:focus,.field select:focus,.field textarea:focus{outline:none!important;border-color:#64158f!important;box-shadow:0 0 0 3px rgba(100,21,143,.12)!important}\n</style>'''
          if 'id="joron-smart-fields-brand"' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-biodata.html
          git diff --cached --quiet || git commit -m 'Enhance Smart Biodata smart fields and brand styling'
          git push
