name: Wire Master Profile autosave

on:
  push:
    paths:
      - '.github/workflows/wire-master-autosave.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach Master Profile autosave
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('smart-biodata.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/master-profile-autosave.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('Master autosave attached')
          else:
              print('Master autosave already attached')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-biodata.html
          git diff --cached --quiet || git commit -m 'Connect Smart Biodata to Master Profile autosave'
          git push