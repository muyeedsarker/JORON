<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J❤️R❤️N Admin Panel</title>

<style>
body{
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:#f4faf7;
padding:20px;
}

.box{
max-width:700px;
margin:auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px #0002;
}

h1{
text-align:center;
color:#126b5b;
}

.card{
background:#f8fffc;
border:1px solid #ddd;
border-radius:15px;
padding:15px;
margin-top:15px;
line-height:1.8;
}

button{
border:0;
padding:10px 18px;
border-radius:20px;
color:white;
font-weight:bold;
margin-right:8px;
cursor:pointer;
}

.approve{
background:#126b5b;
}

.reject{
background:#d33;
}
</style>

<link rel="stylesheet" href="assets/joron-reference-theme.css"></head>

<body>

<div class="box">

<h1>❤️ J❤️R❤️N Admin Panel</h1>

<div id="list">
Loading...
</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyDWxxu3zwThJp1fuWMhXiRig3Fswt0QARA",

authDomain:"joron-d7742.firebaseapp.com",

projectId:"joron-d7742",

storageBucket:"joron-d7742.firebasestorage.app",

messagingSenderId:"907727989078",

appId:"1:907727989078:web:4fdd266e3517a862fa0ef7"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


const ADMIN_UID=
"PcDehBv4dYezeIPA6h0Peo9lpih2";


const list=
document.getElementById("list");



onAuthStateChanged(auth,(user)=>{


if(!user){

alert("আগে Login করুন");

location.href="login.html";

return;

}



if(user.uid!==ADMIN_UID){

alert("Admin Access নেই");

location.href="index.html";

return;

}


loadPayments();


});



async function loadPayments(){


list.innerHTML="";


const snap=
await getDocs(
collection(db,"payments")
);


let count=0;


snap.forEach((item)=>{


const data=item.data();


if(data.paymentStatus==="pending"){


count++;


list.innerHTML+=`

<div class="card">

<b>User ID:</b>
${data.uid}

<br>

<b>Sender Number:</b>
${data.senderNumber}

<br>

<b>Transaction ID:</b>
${data.transactionId}

<br>

<b>Status:</b>
${data.paymentStatus}

<br><br>


<button class="approve"
onclick="approve('${data.uid}')">

Approve

</button>


<button class="reject"
onclick="rejectPay('${data.uid}')">

Reject

</button>


</div>

`;

}


});


if(count===0){

list.innerHTML=
"কোনো Pending Payment নেই।";

}


}




window.approve=async function(uid){


await updateDoc(
doc(db,"payments",uid),
{
paymentStatus:"approved",
membershipStatus:"active"
}
);


await updateDoc(
doc(db,"users",uid),
{
paymentStatus:"paid",
membershipStatus:"active"
}
);


alert("Membership Active হয়েছে");

location.reload();


}





window.rejectPay=async function(uid){


await updateDoc(
doc(db,"payments",uid),
{
paymentStatus:"rejected"
}
);


alert("Payment Reject হয়েছে");

location.reload();


}


</script>


</body>
</html>
