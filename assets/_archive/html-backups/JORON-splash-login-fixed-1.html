<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JORON Matrimony — সম্পর্ক জুড়ে দেয় জোড়ন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF6EC;
    --plum:#5B1667;
    --plum-deep:#3E0F47;
    --gold:#C9A24B;
    --rose:#E9C3B0;
    --ink:#2B1B2E;
    --ink-soft:#6E5F72;
    --line:#E7DCC9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Hind Siliguri', sans-serif;
    background:#171017;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 12px;
  }
  .phone{
    width:390px;
    height:844px;
    max-height:calc(100vh - 64px);
    background:var(--ivory);
    border-radius:44px;
    overflow:hidden;
    position:relative;
    box-shadow:0 40px 80px -20px rgba(0,0,0,.6), 0 0 0 10px #0c090c;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Photo zone ---------- */
  .photo-zone{
    position:relative;
    flex:0 0 60%;
    overflow:hidden;
  }
  .photo-zone img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 22%;
    display:block;
  }
  .photo-scrim{
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(43,20,47,.35) 0%, rgba(43,20,47,0) 30%, rgba(251,246,236,0) 72%, var(--ivory) 100%);
  }
  .status-row{
    position:absolute;
    top:0; left:0; right:0;
    padding:18px 26px 0;
    display:flex;
    justify-content:space-between;
    color:#fff;
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    text-shadow:0 1px 6px rgba(0,0,0,.35);
  }
  .brand-mark{
    position:absolute;
    left:28px;
    bottom:38px;
    color:#fff;
  }
  .brand-mark .bn{
    font-family:'Hind Siliguri', sans-serif;
    font-weight:700;
    font-size:30px;
    line-height:1;
    text-shadow:0 2px 14px rgba(0,0,0,.35);
  }
  .brand-mark .en{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:13px;
    letter-spacing:.28em;
    margin-top:6px;
    opacity:.92;
    text-shadow:0 2px 10px rgba(0,0,0,.3);
  }

  /* ---------- Sheet ---------- */
  .sheet{
    position:relative;
    flex:1;
    margin-top:-30px;
    background:var(--ivory);
    border-radius:30px 30px 0 0;
    padding:26px 26px 22px;
    display:flex;
    flex-direction:column;
    z-index:2;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    width:36px; height:4px;
    border-radius:2px;
    background:var(--line);
  }
  .tagline{
    margin-top:16px;
    text-align:center;
    color:var(--ink);
    font-size:17px;
    font-weight:600;
    letter-spacing:.01em;
  }
  .tagline .accent{ color:var(--plum); }
  .subtext{
    margin-top:6px;
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:400;
  }

  .btn-col{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .btn{
    height:50px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:14.5px;
    font-weight:600;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(.985); }
  .btn svg{ width:19px; height:19px; flex:none; }

  .btn-id{
    background:var(--plum);
    border-color:var(--plum);
    color:#fff;
    box-shadow:0 10px 22px -8px rgba(91,22,103,.55);
  }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:16px 2px 4px;
  }
  .divider .rule{ flex:1; height:1px; background:var(--line); }
  .divider span{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .spacer{ flex:1; }

  .legal{
    text-align:center;
    font-size:11px;
    line-height:1.6;
    color:var(--ink-soft);
    padding:0 8px;
  }
  .legal a{
    color:var(--plum);
    text-decoration:none;
    font-weight:600;
  }

  .home-indicator{
    width:120px; height:4px;
    border-radius:2px;
    background:var(--ink);
    opacity:.25;
    margin:14px auto 2px;
  }

  /* ---------- Production polish ---------- */
  .hero-image{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
  .grabber{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:4px;background:var(--line)}
  .signup-link{
    display:flex;align-items:center;justify-content:center;
    min-height:44px;margin-top:10px;border-radius:12px;
    color:var(--plum);font-size:13.5px;font-weight:700;
    text-decoration:none;border:1px solid transparent;
    transition:background .15s ease,transform .15s ease;
  }
  .signup-link:hover,.signup-link:focus-visible{background:rgba(91,22,103,.07)}
  .signup-link:active{transform:scale(.985)}
  .btn-id{text-decoration:none}
  .btn:focus-visible,.signup-link:focus-visible,.legal a:focus-visible{
    outline:3px solid rgba(201,162,75,.55);outline-offset:3px;
  }
  .toast{
    position:fixed;left:50%;bottom:18px;transform:translate(-50%,14px);
    width:min(360px,calc(100vw - 32px));padding:11px 14px;
    border-radius:12px;background:var(--plum-deep);color:#fff;
    text-align:center;font-size:12.5px;line-height:1.45;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
    z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.28);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-height:720px){
    body{padding:12px}
    .phone{height:calc(100vh - 24px);max-height:none}
    .photo-zone{flex-basis:55%}
    .sheet{padding-top:22px}
    .btn-col{margin-top:16px;gap:8px}
    .btn{height:46px}
  }
  @media (max-width:430px){
    body{padding:0;background:var(--ivory)}
    .phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
    .sheet{border-radius:28px 28px 0 0;padding-left:22px;padding-right:22px}
  }

</style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /*
      JORON integration note:
      Google/Facebook authentication is intentionally NOT faked here.
      Connect these handlers to the existing Firebase Auth flow when the
      project's Firebase configuration and providers are wired in.
    */
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    document.getElementById("googleBtn").addEventListener("click", () => {
      showToast("Google Login সংযোগটি Firebase Auth-এর সাথে যুক্ত করতে হবে।");
    });

    document.getElementById("facebookBtn").addEventListener("click", () => {
      showToast("Facebook Login সংযোগটি Firebase Auth-এর সাথে যুক্ত করতে হবে।");
    });

    // Keep the mobile status-bar time visually current.
    function updateTime() {
      const el = document.getElementById("status-time");
      if (!el) return;
      el.textContent = new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(new Date());
    }
    updateTime();
    setInterval(updateTime, 30000);
  </script>
