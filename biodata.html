<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JORON — Smart Biodata</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef7ff,#f8f5ff);color:#243047;padding:18px}.wrap{max-width:680px;margin:auto}.brand{text-align:center;margin:8px 0 18px}.brand img{width:96px;border-radius:50%}.card{background:#fff;border-radius:24px;padding:25px;box-shadow:0 12px 40px #20304a18;border:1px solid #e5e9f2}.tag{text-align:center;color:#68738a;margin:4px 0 24px}h1{text-align:center;margin:0 0 22px;font-size:27px}h2{font-size:18px;margin:0 0 12px}.section{padding:18px;margin:16px 0;border-radius:18px;background:#f7f9fc;border:1px solid #e8ecf3}.section:nth-of-type(2){background:#f5fbff}.section:nth-of-type(3){background:#fff8f3}.section:nth-of-type(4){background:#f7f4ff}label{display:block;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #d9deea;border-radius:11px;font-size:16px;outline:0;background:#fff}input:focus,select:focus,textarea:focus{border-color:#536dfe;box-shadow:0 0 0 3px #536dfe14}textarea{min-height:105px;resize:vertical;line-height:1.6}.hint{font-size:12px;color:#7b8496;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:20px}button{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:#536dfe;color:white}button.secondary{background:#eef1f7;color:#34405a}.success{display:none;margin-top:16px;padding:14px;border-radius:14px;background:#edf9f1;color:#207044;text-align:center;font-weight:700}@media(max-width:560px){body{padding:10px}.card{padding:17px}.grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style></head>
<body><div class="wrap"><div class="brand"><img src="assets/joron-logo.jpg" alt="JORON"></div><div class="card"><div class="tag">দুজনের গল্প, এক জোড়ন। ❤️</div><h1>Smart Biodata</h1><form id="biodataForm">
<div class="section"><h2>👤 ব্যক্তিগত তথ্য</h2><label>পূর্ণ নাম</label><input id="name" required placeholder="আপনার পূর্ণ নাম"><div class="grid"><div><label>বয়স</label><input id="age" type="number" min="18" max="100" required></div><div><label>লিঙ্গ</label><select id="gender" required><option value="">নির্বাচন করুন</option><option>পুরুষ</option><option>নারী</option></select></div></div><label>জেলা</label><input id="district" required placeholder="আপনার জেলা"></div>
<div class="section"><h2>🎓 শিক্ষাগত তথ্য</h2><label>শিক্ষাব্যবস্থা</label><select id="educationSystem" required><option value="">নির্বাচন করুন</option><option>General / সাধারণ শিক্ষা</option><option>Madrasa / মাদ্রাসা শিক্ষা</option><option>Technical / কারিগরি শিক্ষা</option><option>Vocational / ভোকেশনাল শিক্ষা</option><option>Medical / চিকিৎসা শিক্ষা</option><option>Engineering / প্রকৌশল শিক্ষা</option><option>Agricultural / কৃষি শিক্ষা</option><option>Religious / ধর্মীয় শিক্ষা</option><option>Other / অন্যান্য</option></select><label>শিক্ষাগত যোগ্যতা</label><select id="education" required><option value="">আগে শিক্ষাব্যবস্থা নির্বাচন করুন</option></select><label>প্রতিষ্ঠানের নাম</label><input id="institution" required placeholder="স্কুল / কলেজ / মাদ্রাসা / বিশ্ববিদ্যালয়"><div class="grid"><div><label>বিভাগ / বিষয়</label><input id="subject" placeholder="যেমন: বিজ্ঞান"></div><div><label>পাশের সন</label><input id="passingYear" type="number" min="1950" max="2030" placeholder="২০২৪" required></div></div></div>
<div class="section"><h2>💼 পেশা ও ব্যক্তিত্ব</h2><label>পেশা</label><input id="profession" required placeholder="আপনার পেশা"><label>নিজের সম্পর্কে</label><textarea id="about" placeholder="আপনার স্বভাব, মূল্যবোধ, আগ্রহ ও লক্ষ্য সম্পর্কে লিখুন"></textarea></div>
<div class="section"><h2>💍 জীবনসঙ্গীর পছন্দ</h2><label>আপনি কেমন জীবনসঙ্গী চান?</label><textarea id="partner" placeholder="সততা, পরিবার, শিক্ষা, মূল্যবোধ ও অন্যান্য পছন্দ লিখুন"></textarea></div>
<div class="actions"><button type="submit">Biodata তৈরি করুন</button><button type="button" class="secondary" id="clearBtn">পরিষ্কার</button></div></form><div class="success" id="success">❤️ Biodata সফলভাবে প্রস্তুত হয়েছে। তথ্য এই ডিভাইসে সংরক্ষণ করা হয়েছে।</div></div></div>
<script>
const levels={"General / সাধারণ শিক্ষা":["JSC / সমমান","SSC / সমমান","HSC / সমমান","Honours / স্নাতক","Masters / স্নাতকোত্তর","PhD / পিএইচডি"],"Madrasa / মাদ্রাসা শিক্ষা":["ইবতেদায়ী","দাখিল","আলিম","ফাজিল","কামিল","মাস্টার্স / সমমান"],"Technical / কারিগরি শিক্ষা":["SSC Vocational","HSC / Diploma","Diploma in Engineering","BSc in Engineering","Advanced Diploma"],"Vocational / ভোকেশনাল শিক্ষা":["Certificate","Diploma","Advanced Diploma","Professional Training"],"Medical / চিকিৎসা শিক্ষা":["MBBS","BDS","Nursing","Pharmacy","Medical Diploma","Postgraduate"],"Engineering / প্রকৌশল শিক্ষা":["Diploma in Engineering","BSc in Engineering","MSc in Engineering","MPhil","PhD"],"Agricultural / কৃষি শিক্ষা":["Diploma in Agriculture","BSc Agriculture","MSc Agriculture","PhD"],"Religious / ধর্মীয় শিক্ষা":["Certificate","Diploma","Higher Diploma","Degree","Postgraduate"],"Other / অন্যান্য":["Certificate","Diploma","Bachelor","Master","Doctorate","Other"]};
const sys=document.getElementById('educationSystem'),edu=document.getElementById('education');sys.onchange=()=>{edu.innerHTML='<option value="">যোগ্যতা নির্বাচন করুন</option>'+(levels[sys.value]||[]).map(x=>`<option>${x}</option>`).join('')};
const form=document.getElementById('biodataForm');form.onsubmit=e=>{e.preventDefault();const data={name:name.value,age:age.value,gender:gender.value,district:district.value,educationSystem:sys.value,education:edu.value,institution:institution.value,subject:subject.value,passingYear:passingYear.value,profession:profession.value,about:about.value,partner:partner.value,savedAt:new Date().toISOString()};localStorage.setItem('joron_biodata',JSON.stringify(data));document.getElementById('success').style.display='block';};
document.getElementById('clearBtn').onclick=()=>{form.reset();edu.innerHTML='<option value="">আগে শিক্ষাব্যবস্থা নির্বাচন করুন</option>';document.getElementById('success').style.display='none'};
</script></body></html>
