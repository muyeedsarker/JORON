<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON — Secure Chat</title><style>body{font-family:system-ui;max-width:760px;margin:auto;padding:20px}#messages{min-height:300px;border:1px solid #ddd;padding:12px}.msg{padding:8px;margin:6px 0;border-radius:8px;background:#f4f4f4}.mine{font-weight:600}form{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:10px}</style></head><body><h1>💬 Secure Chat</h1><p id="status">Checking account…</p><div id="messages"></div><form id="form"><input id="text" maxlength="1000" autocomplete="off" placeholder="Write a message…" required><button>Send</button></form><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,getDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';import{firebaseConfig}from'./assets/firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),status=document.getElementById('status'),box=document.getElementById('messages'),form=document.getElementById('form'),text=document.getElementById('text'),chatId=new URLSearchParams(location.search).get('chatId');let user;onAuthStateChanged(auth,async u=>{if(!u){location.replace('login.html');return}user=u;if(!chatId){status.textContent='Missing chat ID.';form.hidden=true;return}try{const room=await getDoc(doc(db,'chats',chatId));if(!room.exists())throw Error('Chat not found');const d=room.data();if(![d.participantA,d.participantB].includes(u.uid))throw Error('Not a participant');status.textContent='Secure chat connected.';onSnapshot(query(collection(db,'chats',chatId,'messages'),orderBy('createdAt','asc')),s=>{box.innerHTML='';s.forEach(x=>{const m=x.data(),el=document.createElement('div');el.className='msg'+(m.senderId===u.uid?' mine':'');el.textContent=(m.senderId===u.uid?'You: ':'Partner: ')+m.text;box.appendChild(el)});box.scrollTop=box.scrollHeight})}catch(e){status.textContent='Chat unavailable.';form.hidden=true}});form.addEventListener('submit',async e=>{e.preventDefault();const value=text.value.trim();if(!value||!user||!chatId)return;try{await addDoc(collection(db,'chats',chatId,'messages'),{senderId:user.uid,text:value,createdAt:serverTimestamp()});text.value=''}catch(e){status.textContent='Message could not be sent.'}});</script></body></html>
