<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d35c9"><title>J❤️R❤️N | Free Chat</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#fff7fb,#f3efff,#edfff7);color:#17232b}.wrap{width:min(900px,94%);margin:auto}header{background:#fff;box-shadow:0 10px 30px #4c278014}.nav{min-height:76px;display:flex;justify-content:space-between;align-items:center}.brand{font:bold 30px Georgia;color:#087b59;text-decoration:none}.back{padding:9px 13px;border:1px solid #e1d8ef;border-radius:12px;text-decoration:none;font-weight:800}.box{margin:24px 0;background:#ffffffed;border:1px solid #e8e3f1;border-radius:24px;padding:20px;box-shadow:0 18px 55px #46207812}.head{display:flex;justify-content:space-between;align-items:center}.head h1{color:#6d35c9}.notice,.security{padding:13px;border-radius:15px;margin:12px 0;background:#f2eaff;color:#593b82;font-weight:700;font-size:13px}.security{background:#eefaf5;color:#087b59}.partners{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.person{border:1px solid #e8e3f1;border-radius:16px;padding:13px;background:#fff;display:flex;align-items:center;gap:10px;cursor:pointer}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffe1ee,#e8dcff);font-size:22px}.person strong{display:block}.person small{color:#69757b}.chat{display:none}.chat.active{display:block}.messages{height:380px;overflow:auto;padding:10px;background:#faf8ff;border-radius:17px;border:1px solid #eee7f7}.msg{max-width:78%;padding:9px 12px;border-radius:15px;margin:7px 0;background:#eee8ff}.msg.mine{margin-left:auto;background:#e5f8ef}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;height:44px;border:1px solid #ddd3e8;border-radius:12px;padding:0 12px}.composer button{border:0;border-radius:12px;padding:0 18px;background:#6d35c9;color:#fff;font-weight:900}.status{text-align:center;font-weight:800;margin:12px}.empty{text-align:center;padding:35px;color:#69757b}@media(max-width:600px){.partners{grid-template-columns:1fr}.messages{height:330px}.head{align-items:flex-start;flex-direction:column}}
</style><link rel="stylesheet" href="assets/joron-reference-theme.css"><link rel="stylesheet" href="assets/joron-theme-v2.css"><link rel="stylesheet" href="assets/joron-master-theme.css"><link rel="stylesheet" href="assets/joron-ux-polish.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v1.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v2.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v3.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v4.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v5.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html">J❤️R❤️N</a><a class="back" href="dashboard.html">← Dashboard</a></div></header><main class="wrap"><section class="box"><div class="head"><h1>💬 Free Chat</h1><span>🔐 Mutual Interest</span></div><div class="notice">শুধু দুই পক্ষের Interest <b>accepted</b> হলে Chat চালু হবে। ফোন নম্বর প্রকাশ না করেই যোগাযোগ করুন।</div><div id="status" class="status">Login যাচাই হচ্ছে...</div><div id="partners" class="partners"></div><section id="chat" class="chat"><h2 id="chatTitle">Chat</h2><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="text" maxlength="1000" placeholder="আপনার বার্তা লিখুন..." autocomplete="off"><button>পাঠান</button></form></section><div class="security">🛡️ নিরাপত্তা: authenticated Firebase chat, mutual-interest gate এবং participant-only Firestore rules ব্যবহার করা হচ্ছে।</div></section></main><script type="module">import {auth} from './assets/firebase-client.js';import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';import {getMutualChatPartners,ensureChat,sendMessage,subscribeMessages} from './assets/chat-service.js';import {db} from './assets/firebase-client.js';import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const $=id=>document.getElementById(id);let uid='',activeChat='',unsubscribe=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function profileName(id){try{const s=await getDoc(doc(db,'biodata',id));const d=s.exists()?s.data():{};return d.name||d.fullName||'JORON Member'}catch{return 'JORON Member'}}async function loadPartners(){const ids=await getMutualChatPartners();if(!ids.length){$('partners').innerHTML='<div class="empty">💗 এখনো কোনো Mutual Interest নেই।<br>দুই পক্ষ Accept করলে এখানে Chat আসবে।</div>';return}$('partners').innerHTML='';for(const id of ids){const name=await profileName(id);const el=document.createElement('div');el.className='person';el.innerHTML=`<div class="avatar">❤️</div><div><strong>${esc(name)}</strong><small>Mutual Interest — Chat available</small></div>`;el.onclick=()=>openChat(id,name);$('partners').appendChild(el)}}async function openChat(other,name){try{activeChat=await ensureChat(other);$('chat').classList.add('active');$('chatTitle').textContent='💬 '+name;$('messages').innerHTML='';if(unsubscribe)unsubscribe();unsubscribe=subscribeMessages(activeChat,items=>{$('messages').innerHTML=items.map(m=>`<div class="msg ${m.senderId===uid?'mine':''}">${esc(m.text)}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight})}catch(e){$('status').textContent=e.message==='MUTUAL_INTEREST_REQUIRED'?'❌ Mutual Interest ছাড়া Chat করা যাবে না।':'❌ Chat চালু করা যায়নি।'}}$('composer').onsubmit=async e=>{e.preventDefault();if(!activeChat)return;const input=$('text');const text=input.value.trim();if(!text)return;try{await sendMessage(activeChat,text);input.value=''}catch(e){$('status').textContent='❌ বার্তা পাঠানো যায়নি।'}};onAuthStateChanged(auth,async user=>{if(!user){$('status').textContent='🔐 আগে Login করুন।';return}uid=user.uid;$('status').textContent='';try{await loadPartners()}catch(e){console.error(e);$('status').textContent='❌ Mutual Interest লোড করা যায়নি।'}});</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 0 24px;margin:0 auto;clear:both}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0;max-width:360px;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border:2px solid rgba(255,255,255,.9);border-radius:15px;color:#fff;background:linear-gradient(135deg,#087b59,#10a978);font:900 15px/1.2 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:translateY(-2px);filter:brightness(1.06)}@media(max-width:600px){.joron-global-page-nav{gap:6px;padding:12px 2px 20px}.joron-global-page-nav a,.joron-global-page-nav button{min-height:48px;padding:11px 8px;font-size:13px;border-width:1.5px;border-radius:12px}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
