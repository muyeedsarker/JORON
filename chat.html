<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON | Secure Connect</title><style>:root{--p:#e81768;--g:#087b59;--ink:#17232b;--muted:#68747a}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#fff8fc,#effff8);color:var(--ink)}.wrap{width:min(850px,92%);margin:auto}header{background:#fff;border-top:3px solid var(--p);box-shadow:0 10px 30px #0001}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}.brand strong{font:700 32px Georgia,serif;color:var(--g)}.box{margin:25px 0;background:#fff;border:1px solid #e8eaeb;border-radius:24px;padding:22px;box-shadow:0 18px 55px #00000010}.notice{padding:13px;border-radius:14px;background:#eaf9f2;color:var(--g);font-weight:800}.person{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid #e7eaeb;border-radius:17px;margin-top:13px}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff0f6;font-size:25px}.person h3{margin:0}.person p{margin:2px 0;color:var(--muted);font-size:12px}.btn{margin-left:auto;border:0;border-radius:13px;padding:11px 14px;background:linear-gradient(105deg,var(--p),#ff4f91,var(--g));color:#fff;font-weight:900}.empty{text-align:center;color:var(--muted);padding:35px 10px}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/joron-logo.jpg" alt="JORON"><strong>JORON</strong></a><a href="dashboard.html">← Dashboard</a></div></header><main class="wrap"><div class="box"><h1>💬 JORON Secure Connect</h1><div class="notice">🔐 Phone number সরাসরি প্রকাশ না করে Interest → Accept → Secure Chat flow অনুসরণ করার পরিকল্পনা।</div><div id="list"></div><p style="font-size:11px;color:var(--muted);margin-top:18px">এটি frontend communication prototype। Real-time secure chat চালুর জন্য authenticated backend/database, access rules এবং abuse controls প্রয়োজন।</p></div></main><script>const list=document.getElementById('list');const interests=JSON.parse(localStorage.getItem('joronInterests')||'[]');if(!interests.length)list.innerHTML='<div class="empty">❤️ এখনো কোনো Interest নেই।<br><a href="profiles.html">Profiles দেখুন →</a></div>';else list.innerHTML=interests.map((x,i)=>`<div class="person"><div class="avatar">❤️</div><div><h3>${x.name||'JORON Member'}</h3><p>${x.status||'Interest পাঠানো হয়েছে'}</p></div><button class="btn" onclick="accept(${i})">Accept</button></div>`).join('');function accept(i){interests[i].status='Accepted';localStorage.setItem('joronInterests',JSON.stringify(interests));location.reload()}</script></body></html>
