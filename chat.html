<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON | Secure Chat</title><style>:root{--p:#e81768;--g:#087b59;--ink:#17232b;--muted:#68747a}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#fff8fc,#effff8);color:var(--ink)}.wrap{width:min(850px,92%);margin:auto}.box{margin:25px 0;background:#fff;border:1px solid #e8eaeb;border-radius:24px;padding:22px;box-shadow:0 18px 55px #00000010}.notice{padding:13px;border-radius:14px;background:#eaf9f2;color:var(--g);font-weight:800}.row{display:flex;gap:8px;margin-top:12px}.row input{flex:1;padding:12px;border:1px solid #ddd;border-radius:12px}.btn{border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(105deg,var(--p),#ff4f91,var(--g));color:#fff;font-weight:900}.danger{background:#9b1c31}.messages{min-height:300px;max-height:55vh;overflow:auto;padding:12px;background:#fafafa;border-radius:16px;margin-top:14px}.msg{padding:9px 12px;border-radius:14px;margin:8px 0;max-width:78%;background:#eee}.mine{margin-left:auto;background:#e8f8f1}.meta{font-size:10px;color:var(--muted);margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{color:var(--muted);font-size:12px}.hidden{display:none}</style></head><body><main class="wrap"><div class="box"><h1>💬 JORON Secure Chat</h1><div id="status" class="notice">Checking secure session…</div><div id="app" class="hidden"><p class="muted">Room: <span id="room"></span></p><div class="toolbar"><button id="notify" class="btn">🔔 Enable notifications</button><button id="block" class="btn danger">🚫 Block</button><button id="report" class="btn danger">🚨 Report</button></div><div id="messages" class="messages"></div><div class="row"><input id="text" maxlength="1000" placeholder="Message…"><button id="send" class="btn">Send</button></div></div></div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,addDoc,collection,query,orderBy,onSnapshot,serverTimestamp,updateDoc,arrayUnion}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
import{firebaseConfig}from'./assets/firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const qs=new URLSearchParams(location.search);const chatId=qs.get('chatId'),other=qs.get('other');const status=document.getElementById('status'),root=document.getElementById('app'),messages=document.getElementById('messages');let me,unsub;
const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function blockedPair(a,b){return [a,b].sort().join('_')}
async function isBlocked(a,b){const s=await getDoc(doc(db,'blocks',blockedPair(a,b)));return s.exists()}
async function notify(title,body){if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body})}
async function report(){if(!other)return;await addDoc(collection(db,'reports'),{reporterId:me.uid,targetUserId:other,chatId,reason:'chat',createdAt:serverTimestamp()});alert('Report submitted.');}
async function block(){if(!other)return;await setDoc(doc(db,'blocks',blockedPair(me.uid,other)),{blockerId:me.uid,blockedId:other,createdAt:serverTimestamp()});alert('User blocked.');location.replace('dashboard.html')}
async function send(){const input=document.getElementById('text'),text=input.value.trim();if(!text||!chatId||!other||await isBlocked(me.uid,other))return;await addDoc(collection(db,'chats',chatId,'messages'),{senderId:me.uid,text:text.slice(0,1000),createdAt:serverTimestamp(),readBy:[me.uid]});input.value=''}
async function markRead(snap){for(const d of snap.docs){const x=d.data();if(x.senderId!==me.uid&&!(x.readBy||[]).includes(me.uid))await updateDoc(d.ref,{readBy:arrayUnion(me.uid)})}}
onAuthStateChanged(auth,async u=>{if(!u){location.replace('login.html');return}me=u;if(!chatId||!other){status.textContent='Missing secure chat parameters.';return}try{if(await isBlocked(me.uid,other)){status.textContent='This chat is blocked.';return}const room=await getDoc(doc(db,'chats',chatId));if(!room.exists()){status.textContent='Chat room not found.';return}const r=room.data();if(![r.participantA,r.participantB].includes(me.uid)||![r.participantA,r.participantB].includes(other)){status.textContent='Access denied.';return}status.textContent='🔐 Secure chat connected.';root.classList.remove('hidden');document.getElementById('room').textContent=chatId;unsub=onSnapshot(query(collection(db,'chats',chatId,'messages'),orderBy('createdAt','asc')),async snap=>{messages.innerHTML=snap.docs.map(d=>{const x=d.data(),mine=x.senderId===me.uid,read=(x.readBy||[]).includes(me.uid);return `<div class="msg ${mine?'mine':''}"><div>${esc(x.text)}</div><div class="meta">${mine?(read?'✓✓ Read':'✓ Sent'):(read?'Read':'Unread')}</div></div>`}).join('')||'<p class="muted">No messages yet.</p>';messages.scrollTop=messages.scrollHeight;await markRead(snap)});}catch(e){console.error(e);status.textContent='Unable to open secure chat.'}});
document.getElementById('send').onclick=send;document.getElementById('text').addEventListener('keydown',e=>{if(e.key==='Enter')send()});document.getElementById('report').onclick=report;document.getElementById('block').onclick=block;document.getElementById('notify').onclick=async()=>{if(!('Notification'in window)){alert('Browser notifications unavailable.');return}const p=await Notification.requestPermission();if(p==='granted')notify('JORON notifications enabled','You can now receive chat notifications while this page is open.')};window.addEventListener('beforeunload',()=>unsub&&unsub());
</script></body></html>
