<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b20b4d"><title>J❤️R❤️N | Following</title><link rel="stylesheet" href="assets/joron-reference-theme.css"><style>body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#fff7fa,#fff,#f6fff9);color:#17232b}.wrap{width:min(1000px,94%);margin:auto}.hero{text-align:center;padding:34px 0 20px}.hero h1{display:inline-block;margin:0;padding:9px 24px;border:2px solid #b20b4d;border-radius:999px;color:#b20b4d;background:#fff7fa;white-space:nowrap;box-shadow:0 8px 24px rgba(91,26,142,.12)}.status{text-align:center;padding:30px;color:#087b59;font-weight:900}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:35px}.card{background:#fff;border:2px solid #eadfe6;border-radius:20px;padding:18px;text-align:center;box-shadow:0 14px 35px rgba(71,18,47,.10)}.avatar{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#b20b4d,#5b1a8e);color:#fff;font-size:27px;font-weight:900}.card h2{margin:9px 0 3px;font-size:18px}.meta{color:#69757b;font-size:12px}.view{display:block;margin-top:12px;padding:11px;border:2px solid #b20b4d;border-radius:999px;color:#b20b4d;background:#fff7fa;font-weight:900}.nav{display:flex;gap:10px;justify-content:center;padding:8px 0 30px}.nav a{width:190px;min-height:50px;display:flex;align-items:center;justify-content:center;border:2px solid #5b1a8e;border-radius:999px;background:#fff;color:#5b1a8e;font-weight:900;box-sizing:border-box}.nav a:first-child{border-color:#087b59;color:#087b59;background:#f0fff8}@media(max-width:700px){.list{grid-template-columns:1fr 1fr}.hero h1{font-size:25px;padding:8px 18px}}@media(max-width:480px){.list{grid-template-columns:1fr}.nav a{width:46%;font-size:13px}}</style><link rel="stylesheet" href="assets/joron-theme-v2.css"><link rel="stylesheet" href="assets/joron-master-theme.css"><link rel="stylesheet" href="assets/joron-ux-polish.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v1.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v2.css"></head><body><main class="wrap"><section class="hero"><h1>👤 যাদের Follow করছেন</h1></section><div id="status" class="status">Following লোড হচ্ছে...</div><section id="list" class="list"></section><nav class="nav"><a href="index.html">🏠 হোম</a><a href="profiles.html">↩️ Profiles</a></nav></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{doc,getDoc,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{getFollowing}from'./assets/follow-service.js';const listEl=document.getElementById('list'),status=document.getElementById('status');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function load(){try{const follows=await getFollowing();if(!follows.length){status.textContent='আপনি এখনো কোনো Profile Follow করেননি।';return}const cards=[];for(const f of follows){const s=await getDoc(doc(db,'biodata',f.profileId));if(!s.exists())continue;const d=s.data(),name=d.name||'J❤️R❤️N User';cards.push(`<article class="card"><div class="avatar">${esc(name.charAt(0))}</div><h2>${esc(name)}</h2><div class="meta">${esc(d.age||'—')} বছর • ${esc(d.gender||'—')} • ${esc(d.district||'—')}</div><a class="view" href="profile.html?id=${encodeURIComponent(f.profileId)}">প্রোফাইল দেখুন →</a></article>`)}listEl.innerHTML=cards.join('');status.textContent=`${cards.length}টি Following Profile`;if(!cards.length)status.textContent='Follow করা Profile পাওয়া যায়নি।'}catch(e){console.error(e);status.textContent='Following লোড করা যায়নি।'}}await persistenceReady;onAuthStateChanged(auth,u=>{if(u)load();else{status.textContent='Following দেখতে Login করুন।';setTimeout(()=>location.href='login.html?next='+encodeURIComponent(location.href),700)}});</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%!important;display:flex!important;flex-direction:row!important;gap:10px!important;justify-content:center!important;align-items:stretch!important;padding:14px 0 24px!important;margin:0!important;clear:both!important;box-sizing:border-box!important}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0!important;width:50%!important;max-width:360px!important;height:54px!important;min-height:54px!important;box-sizing:border-box!important;margin:0!important;padding:0 16px!important;display:flex!important;align-items:center!important;justify-content:center!important;vertical-align:middle!important;border:2px solid rgba(255,255,255,.95)!important;border-radius:15px!important;color:#fff!important;background:linear-gradient(135deg,#087b59,#10a978)!important;font:900 15px/1 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif!important;text-decoration:none!important;cursor:pointer!important;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35)!important;transition:filter .2s!important;appearance:none!important;-webkit-appearance:none!important}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)!important}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:none!important;filter:brightness(1.06)!important}@media(max-width:600px){.joron-global-page-nav{gap:6px!important;padding:12px 2px 20px!important}.joron-global-page-nav a,.joron-global-page-nav button{width:50%!important;height:50px!important;min-height:50px!important;padding:0 8px!important;font-size:13px!important;border-width:1.5px!important;border-radius:12px!important}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
