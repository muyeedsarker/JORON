<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7ef"><title>J❤️R❤️N | Following</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><script src="assets/joron-language.js"></script></head><body><main class="following-wrap"><section class="following-hero"><h1>👤 যাদের Follow করছেন</h1><p>আপনার Follow করা Profile-গুলো এখানে দেখুন।</p></section><section class="following-card"><div id="status" class="status">Following লোড হচ্ছে...</div><section id="list" class="list"></section></section></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{getFollowing}from'./assets/follow-service.js';const listEl=document.getElementById('list'),status=document.getElementById('status');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function load(){try{const follows=await getFollowing();if(!follows.length){status.textContent='আপনি এখনো কোনো Profile Follow করেননি।';return}const cards=[];for(const f of follows){const s=await getDoc(doc(db,'biodata',f.profileId));if(!s.exists())continue;const d=s.data(),name=d.name||'J❤️R❤️N User';cards.push(`<article class="profile-card"><div class="avatar">${esc(name.charAt(0))}</div><h2>${esc(name)}</h2><div class="meta">${esc(d.age||'—')} বছর • ${esc(d.gender||'—')} • ${esc(d.district||'—')}</div><a class="view" href="profile.html?id=${encodeURIComponent(f.profileId)}">প্রোফাইল দেখুন →</a></article>`)}listEl.innerHTML=cards.join('');status.textContent=`${cards.length}টি Following Profile`;if(!cards.length)status.textContent='Follow করা Profile পাওয়া যায়নি।'}catch(e){console.error(e);status.textContent='Following লোড করা যায়নি।'}}await persistenceReady;onAuthStateChanged(auth,u=>{if(u)load();else{status.textContent='Following দেখতে Login করুন।';setTimeout(()=>location.href='login.html?next='+encodeURIComponent(location.href),700)}});</script></body></html>
