<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON | Help Center</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><style>.help-links{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px!important;margin-top:24px!important}.help-links>a{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-height:58px!important;margin:0!important;padding:13px 10px!important;box-sizing:border-box!important}.help-links>a.card-ivory{display:flex!important}@media(max-width:650px){.help-links{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.help-links>a{min-height:56px!important;font-size:14px!important}}@media(max-width:390px){.help-links{grid-template-columns:1fr!important}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span><strong>JORON</strong><small>সম্পর্ক জুড়ে দেয় জোড়ন</small></span></a><nav class="main-nav"><a href="index.html">হোম</a><a href="profiles.html">প্রোফাইল</a><a href="dashboard.html">Dashboard</a><a class="nav-login" href="login.html">লগইন</a><a class="btn btn-gold" href="signup.html">রেজিস্টার</a></nav></div></header><main class="section"><div class="container"><section class="card-ivory help-card"><div class="section-heading"><span class="eyebrow">Help Center</span><h1>কীভাবে সাহায্য করতে পারি?</h1><p>Registration, Biodata, Matching, Privacy ও Membership সম্পর্কে দ্রুত উত্তর খুঁজুন।</p></div><input class="input search" id="q" placeholder="🔎 আপনার প্রশ্ন লিখুন…"><div id="faqs" class="faq-list"></div><div class="help-links"><a class="card-ivory" href="signup.html">👤 Profile তৈরি</a><a class="card-ivory" href="smart-biodata.html">📝 Smart Biodata</a><a class="card-ivory" href="matching.html">❤️ Smart Match</a><a class="card-ivory" href="payment.html">💎 Membership</a><a class="card-ivory" href="privacy-policy.html">🔐 Privacy</a><a class="card-ivory" href="report.html">🚨 Report</a></div></section></div></main><script>const data=[['Registration কীভাবে করব?','Profile তৈরি করুন থেকে প্রয়োজনীয় তথ্য দিয়ে Account তৈরি করুন।'],['Biodata কোথায় সম্পাদনা করব?','Smart Biodata পেজে গিয়ে তথ্য পূরণ ও সংরক্ষণ করুন।'],['Smart Match কীভাবে কাজ করবে?','আপনার Preference ও গুরুত্বপূর্ণ সামঞ্জস্যের ভিত্তিতে সম্ভাব্য Match সাজানো হবে।']];const box=document.getElementById('faqs'),q=document.getElementById('q');function render(){const s=q.value.toLowerCase();box.innerHTML=data.filter(x=>(x[0]+x[1]).toLowerCase().includes(s)).map(x=>`<article class="faq-item"><b>❓ ${x[0]}</b><p>${x[1]}</p></article>`).join('')||'<p>মিল পাওয়া যায়নি।</p>'}q.addEventListener('input',render);render();</script></body></html>
