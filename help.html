<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON | Help Center</title><style>:root{--p:#e81768;--g:#087b59;--ink:#17232b;--muted:#68747a}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#fff8fc,#effff8);color:var(--ink)}.wrap{width:min(850px,92%);margin:auto}header{background:#fff;border-top:3px solid var(--p);box-shadow:0 10px 30px #0001}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}.brand strong{font:700 32px Georgia,serif;color:var(--g)}.box{margin:25px 0;background:#fff;border:1px solid #e8eaeb;border-radius:24px;padding:24px;box-shadow:0 18px 55px #00000010}.search{width:100%;min-height:52px;border:1px solid #ddd;border-radius:14px;padding:0 14px;font:inherit}.faq{margin-top:12px;border:1px solid #e7eaeb;border-radius:16px;padding:15px;background:#fff}.faq b{color:var(--g)}.faq p{margin:6px 0 0;color:var(--muted)}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.links a{padding:15px;border-radius:15px;background:#f7faf9;border:1px solid #e3e9e6;font-weight:900}@media(max-width:560px){.links{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/joron-logo.jpg" alt="JORON"><strong>JORON</strong></a><a href="dashboard.html">← Dashboard</a></div></header><main class="wrap"><div class="box"><h1>🤖 JORON Help Center</h1><p style="color:var(--muted)">Registration, Biodata, Matching, Privacy ও Membership সম্পর্কে দ্রুত সাহায্য নিন।</p><input class="search" id="q" placeholder="🔎 প্রশ্ন লিখুন…"><div id="faqs"></div><div class="links"><a href="signup.html">👤 Profile তৈরি</a><a href="biodata.html">📝 Biodata</a><a href="matching.html">❤️ Smart Match</a><a href="payment.html">💎 Membership</a><a href="privacy.html">🔐 Privacy</a><a href="report.html">🚨 Report</a></div></div></main><script>const data=[['Registration কীভাবে করব?','Profile তৈরি করুন থেকে প্রয়োজনীয় তথ্য দিয়ে Account তৈরি করুন।'],['Biodata কোথায় সম্পাদনা করব?','Biodata পেজে গিয়ে তথ্য পূরণ ও সংরক্ষণ করুন।'],['Smart Match কীভাবে কাজ করবে?','আপনার Preference ও গুরুত্বপূর্ণ সামঞ্জস্যের ভিত্তিতে সম্ভাব্য Match সাজানোর জন্য এটি তৈরি করা হয়েছে।'],['Phone/Income কি সবাই দেখবে?','Sensitive তথ্যের visibility আলাদা করে নিয়ন্ত্রণ করার নীতি JORON-এ রাখা হয়েছে।'],['Fake Profile দেখলে কী করব?','Profile বা Report পেজ থেকে Fake Profile, Fraud, Harassment বা Privacy Violation রিপোর্ট করুন।'],['Membership শেষ হলে কী হবে?','Paid সুবিধা বন্ধ হবে; Data Retention Policy অনুযায়ী Profile সংরক্ষণ/Archive করার কাঠামো থাকবে।']];const box=document.getElementById('faqs'),q=document.getElementById('q');function render(){let s=q.value.toLowerCase();box.innerHTML=data.filter(x=>(x[0]+x[1]).toLowerCase().includes(s)).map(x=>`<div class="faq"><b>❓ ${x[0]}</b><p>${x[1]}</p></div>`).join('')||'<p>মিল পাওয়া যায়নি।</p>'}q.addEventListener('input',render);render();</script></body></html>
