<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J❤️R❤️N — Interests</title><style>body{margin:0;padding:16px;font-family:"Noto Sans Bengali","Hind Siliguri",Arial,sans-serif;background:linear-gradient(145deg,#fff1f7,#f2edff,#eafff5);color:#18232a}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #ead8ee;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 15px 40px #46195a12}h1,h2{color:#64158f}.row{padding:15px;border:1px solid #eadcf0;border-radius:16px;margin:10px 0;background:#fbf7ff}.btn{border:0;border-radius:20px;padding:9px 15px;margin:4px;cursor:pointer;font-weight:900}.accept{background:#087b59;color:#fff}.reject{background:#d90b62;color:#fff}.status{color:#087b59;font-weight:800}.muted{color:#718087}.back{color:#64158f;font-weight:900;text-decoration:none}</style></head><body><main class="wrap"><div class="card"><h1>❤️ J❤️R❤️N Interests</h1><p class="muted">আপনার পাঠানো এবং পাওয়া Interest এখানে দেখা যাবে।</p><a class="back" href="profiles.html">← Profiles</a></div><div class="card"><h2>📥 পাওয়া Interest</h2><div id="incoming" class="muted">লোড হচ্ছে...</div></div><div class="card"><h2>📤 পাঠানো Interest</h2><div id="outgoing" class="muted">লোড হচ্ছে...</div></div><div id="status" class="status"></div></main><script type="module">import{auth,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{getIncomingInterests,getOutgoingInterests,respondToInterest}from'./assets/interest-service.js';const incoming=document.getElementById('incoming'),outgoing=document.getElementById('outgoing'),status=document.getElementById('status');const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderIncoming(rows){incoming.innerHTML=rows.length?rows.map(x=>`<div class="row"><b>❤️ একজন সদস্য আপনাকে Interest পাঠিয়েছেন</b><div class="muted">Status: ${esc(x.status)}</div>${x.status==='pending'?`<button class="btn accept" data-id="${esc(x.id)}" data-status="accepted">✓ Accept</button><button class="btn reject" data-id="${esc(x.id)}" data-status="rejected">✕ Reject</button>`:''}</div>`).join(''):'<p class="muted">কোনো নতুন Interest নেই।</p>'}function renderOutgoing(rows){outgoing.innerHTML=rows.length?rows.map(x=>`<div class="row"><b>❤️ Profile: ${esc(x.profileId)}</b><div class="muted">Status: ${esc(x.status)}</div></div>`).join(''):'<p class="muted">আপনি এখনো কাউকে Interest পাঠাননি।</p>'}async function load(){try{renderIncoming(await getIncomingInterests());renderOutgoing(await getOutgoingInterests())}catch(e){console.error(e);status.textContent='Interest load করা যায়নি। Firebase Rules পরীক্ষা করুন।'}}incoming.addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;b.disabled=true;try{await respondToInterest(b.dataset.id,b.dataset.status);status.textContent=b.dataset.status==='accepted'?'❤️ Interest Accepted হয়েছে।':'Interest Reject করা হয়েছে।';await load()}catch(e){console.error(e);status.textContent='Status update করা যায়নি।';b.disabled=false}});await persistenceReady;onAuthStateChanged(auth,user=>{if(!user){location.replace('login.html?next=interests.html');return}load()});</script></body></html>
