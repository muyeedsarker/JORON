<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#64158f">
  <title>JORON — QR প্রবেশ</title>
  <meta name="description" content="JORON ওয়েবসাইটে নিরাপদ QR প্রবেশপথ">
  <link rel="stylesheet" href="./assets/joron-theme-2026.css">
  <style>
    :root{color-scheme:light}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:linear-gradient(135deg,#faf7ff,#f2eafa)}
    .qr-wrap{width:min(100%,520px);box-sizing:border-box;background:#fff;border-radius:24px;padding:28px;box-shadow:0 16px 45px rgba(70,30,100,.14);text-align:center}
    .qr-wrap h1{margin:0 0 8px;font-size:clamp(26px,7vw,38px)}
    .qr-wrap p{margin:8px 0;color:#555;line-height:1.6}
    #qrcode{width:260px;min-height:260px;margin:22px auto;padding:12px;background:#fff;border-radius:16px;display:grid;place-items:center;box-sizing:border-box}
    #qrcode img,#qrcode canvas{max-width:100%;height:auto}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:12px;text-decoration:none;font-weight:700;cursor:pointer;margin:6px}
    .primary{background:#64158f;color:#fff}
    .secondary{background:#f1eafa;color:#64158f}
    .note{font-size:13px;color:#666;margin-top:18px}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <main class="qr-wrap" aria-labelledby="title">
    <h1 id="title">💜 JORON</h1>
    <p>QR স্ক্যান করে JORON-এর নিরাপদ প্রবেশপথে যান।</p>
    <div id="qrcode" aria-label="JORON login QR code"></div>
    <a class="btn primary" href="./login.html?qr=1">JORON Login খুলুন</a>
    <a class="btn secondary" href="./index.html">হোম পেজ</a>
    <p class="note">এই QR কোডে কোনো পাসওয়ার্ড, OTP বা Admin secret রাখা নেই। পরবর্তী ধাপে Passkey/Fingerprint যাচাই আলাদাভাবে যুক্ত হবে।</p>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{
      const target=new URL('./login.html?qr=1',window.location.href).href;
      const box=document.getElementById('qrcode');
      const make=()=>{
        if(window.QRCode){
          new QRCode(box,{text:target,width:236,height:236,correctLevel:QRCode.CorrectLevel.M});
        }else{
          box.textContent='QR তৈরি করা যাচ্ছে না। Login খুলুন।';
        }
      };
      if(window.QRCode) make(); else setTimeout(make,500);
    });
  </script>
</body>
</html>
