<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#64158f">
  <title>JORON — QR Code</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7f2fb;font-family:system-ui,"Noto Sans Bengali",sans-serif}
    .card{width:min(92vw,360px);padding:24px 20px;background:#fff;border-radius:24px;text-align:center;box-shadow:0 12px 35px rgba(70,30,100,.14)}
    h1{margin:0 0 18px;color:#64158f;font-size:28px}
    #qrcode{width:260px;height:260px;margin:0 auto;padding:10px;background:#fff;border:1px solid #eee;border-radius:16px;display:grid;place-items:center}
    #qrcode img,#qrcode canvas{display:block;max-width:100%;height:auto}
    .status{margin:16px 0 0;color:#666;font-size:13px;line-height:1.5}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>💜 JORON</h1>
    <div id="qrcode" aria-label="JORON QR Code"></div>
    <p id="status" class="status">QR স্ক্যান করলে JORON Login খুলবে।</p>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{
      const box=document.getElementById('qrcode');
      const status=document.getElementById('status');
      const target=new URL('./login.html?qr=1',window.location.href).href;
      const makeQR=()=>{
        if(!window.QRCode){status.textContent='QR তৈরি হচ্ছে না। পেজটি আবার খুলুন।';return;}
        box.innerHTML='';
        new QRCode(box,{text:target,width:236,height:236,correctLevel:QRCode.CorrectLevel.M});
      };
      if(window.QRCode) makeQR();
      else setTimeout(makeQR,700);
    });
  </script>
</body>
</html>
