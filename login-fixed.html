<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J❤️R❤️N Login</title><link rel="stylesheet" href="assets/joron-reference-theme.css"><link rel="stylesheet" href="assets/joron-theme-v2.css"><link rel="stylesheet" href="assets/joron-master-theme.css"><link rel="stylesheet" href="assets/joron-ux-polish.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v1.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v2.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v3.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v4.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v5.css"><link rel="stylesheet" href="assets/joron-live-fix.css"></head><body><main style="max-width:420px;margin:50px auto;padding:24px"><h1>🔐 J❤️R❤️N Login</h1><form id="loginForm"><input id="email" type="email" placeholder="ইমেইল" required style="width:100%;padding:12px;margin:8px 0"><input id="password" type="password" placeholder="পাসওয়ার্ড" required style="width:100%;padding:12px;margin:8px 0"><button id="loginButton" type="submit" style="width:100%;padding:12px">Login</button></form><p id="status"></p></main><script type="module">import{auth,signInWithEmailAndPassword,persistenceReady}from './assets/firebase-client.js';const f=document.getElementById('loginForm'),b=document.getElementById('loginButton'),s=document.getElementById('status');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;s.textContent='লগইন হচ্ছে...';try{await persistenceReady;const c=document.getElementById('email').value.trim(),p=document.getElementById('password').value;await signInWithEmailAndPassword(auth,c,p);s.textContent='✅ লগইন সফল।';location.href='biodata.html';}catch(x){console.error(x);s.textContent='❌ '+(x.code||x.message||'Login failed');b.disabled=false;}});</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 0 24px;margin:0 auto;clear:both}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0;max-width:360px;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border:2px solid rgba(255,255,255,.9);border-radius:15px;color:#fff;background:linear-gradient(135deg,#087b59,#10a978);font:900 15px/1.2 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:translateY(-2px);filter:brightness(1.06)}@media(max-width:600px){.joron-global-page-nav{gap:6px;padding:12px 2px 20px}.joron-global-page-nav a,.joron-global-page-nav button{min-height:48px;padding:11px 8px;font-size:13px;border-width:1.5px;border-radius:12px}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
