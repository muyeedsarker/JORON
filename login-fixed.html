<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J❤️R❤️N Login</title><link rel="stylesheet" href="assets/joron-reference-theme.css"></head><body><main style="max-width:420px;margin:50px auto;padding:24px"><h1>🔐 J❤️R❤️N Login</h1><form id="loginForm"><input id="email" type="email" placeholder="ইমেইল" required style="width:100%;padding:12px;margin:8px 0"><input id="password" type="password" placeholder="পাসওয়ার্ড" required style="width:100%;padding:12px;margin:8px 0"><button id="loginButton" type="submit" style="width:100%;padding:12px">Login</button></form><p id="status"></p></main><script type="module">import{auth,signInWithEmailAndPassword,persistenceReady}from './assets/firebase-client.js';const f=document.getElementById('loginForm'),b=document.getElementById('loginButton'),s=document.getElementById('status');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;s.textContent='লগইন হচ্ছে...';try{await persistenceReady;const c=document.getElementById('email').value.trim(),p=document.getElementById('password').value;await signInWithEmailAndPassword(auth,c,p);s.textContent='✅ লগইন সফল।';location.href='biodata.html';}catch(x){console.error(x);s.textContent='❌ '+(x.code||x.message||'Login failed');b.disabled=false;}});</script></body></html>
