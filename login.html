<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J❤️R❤️N | Login</title>

<link rel="stylesheet" href="assets/style.css">

<style>
body{
 margin:0;
 font-family:"Noto Sans Bengali",sans-serif;
 background:linear-gradient(135deg,#fff5fb,#f0e8ff);
}

.login-box{
 max-width:420px;
 margin:50px auto;
 background:white;
 padding:30px;
 border-radius:25px;
 box-shadow:0 10px 30px #0002;
}

.logo{
 text-align:center;
}

.logo img{
 width:120px;
 height:120px;
 border-radius:50%;
}

h1{
 text-align:center;
 color:#64158f;
}

p{
 text-align:center;
 color:#666;
}

label{
 font-weight:bold;
 display:block;
 margin-top:15px;
}

input{
 width:100%;
 height:50px;
 border-radius:12px;
 border:1px solid #ddd;
 padding:0 15px;
 font-size:16px;
 box-sizing:border-box;
}

button{
 width:100%;
 height:55px;
 margin-top:20px;
 border:0;
 border-radius:15px;
 background:linear-gradient(90deg,#d90b62,#64158f);
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

.forgot{
 display:block;
 text-align:right;
 margin-top:10px;
 color:#d90b62;
 font-weight:bold;
 cursor:pointer;
}

.signup{
 text-align:center;
 margin-top:20px;
}

.signup a{
 color:#087b59;
 font-weight:bold;
}

#message{
 text-align:center;
 margin-bottom:15px;
 font-weight:bold;
}
</style>

<style id="joron-premium-page-skin">
:root{--joron-p:#64158f;--joron-k:#d90b62;--joron-g:#087b59}
body{background:radial-gradient(circle at 10% 0%,#ffe8f3 0,transparent 28%),radial-gradient(circle at 90% 10%,#eee1ff 0,transparent 30%),linear-gradient(145deg,#fff7fb,#f4efff 55%,#edfff7)!important}
header{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(10px)}
main{min-height:calc(100vh - 170px)}
.card,.profile-card,.form-card,.login-card,.panel,.container>section{box-shadow:0 12px 32px rgba(70,25,90,.10)!important;border-color:#ead8ee!important}
</style><link rel="stylesheet" href="assets/joron-reference-theme.css"></head>

<body>

<div class="login-box">

<div class="logo">
<img src="assets/joron-logo.jpg">
</div>

<h1>🔐 লগইন করুন</h1>

<p>আপনার J❤️R❤️N অ্যাকাউন্টে প্রবেশ করুন</p>

<div id="message"></div>

<form id="loginForm">

<label>📧 ইমেইল</label>
<input id="email" type="email" placeholder="আপনার ইমেইল লিখুন" required>


<label>🔒 পাসওয়ার্ড</label>
<input id="password" type="password" placeholder="আপনার পাসওয়ার্ড লিখুন" required>


<span class="forgot" onclick="resetPassword()">
পাসওয়ার্ড ভুলে গেছেন?
</span>


<button type="submit">
🔐 নিরাপদে লগইন করুন
</button>


</form>


<div class="signup">
নতুন সদস্য?
<a href="signup.html">
অ্যাকাউন্ট তৈরি করুন
</a>
</div>

</div>
<script type="module">

import { auth } from "./assets/firebase-client.js";
import { 
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const form = document.getElementById("loginForm");
const msg = document.getElementById("message");


function showMessage(text, ok=false){
msg.innerHTML = text;
msg.className="message";

if(ok){
msg.style.background="#e8fff3";
msg.style.color="#087b59";
}else{
msg.style.background="#fff0f0";
msg.style.color="#b42318";
}
}


form.addEventListener("submit", async function(e){

e.preventDefault();


let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;


if(!email || !password){
showMessage("ইমেইল ও পাসওয়ার্ড দিন");
return;
}


try{

let result = await signInWithEmailAndPassword(
auth,
email,
password
);


if(result.user){

showMessage("✅ লগইন সফল হচ্ছে...",true);


setTimeout(()=>{
window.location.href="biodata.html";
},1000);


}


}catch(error){

showMessage("❌ ইমেইল অথবা পাসওয়ার্ড সঠিক নয়");

console.log(error);

}


});


window.resetPassword = async function(){

let email=document.getElementById("email").value.trim();


if(!email){
showMessage("আগে ইমেইল লিখুন");
return;
}


try{

await sendPasswordResetEmail(auth,email);

showMessage(
"✅ পাসওয়ার্ড পরিবর্তনের লিংক ইমেইলে পাঠানো হয়েছে",
true
);


}catch(error){

showMessage("পাসওয়ার্ড রিসেট করা যায়নি");

}


};


</script>

</html>
