<script type="module">
import {auth,signInWithEmailAndPassword,sendPasswordResetEmail,persistenceReady} from './assets/firebase-client.js';
const msg=document.getElementById('msg'),form=document.getElementById('emailForm');
const show=t=>msg.textContent=t;
document.getElementById('idLoginBtn').onclick=()=>{form.style.display=form.style.display==='block'?'none':'block';document.getElementById('email')?.focus()};
form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return show('ইমেইল ও পাসওয়ার্ড দিন');try{await persistenceReady;await signInWithEmailAndPassword(auth,email,password);show('✅ লগইন সফল হচ্ছে...');setTimeout(()=>location.href='biodata.html',700)}catch(e){show('❌ ইমেইল অথবা পাসওয়ার্ড সঠিক নয়')}});
document.getElementById('forgot').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return show('আগে ইমেইল লিখুন');try{await sendPasswordResetEmail(auth,email);show('✅ রিসেট লিংক ইমেইলে পাঠানো হয়েছে')}catch(e){show('❌ পাসওয়ার্ড রিসেট করা যায়নি')}};
