<body><main class="login-page"><section class="login-shell" aria-label="JORON Login"><div class="hero"><img src="assets/couple.png?v=hero-fit-20260903" alt="JORON Matrimony Matrimony Matrimony Matrimony Matrimony Matrimony Matrimony Matrimony Couple" loading="eager"></div><div class="login-panel"><p class="welcome">ভালোবাসার সম্পর্ককে বিয়ের বন্ধনে জুড়ে দেয় JORON</p><div id="msg" class="msg" aria-live="polite"></div><button class="btn fb" id="facebookBtn" type="button"><span class="icon">f</span> Continue With Facebook</button><button class="btn google" id="googleBtn" type="button"><span class="icon">G</span> Continue With Google</button><div class="divider">অথবা</div><button class="btn idbtn" id="idLoginBtn" type="button"><span class="icon">👤</span> Login with ID / Mobile / Email</button><form id="emailForm" class="email-form"><label for="email">📧 Member ID / Mobile / Email</label><input id="email" type="text" autocomplete="username" placeholder="Member ID / মোবাইল / ইমেইল" required><label for="password">🔒 Password</label><input id="password" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড লিখুন" required><button class="btn idbtn small" type="submit">🔐 নিরাপদে লগইন করুন</button><button type="button" id="forgot" class="btn google small">পাসওয়ার্ড ভুলে গেছেন?</button></form><p class="terms">By logging in, you accept our <a href="terms.html">Terms of service</a> and <a href="privacy.html">privacy policy</a>.</p><div class="homeback"><a href="index.html">🏠 হোম</a><a href="signup.html">নতুন সদস্য? অ্যাকাউন্ট তৈরি করুন</a></div></div></section></main>
<script type="module">
import{auth,persistenceReady,signInWithCustomToken,GoogleAuthProvider,FacebookAuthProvider,signInWithPopup,ensureUserProfile}from'./assets/firebase-client.js';
const $=id=>document.getElementById(id),msg=$('msg'),form=$('emailForm');
const show=t=>msg.textContent=t;
const googleProvider=new GoogleAuthProvider(),facebookProvider=new FacebookAuthProvider();
googleProvider.setCustomParameters({prompt:'select_account'});
const params=new URLSearchParams(location.search),rawNext=params.get('next');
// Security: only allow local relative redirects; reject absolute URLs and protocol-relative URLs.
const next=rawNext&&/^(?!\/\/)(?![a-z][a-z0-9+.-]*:)[^\\]*$/i.test(rawNext)&&rawNext.startsWith('/')?rawNext:null;
const IDENTIFIER_AUTH_URL='https://us-central1-joron-d7742.cloudfunctions.net/loginWithIdentifier';
const IDENTIFIER_RESET_URL='https://us-central1-joron-d7742.cloudfunctions.net/passwordResetByIdentifier';
function friendly(e){const c=e?.code||e?.message||'';const map={'auth/invalid-credential':'Member ID/মোবাইল/ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।','auth/popup-closed-by-user':'লগইন উইন্ডো বন্ধ করা হয়েছে।','auth/popup-blocked':'ব্রাউজার popup বন্ধ করেছে। Popup অনুমতি দিন।','AUTH_SERVICE_UNAVAILABLE':'নিরাপদ লগইন সেবা এখন সাময়িকভাবে পাওয়া যাচ্ছে না। একটু পরে আবার চেষ্টা করুন।'};return map[c]||'লগইন সম্পন্ন করা যায়নি। আবার চেষ্টা করুন।'}
async function postJson(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data?.error||'AUTH_SERVICE_UNAVAILABLE');return data}
async function oauth(provider,label){try{await persistenceReady;show('⏳ '+label+' দিয়ে লগইন হচ্ছে...');const r=await signInWithPopup(auth,provider);await ensureUserProfile(r.user,provider===googleProvider?'google.com':'facebook.com');show('✅ লগইন সফল হচ্ছে...');setTimeout(()=>location.href=next||'biodata.html',500)}catch(err){console.error(err);show('❌ '+friendly(err))}}
$('facebookBtn').onclick=()=>oauth(facebookProvider,'Facebook');$('googleBtn').onclick=()=>oauth(googleProvider,'Google');
$('idLoginBtn').onclick=()=>{form.style.display=form.style.display==='block'?'none':'block';if(form.style.display==='block')$('email').focus()};
form.addEventListener('submit',async e=>{e.preventDefault();const identifier=$('email').value.trim(),password=$('password').value;if(!identifier||!password)return show('Member ID, মোবাইল/ইমেইল এবং পাসওয়ার্ড দিন');try{show('⏳ নিরাপদে লগইন হচ্ছে...');await persistenceReady;const result=await postJson(IDENTIFIER_AUTH_URL,{identifier,password});if(!result.customToken)throw new Error('AUTH_SERVICE_UNAVAILABLE');await signInWithCustomToken(auth,result.customToken);show('✅ লগইন সফল হচ্ছে...');setTimeout(()=>location.href=next||'biodata.html',500)}catch(err){console.error('JORON identifier login error:',err);show('❌ '+friendly(err))}});
$('forgot').onclick=async()=>{const identifier=$('email').value.trim();if(!identifier)return show('আগে Member ID / মোবাইল / ইমেইল লিখুন');try{show('⏳ রিসেট তথ্য যাচাই হচ্ছে...');await postJson(IDENTIFIER_RESET_URL,{identifier});show('✅ যদি তথ্যটি JORON অ্যাকাউন্টের সাথে যুক্ত থাকে, রিসেট লিংক ইমেইলে পাঠানো হবে।')}catch(err){console.error('JORON identifier reset error:',err);show('❌ '+friendly(err))}};
</script></body></html>
