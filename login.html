b42b8,#e51a68)!important;color:#fff!important;border-color:#d7a0ff!important}.icon{font-size:18px;font-weight:900}.divider{display:flex;align-items:center;gap:9px;margin:4px 0;color:#ffe4a0;font-size:12px;font-weight:800}.divider:before,.divider:after{content:"";height:1px;background:rgba(255,226,158,.55);flex:1}.terms{margin:5px 6px 0;color:#ffe8ef;font-size:9.5px;line-height:1.3}.terms a{color:#ffd76f;font-weight:800;text-decoration:none}.homeback{display:flex;justify-content:center;gap:14px;margin-top:4px;font-size:10.5px}.homeback a{color:#fff;text-decoration:none}.email-form{display:none;text-align:left;margin-top:5px;padding:10px;border-radius:14px;background:#fff4f8;border:1px solid #e5a9c2}.email-form label{display:block;margin:4px 0;font-size:11px;font-weight:800;color:#5c2038}.email-form input{width:100%;height:38px;border:1px solid #d8bf99;border-radius:10px;padding:0 10px;background:#fff;color:#35251f}.small{height:38px!important;font-size:12px!important}.passkey{display:none!important}@media(min-width:600px){.login-shell{height:calc(100dvh - 28px);border-radius:24px}}@media(max-width:390px){.hero{flex-basis:43dvh}.hero img{object-position:center 8%;transform:none}.login-panel{padding:6px 14px 7px}.btn{height:40px;font-size:13px;margin:3px 0}.welcome{font-size:13px}.terms{font-size:9px}.homeback{font-size:10px;margin-top:3px}}

<body><main class="login-page"><section class="login-shell" aria-label="JORON Login"><div class="hero"><img src="assets/couple.png?v=hero-fit-20260904e" alt="JORON Matrimony Couple" loading="eager"></div><div class="login-panel"><p class="welcome">ভালোবাসার সম্পর্ককে বিয়ের বন্ধনে জুড়ে দেয় JORON</p><div id="msg" class="msg" aria-live="polite"></div><button class="btn fb" id="facebookBtn" type="button"><span class="icon">f</span> Continue With Facebook</button><button class="btn google" id="googleBtn" type="button"><span class="icon">G</span> Continue With Google</button><div class="divider">অথবা</div><button class="btn idbtn" id="idLoginBtn" type="button"><span class="icon">👤</span> Login with ID / Mobile / Email</button><button class="btn otpbtn" id="otpLoginBtn" type="button"><span class="icon">📱</span> Login with Mobile OTP</button><form id="emailForm" class="email-form"><label for="email">📧 Member ID / Mobile / Email</label><input id="email" type="text" autocomplete="username" placeholder="Member ID / মোবাইল / ইমেইল" required><label for="password">🔒 Password</label><input id="password" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড লিখুন" required><button class="btn idbtn small" type="submit">🔐 নিরাপদে লগইন করুন</button><button type="button" id="forgot" class="btn google small">পাসওয়ার্ড ভুলে গেছেন?</button></form><p class="terms">By logging in, you accept our <a href="terms.html">Terms of service</a> and <a href="privacy.html">privacy policy</a>.</p><div class="homeback"><a href="index.html">🏠 হোম</a><a href="signup.html">নতুন সদস্য? অ্যাকাউন্ট তৈরি করুন</a></div></div></section></main>
<script src="assets/joron-language.js"></script>
<script type="module">
import{auth,persistenceReady,signInWithCustomToken,GoogleAuthProvider,FacebookAuthProvider,signInWithPopup,ensureUserProfile}from'./assets/firebase-client.js';
const $=id=>document.getElementById(id),msg=$('msg'),form=$('emailForm');
const show=t=>msg.textContent=t;
const googleProvider=new GoogleAuthProvider(),facebookProvider=new FacebookAuthProvider();
googleProvider.setCustomParameters({prompt:'select_account'});
const params=new URLSearchParams(location.search),rawNext=params.get('next');
const next=rawNext&&/^(?!\/\/)(?![a-z][a-z0-9+.-]*:)[^\\]*$/i.test(rawNext)&&rawNext.startsWith('/')?rawNext:null;
const IDENTIFIER_AUTH_URL='https://us-central1-joron-d7742.cloudfunctions.net/loginWithIdentifier';
const IDENTIFIER_RESET_URL='https://us-central1-joron-d7742.cloudfunctions.net/passwordResetByIdentifier';
const OTP_LOGIN_URL='otp-login.html'+(next?'?next='+encodeURIComponent(next):'');
function friendly(e){const c=e?.code||e?.message||'';const map={'auth/invalid-credential':'Member ID/মোবাইল/ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।','auth/popup-closed-by-user':'লগইন উইন্ডো বন্ধ করা হয়েছে।','auth/popup-blocked':'ব্রাউজার popup বন্ধ করেছে। Popup অনুমতি দিন।','AUTH_SERVICE_UNAVAILABLE':'নিরাপদ লগইন সেবা এখন সাময়িকভাবে পাওয়া যাচ্ছে না। একটু পরে আবার চেষ্টা করুন।'};return map[c]||'লগইন সম্পন্ন করা যায়নি। আবার চেষ্টা করুন।'}
async function postJson(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data?.error||'AUTH_SERVICE_UNAVAILABLE');return data}
async function oauth(provider,label){try{await persistenceReady;show('⏳ '+label+' দিয়ে লগইন হচ্ছে...');const r=await signInWithPopup(auth,provider);await ensureUserProfile(r.user,provider===googleProvider?'google.com':'facebook.com');show('✅ লগইন সফল হচ্ছে...');setTimeout(()=>location.href=next||'biodata.html',500)}catch(err){console.error(err);show('❌ '+friendly(err))}}
$('facebookBtn').onclick=()=>oauth(facebookProvider,'Facebook');$('googleBtn').onclick=()=>oauth(googleProvider,'Google');
$('otpLoginBtn').onclick=()=>{location.href=OTP_LOGIN_URL};
$('idLoginBtn').onclick=()=>{form.style.display=form.style.display==='block'?'none':'block';if(form.style.display==='block')$('email').focus()};
form.addEventListener('submit',async e=>{e.preventDefault();const identifier=$('email').value.trim(),password=$('password').value;if(!identifier||!password)return show('Member ID, মোবাইল/ইমেইল এবং পাসওয়ার্ড দিন');try{show('⏳ নিরাপদে লগইন হচ্ছে...');await persistenceReady;const result=await postJson(IDENTIFIER_AUTH_URL,{identifier,password});if(!result.customToken)throw new Error('AUTH_SERVICE_UNAVAILABLE');await signInWithCustomToken(auth,result.customToken);show('✅ লগইন সফল হচ্ছে...');setTimeout(()=>location.href=next||'biodata.html',500)}catch(err){console.error('JORON identifier login error:',err);show('❌ '+friendly(err))}});
$('forgot').onclick=async()=>{const identifier=$('email').value.trim();if(!identifier)return show('আগে Member ID / মোবাইল / ইমেইল লিখুন');try{show('⏳ রিসেট তথ্য যাচাই হচ্ছে...');await postJson(IDENTIFIER_RESET_URL,{identifier});show('✅ যদি তথ্যটি JORON অ্যাকাউন্টের সাথে যুক্ত থাকে, রিসেট লিংক ইমেইলে পাঠানো হবে।')}catch(err){console.error('JORON identifier reset error:',err);show('❌ '+friendly(err))}};
</script></body></html>
