<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JORON — Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f7f2, #f5f8f7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 28px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }

    .logo {
      text-align: center;
      color: #176b5b;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #444;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #176b5b;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 28px;
      background: #176b5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 12px;
      color: #176b5b;
      text-decoration: none;
      font-size: 14px;
    }

    .register {
      text-align: center;
      margin-top: 25px;
      color: #666;
    }

    .register a {
      color: #176b5b;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">JORON</div>

    <p class="tagline">
      দুজনের গল্প, এক জোড়ন। ❤️
    </p>

    <h1>লগইন করুন</h1>

    <form onsubmit="loginUser(event)">

      <label for="email">ইমেইল</label>
      <input
        type="email"
        id="email"
        placeholder="আপনার ইমেইল লিখুন"
        required
      >

      <label for="password">পাসওয়ার্ড</label>
      <input
        type="password"
        id="password"
        placeholder="আপনার পাসওয়ার্ড লিখুন"
        required
      >

      <a href="#" class="forgot">
        পাসওয়ার্ড ভুলে গেছেন?
      </a>

      <button type="submit">
        লগইন
      </button>

    </form>

    <div class="register">
      JORON-এ নতুন?
      <a href="signup.html">প্রোফাইল তৈরি করুন</a>
    </div>

    <a href="index.html" class="back">
      ← হোমে ফিরে যান
    </a>

  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDWxxu3zwThJp1fuWMhXiRig3Fswt0QARA",
      authDomain: "joron-d7742.firebaseapp.com",
      projectId: "joron-d7742",
      storageBucket: "joron-d7742.firebasestorage.app",
      messagingSenderId: "907727989078",
      appId: "1:907727989078:web:4fdd266e3517a862fa0ef7",
      measurementId: "G-Q8PXH6C5NC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.loginUser = async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);

        alert("লগইন সফল হয়েছে।");

        window.location.href = "biodata.html";

      } catch (error) {
        console.error(error);

        let message = "লগইন করা সম্ভব হয়নি। আবার চেষ্টা করুন।";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          message = "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।";
        } else if (error.code === "auth/invalid-email") {
          message = "সঠিক ইমেইল ঠিকানা দিন।";
        } else if (error.code === "auth/too-many-requests") {
          message = "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
        }

        alert(message);
      }
    };
  </script>

</body>
</html>
