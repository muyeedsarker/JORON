<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#64158f"><title>J❤️R❤️N | Login</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="form-page"><div class="form-card" style="max-width:460px"><div style="text-align:center"><img src="assets/joron-logo.jpg" alt="J❤️R❤️N" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.75);box-shadow:0 12px 35px rgba(232,23,104,.25)"></div><h1>🔐 লগইন করুন</h1><p style="text-align:center;color:#e8dff0">আপনার J❤️R❤️N অ্যাকাউন্টে প্রবেশ করুন</p><div id="message" class="status"></div><form id="loginForm"><div class="field"><label>📧 ইমেইল</label><input id="email" type="email" placeholder="আপনার ইমেইল লিখুন" required></div><div class="field"><label>🔒 পাসওয়ার্ড</label><input id="password" type="password" placeholder="আপনার পাসওয়ার্ড লিখুন" required></div><button type="button" class="unstyled" id="forgot" style="display:block;margin:8px 0 0 auto;background:none;border:0;color:#ff9fc4;font-weight:900">পাসওয়ার্ড ভুলে গেছেন?</button><button type="submit" class="btn pink" style="width:100%;margin-top:18px">🔐 নিরাপদে লগইন করুন</button></form><div style="text-align:center;margin-top:22px;color:#e8dff0">নতুন সদস্য? <a href="signup.html" style="color:#ff9fc4;font-weight:900">অ্যাকাউন্ট তৈরি করুন</a></div></div></main><script type="module">import{auth}from'./assets/firebase-client.js';import{signInWithEmailAndPassword,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';const form=document.getElementById('loginForm'),msg=document.getElementById('message');function showMessage(t,ok=false){msg.textContent=t;msg.style.color=ok?'#9ff0c9':'#ffb0c7'}form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return showMessage('ইমেইল ও পাসওয়ার্ড দিন');try{await signInWithEmailAndPassword(auth,email,password);showMessage('✅ লগইন সফল হচ্ছে...',true);setTimeout(()=>location.href='biodata.html',700)}catch(error){showMessage('❌ ইমেইল অথবা পাসওয়ার্ড সঠিক নয়');console.log(error)}});document.getElementById('forgot').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return showMessage('আগে ইমেইল লিখুন');try{await sendPasswordResetEmail(auth,email);showMessage('✅ পাসওয়ার্ড পরিবর্তনের লিংক ইমেইলে পাঠানো হয়েছে',true)}catch(e){showMessage('পাসওয়ার্ড রিসেট করা যায়নি')}};</script></body></html>
