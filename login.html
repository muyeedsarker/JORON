<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#087b59">
<title>JORON | লগইন</title><link rel="stylesheet" href="assets/style.css">
<style>
body{min-height:100vh;background:radial-gradient(circle at 10% 10%,#d8f7ee 0,transparent 30%),radial-gradient(circle at 90% 80%,#ffdce9 0,transparent 32%),linear-gradient(135deg,#f2fff9,#fff7fb);font-family:"Noto Sans Bengali","Hind Siliguri",Arial,sans-serif}.login-wrap{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:30px 15px}.login-card{width:min(480px,100%);background:#ffffffea;border:1px solid #cfe9e0;border-radius:30px;padding:30px 24px;box-shadow:0 25px 75px #087b5920,0 8px 28px #e8176810;position:relative;overflow:hidden;backdrop-filter:blur(12px)}.login-card:before{content:"❤";position:absolute;right:-20px;top:-40px;font-size:150px;color:#e8176810}.master-logo{position:relative;z-index:1;text-align:center}.master-logo img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 10px 28px #087b5930}.master-name{font:900 48px Georgia,"Times New Roman",serif;color:#087563;letter-spacing:2px;margin-top:5px}.login-subtitle{text-align:center;color:#6d7975;margin:5px 0 24px;font-size:15px}.login-title{text-align:center;font-size:31px;color:#064f3d;margin-bottom:22px}.field{position:relative;z-index:1}.field label{display:block;margin:13px 0 6px;font-weight:900;color:#29483f}.field input{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid #d5e5df;border-radius:15px;background:#fff;font:inherit;font-size:16px;outline:none}.field input:focus{border-color:#e81768;box-shadow:0 0 0 4px #e8176812}.password-row{display:flex;justify-content:flex-end;margin-top:8px}.forgot{color:#087563;font-size:13px;font-weight:800}.login-button{width:100%;margin-top:20px!important;min-height:54px!important;border:0!important;border-radius:28px!important;background:linear-gradient(105deg,#e81768,#ff4f91,#087b59)!important;color:#fff!important;font-weight:900!important;box-shadow:0 9px 25px #e8176835!important}.signup-box{margin-top:22px;padding-top:18px;border-top:1px solid #e2ece8;text-align:center;color:#6d7975}.signup-box a{color:#e81768;font-weight:900}.back{display:block;text-align:center;margin-top:17px;color:#087563;font-weight:900;text-decoration:none}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:20px}.trust div{text-align:center;padding:9px 4px;border-radius:13px;background:linear-gradient(135deg,#effbf6,#fff2f8);border:1px solid #dcebe5;font-size:10px;font-weight:800;color:#45645c}.footer{text-align:center}@media(max-width:500px){.login-card{padding:27px 18px;border-radius:27px}.master-logo img{width:78px;height:78px}.master-name{font-size:42px}.login-title{font-size:28px}.trust{grid-template-columns:1fr}}
</style>
</head>
<body data-auth-guest-only>
<header class="header"><div class="container nav"><a href="index.html" class="logo">J<span>♡</span>RON</a><nav class="navlinks"><a href="index.html">হোম</a><a href="signup.html">Membership</a><a href="login.html">Login</a></nav></div></header>
<main class="login-wrap"><section class="login-card"><div class="master-logo"><img src="assets/joron-logo.jpg" alt="JORON Master Logo"><div class="master-name">JORON</div></div><div class="login-subtitle">দুজনের গল্প, এক জোড়ন। ❤️</div><h1 class="login-title">🔐 লগইন করুন</h1>
<form id="loginForm"><div class="field"><label for="email">ইমেইল</label><input id="email" type="email" placeholder="আপনার ইমেইল লিখুন" required></div><div class="field"><label for="password">পাসওয়ার্ড</label><input id="password" type="password" placeholder="আপনার পাসওয়ার্ড লিখুন" required><div class="password-row"><a class="forgot" href="#" id="resetLink">পাসওয়ার্ড ভুলে গেছেন?</a></div></div><button class="btn pink login-button" id="loginButton" type="submit">🔐 নিরাপদে লগইন</button></form>
<div class="trust"><div>🛡️ নিরাপদ</div><div>🔒 Privacy-first</div><div>❤️ বিশ্বাসযোগ্য</div></div><div class="signup-box">JORON-এ নতুন? <a href="signup.html">নতুন অ্যাকাউন্ট তৈরি করুন</a></div><a class="back" href="index.html">← হোমে ফিরে যান</a></section></main>
<footer class="footer">❤️ JORON — বিশ্বাস • সম্মান • সম্পর্ক</footer>
<script type="module">
import{loginUser,resetPassword,authErrorMessage}from"./assets/firebase-auth.js";import"./assets/auth-page.js";const form=document.getElementById("loginForm"),button=document.getElementById("loginButton"),email=document.getElementById("email"),password=document.getElementById("password");form.addEventListener("submit",async event=>{event.preventDefault();button.disabled=true;try{await loginUser(email.value,password.value);const next=new URLSearchParams(location.search).get("next");location.replace(next||"biodata.html")}catch(error){alert(authErrorMessage(error));button.disabled=false}});document.getElementById("resetLink").addEventListener("click",async event=>{event.preventDefault();if(!email.value.trim()){alert("আগে আপনার ইমেইল লিখুন।");return}try{await resetPassword(email.value);alert("পাসওয়ার্ড পরিবর্তনের লিংক আপনার ইমেইলে পাঠানো হয়েছে।")}catch(error){alert(authErrorMessage(error))}});
</script></body></html>
