<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON | Magic Filter</title><style>body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(145deg,#24122f,#32143f 55%,#211129);color:#fff4fb}.wrap{width:min(1100px,94%);margin:auto}.hero{padding:28px 0}.hero h1{margin:0;color:#ff4fa3}.panel{background:linear-gradient(145deg,#3a183f,#2b1238,#4c1941);border:1px solid rgba(255,180,225,.28);border-radius:24px;padding:18px;box-shadow:0 14px 35px #0005}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:#e6cfe0;font-weight:900;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border-radius:12px;border:1px solid #ffffff30;background:#301637;color:#fff;box-sizing:border-box}.count{margin:18px 0;color:#ff8fc2;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:18px 0 40px}.card{background:linear-gradient(145deg,#3a183f,#2b1238);border:1px solid #ffb4e144;border-radius:20px;padding:16px;box-shadow:0 12px 28px #0004}.card h2{margin:8px 0 3px;color:#fff1fa}.meta{color:#e6cfe0;font-size:12px;line-height:1.7}.btn{display:block;text-align:center;margin-top:12px;padding:10px;border-radius:14px;background:linear-gradient(135deg,#e52b86,#7a2b91);color:#fff;font-weight:900}.empty{text-align:center;padding:40px;color:#e6cfe0}.mode{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:99px;background:#e52b862b;color:#ffe7f5}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}</style><link rel="stylesheet" href="assets/joron-reference-theme.css"><link rel="stylesheet" href="assets/joron-theme-v2.css"><link rel="stylesheet" href="assets/joron-master-theme.css"><link rel="stylesheet" href="assets/joron-ux-polish.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v1.css"></head><body><main class="wrap"><section class="hero"><h1>✨ JORON Magic Discovery</h1><p>আপনার নির্বাচিত Magic Feature অনুযায়ী বাস্তব Profile ফলাফল।</p><div id="mode" class="mode">লোড হচ্ছে…</div></section><section class="panel"><div class="filters"><div class="field"><label>🔎 সার্চ</label><input id="q" placeholder="নাম, জেলা, পেশা, শিক্ষা..."></div><div class="field"><label>👤 লিঙ্গ</label><select id="gender"><option value="">সব লিঙ্গ</option></select></div><div class="field"><label>🎂 বয়স</label><select id="age"><option value="">সব বয়স</option><option value="18-24">১৮–২৪</option><option value="25-29">২৫–২৯</option><option value="30-34">৩০–৩৪</option><option value="35-39">৩৫–৩৯</option><option value="40+">৪০+</option></select></div></div><div id="count" class="count">Profile লোড হচ্ছে...</div></section><section id="grid" class="grid"></section></main><script type="module">import{db}from'./assets/firebase-client.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const qs=new URLSearchParams(location.search),mode=(qs.get('mode')||'').toLowerCase(),grid=document.getElementById('grid'),count=document.getElementById('count'),q=document.getElementById('q'),gender=document.getElementById('gender'),age=document.getElementById('age'),modeEl=document.getElementById('mode');const labels={voice:'🎙️ Voice intro',new:'🆕 নতুন Profile',online:'🟢 Online সদস্য',foryou:'❤️ For You Match',nearby:'📍 Nearby',random:'🎲 Random Match',premium:'💎 Premium সদস্য',education:'🎓 Education',profession:'💼 Profession',status:'📢 Status',free:'🆓 Free সদস্য',religion:'🕌 Religion',astrology:'♈ Astrology',birthday:'🎂 Birthday',photoless:'🖼️ ছবি ছাড়া Profile',relocation:'📦 Relocation',expat:'✈️ প্রবাসী',ghorjamai:'🏠 ঘরজামাই',story:'📖 Story',meeting:'🤝 Meeting'};modeEl.textContent=labels[mode]||'✨ সব Profile';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=(d,keys)=>{for(const k of keys){if(d[k]!==undefined&&d[k]!==null&&String(d[k]).trim()!=='')return d[k]}return''};const truth=(d,keys)=>{const v=String(val(d,keys)).toLowerCase();return ['true','yes','1','online','active','premium','free','available','interested','হ্যাঁ','আছে'].some(x=>v===x||v.includes(x))};const num=d=>{const n=parseInt(String(val(d,['age'])).replace(/\D/g,''));return Number.isFinite(n)?n:null};const photo=d=>val(d,['photoUrl','photoURL','profilePhoto','profileImage']);function recent(v,days){if(!v)return false;let t=v?.toDate?v.toDate():new Date(v);return !isNaN(t)&&Date.now()-t.getTime()<=days*86400000}function matchMode(x){const d=x.data;switch(mode){case'voice':return !!val(d,['voiceUrl','voiceURL','voiceIntro','voiceIntroduction','audioUrl','voice']);case'online':return truth(d,['online','isOnline','status']);case'new':return recent(val(d,['createdAt','created_at','registeredAt']),30);case'random':return true;case'premium':return /premium|standard/i.test(String(val(d,['membershipPlan','plan','membership','tier'])))||truth(d,['premium','isPremium']);case'free':return /free/i.test(String(val(d,['membershipPlan','plan','membership','tier'])))||truth(d,['free','isFree']);case'education':return !!val(d,['education','educationSystem','educationLevel','institution','subject']);case'profession':return !!val(d,['profession']);case'status':return !!val(d,['status','aboutStatus','profileStatus']);case'religion':return !!val(d,['religion','religious']);case'astrology':return !!val(d,['rashi','zodiac','astrology','birthDate','dateOfBirth']);case'birthday':{const s=val(d,['birthDate','dateOfBirth','dob','birthday']);if(!s)return false;const dt=new Date(s);const now=new Date();return !isNaN(dt)&&dt.getMonth()===now.getMonth()&&dt.getDate()===now.getDate()}case'photoless':return !photo(d);case'relocation':return truth(d,['relocation','openToRelocation','willingToRelocate','relocate']);case'expat':return truth(d,['expat','isExpat','overseas','abroad'])||!!val(d,['country','currentCountry','livingCountry'])&&String(val(d,['country','currentCountry','livingCountry'])).toLowerCase()!=='bangladesh';case'ghorjamai':return truth(d,['ghorjamai','ghorJamai','ghor_jamai']);case'story':return !!val(d,['story','stories','profileStory']);case'meeting':return truth(d,['meeting','meetingInterest','meetingRequest','interestedInMeeting']);case'nearby':{const mine=localStorage.getItem('joron_user_district')||'';return !mine||String(val(d,['district'])).toLowerCase()===mine.toLowerCase()}case'foryou':return !!val(d,['partner','about','verified','isVerified','membershipPlan']);default:return true}}function apply(all){const text=q.value.trim().toLowerCase(),g=gender.value,a=age.value;let list=all.filter(x=>{const d=x.data,n=num(d),hay=[val(d,['name']),val(d,['district']),val(d,['profession']),val(d,['education']),val(d,['educationSystem']),val(d,['institution']),val(d,['religion']),val(d,['about'])].join(' ').toLowerCase();return matchMode(x)&&(!text||hay.includes(text))&&(!g||String(val(d,['gender']))===g)&&(!a||n!==null&&((a==='18-24'&&n>=18&&n<=24)||(a==='25-29'&&n>=25&&n<=29)||(a==='30-34'&&n>=30&&n<=34)||(a==='35-39'&&n>=35&&n<=39)||(a==='40+'&&n>=40)))});if(mode==='random')list.sort(()=>Math.random()-.5);if(mode==='new')list.sort((a,b)=>new Date(val(b.data,['createdAt','created_at','registeredAt']))-new Date(val(a.data,['createdAt','created_at','registeredAt'])));count.textContent=`${list.length}টি Profile পাওয়া গেছে`;grid.innerHTML=list.map(x=>{const d=x.data,n=val(d,['name'])||'J❤️R❤️N User',p=photo(d);return `<article class="card"><h2>${esc(n)}</h2><div class="meta">${esc(val(d,['age'])||'—')} বছর · ${esc(val(d,['gender'])||'—')}<br>📍 ${esc(val(d,['district'])||'—')}<br>🎓 ${esc(val(d,['education','educationSystem'])||'—')}<br>💼 ${esc(val(d,['profession'])||'—')}</div><a class="btn" href="profile.html?id=${encodeURIComponent(x.id)}">প্রোফাইল দেখুন →</a></article>`}).join('')||'<div class="empty">💗 এই মুহূর্তে এই ধরনের কোনো Profile পাওয়া যায়নি।</div>'}async function load(){try{const s=await getDocs(collection(db,'biodata')),all=[];s.forEach(x=>all.push({id:x.id,data:x.data()}));[...new Set(all.map(x=>val(x.data,['gender'])).filter(Boolean))].forEach(v=>gender.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));apply(all)}catch(e){console.error(e);count.textContent='Profile লোড করা যায়নি।'}}[q,gender,age].forEach(x=>x.addEventListener('input',()=>load()));load();</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 0 24px;margin:0 auto;clear:both}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0;max-width:360px;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border:2px solid rgba(255,255,255,.9);border-radius:15px;color:#fff;background:linear-gradient(135deg,#087b59,#10a978);font:900 15px/1.2 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:translateY(-2px);filter:brightness(1.06)}@media(max-width:600px){.joron-global-page-nav{gap:6px;padding:12px 2px 20px}.joron-global-page-nav a,.joron-global-page-nav button{min-height:48px;padding:11px 8px;font-size:13px;border-width:1.5px;border-radius:12px}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
