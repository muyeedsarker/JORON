<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON — Smart Match</title></head><body><main><h1>❤️ JORON Smart Match</h1><p id="status">Loading secure matching…</p><section id="results"></section></main><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { getFirestore, collection, getDocs, query, limit } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
import { firebaseConfig } from './assets/firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const status=document.getElementById('status'),results=document.getElementById('results');
const clean=v=>typeof v==='string'?v.trim().toLowerCase():'';
function score(me,c){let s=0,w=0;const checks=[['district',30],['education',20],['profession',15],['marital',15]];for(const [k,weight] of checks){w+=weight;if(clean(me[k])&&clean(c[k])){if(clean(me[k])===clean(c[k]))s+=weight}}if(Number(me.age)&&Number(c.age)){w+=20;if(Math.abs(Number(me.age)-Number(c.age))<=3)s+=20;else if(Math.abs(Number(me.age)-Number(c.age))<=7)s+=10}return w?Math.round(s/w*100):0}
onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}try{status.textContent='Finding compatible profiles…';const mine=(await (await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js')).getDoc((await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js')).doc(db,'biodata',user.uid))).data()||{};const snap=await getDocs(query(collection(db,'biodata'),limit(100)));const rows=[];snap.forEach(d=>{if(d.id!==user.uid){const x=d.data()||{};rows.push({score:score(mine,x),age:x.age,district:x.district,education:x.education,profession:x.profession,marital:x.marital})}});rows.sort((a,b)=>b.score-a.score);results.innerHTML=rows.slice(0,20).map(x=>`<article><h2>${x.score}% match</h2><p>${x.age||'—'} · ${x.district||'—'} · ${x.education||'—'}</p></article>`).join('')||'<p>No compatible profiles found.</p>';status.textContent='Secure Firebase matching complete.'}catch(e){console.error(e);status.textContent='Unable to load matches safely.'}});
</script></body></html>
