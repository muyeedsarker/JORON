<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J❤️R❤️N | Partner Preference</title><style>:root{--p:#e81768;--g:#087b59;--ink:#17232b;--muted:#68747a;--line:#e7eaeb}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#fff8fc,#f0fff8);color:var(--ink)}.wrap{width:min(760px,92%);margin:auto}header{background:#fff;border-top:3px solid var(--p);box-shadow:0 10px 30px #00000010}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}.brand strong{font-family:Georgia,"Times New Roman",serif;font-size:32px;color:var(--g)}.back{font-weight:900}.box{margin:25px 0;background:#fff;border:1px solid var(--line);border-radius:25px;padding:24px;box-shadow:0 18px 55px #00000010}.box h1{margin:0;color:var(--g);font-size:30px}.intro{color:var(--muted)}.section{margin-top:22px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fbfcfc}.section h2{margin:0 0 12px;font-size:19px;color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-weight:900;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;min-height:48px;border:1px solid #d9dddd;border-radius:12px;padding:0 11px;font:inherit;background:#fff}.important{display:grid;grid-template-columns:1fr 1fr;gap:9px}.important label{padding:12px;border:1px solid var(--line);border-radius:13px;font-weight:800}.important input{accent-color:var(--p)}button{width:100%;margin-top:18px;border:0;border-radius:16px;min-height:56px;background:linear-gradient(105deg,var(--p),#ff4f91,var(--g));color:#fff;font-size:17px;font-weight:900;box-shadow:0 12px 28px #e8176830}@media(max-width:560px){.grid,.important{grid-template-columns:1fr}.box{padding:17px}.brand strong{font-size:28px}}</style><link rel="stylesheet" href="assets/joron-reference-theme.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/joron-logo.jpg" alt="J❤️R❤️N"><strong>J❤️R❤️N</strong></a><a class="back" href="dashboard.html">← Dashboard</a></div></header><main class="wrap"><div class="box"><h1>❤️ জীবনসঙ্গী সম্পর্কে আপনার প্রত্যাশা</h1><p class="intro">আপনার কাছে গুরুত্বপূর্ণ বিষয়গুলো নির্বাচন করুন। এগুলো Smart Match-এর ভিত্তি হিসেবে ব্যবহার করা যাবে।</p><form id="pref"><div class="section"><h2>🎂 বয়স ও উচ্চতা</h2><div class="grid"><div class="field"><label>ন্যূনতম বয়স</label><input id="minAge" type="number" min="18" max="80"></div><div class="field"><label>সর্বোচ্চ বয়স</label><input id="maxAge" type="number" min="18" max="80"></div><div class="field"><label>ন্যূনতম উচ্চতা</label><input id="height" placeholder="যেমন ৫'৩\""></div><div class="field"><label>বৈবাহিক অবস্থা</label><select id="marital"><option value="">যেকোনো</option><option>অবিবাহিত</option><option>তালাকপ্রাপ্ত</option><option>বিধবা / বিপত্নীক</option></select></div></div></div><div class="section"><h2>🎓 শিক্ষা ও পেশা</h2><div class="grid"><div class="field"><label>শিক্ষা</label><select id="education"><option value="">যেকোনো</option><option>SSC</option><option>HSC</option><option>Diploma</option><option>Bachelor</option><option>Masters</option><option>Doctorate</option></select></div><div class="field"><label>পেশা</label><select id="profession"><option value="">যেকোনো</option><option>সরকারি চাকরি</option><option>বেসরকারি চাকরি</option><option>ব্যবসায়ী</option><option>ডাক্তার</option><option>ইঞ্জিনিয়ার</option><option>শিক্ষক</option><option>ফ্রিল্যান্সার</option><option>প্রবাসী</option><option>অন্যান্য</option></select></div></div></div><div class="section"><h2>📍 পরিবার ও জীবনধারা</h2><div class="grid"><div class="field"><label>জেলা</label><select id="district"><option value="">যেকোনো</option><option>ঢাকা</option><option>চট্টগ্রাম</option><option>রাজশাহী</option><option>খুলনা</option><option>বরিশাল</option><option>সিলেট</option><option>রংপুর</option><option>ময়মনসিংহ</option></select></div><div class="field"><label>পারিবারিক ধরন</label><select id="family"><option value="">যেকোনো</option><option>একক পরিবার</option><option>যৌথ পরিবার</option><option>বড় পরিবার</option><option>ছোট পরিবার</option></select></div><div class="field"><label>ভবিষ্যৎ বসবাস</label><select id="future"><option value="">যেকোনো</option><option>বাংলাদেশ</option><option>ঢাকা</option><option>নিজ জেলা</option><option>গ্রাম</option><option>শহর</option><option>বিদেশ</option></select></div><div class="field"><label>ধর্মীয় মূল্যবোধ</label><select id="values"><option value="">যেকোনো</option><option>ধর্মীয়ভাবে সক্রিয়</option><option>ভারসাম্যপূর্ণ</option><option>উদার</option><option>পছন্দ নেই</option></select></div></div></div><div class="section"><h2>⭐ আমার কাছে সবচেয়ে গুরুত্বপূর্ণ — সর্বোচ্চ ৩টি</h2><div class="important"><label><input type="checkbox" value="চরিত্র"> ❤️ চরিত্র</label><label><input type="checkbox" value="ধর্মীয় মূল্যবোধ"> 🕌 ধর্মীয় মূল্যবোধ</label><label><input type="checkbox" value="শিক্ষা"> 🎓 শিক্ষা</label><label><input type="checkbox" value="পেশা"> 💼 পেশা</label><label><input type="checkbox" value="পরিবার"> 👨‍👩‍👧 পরিবার</label><label><input type="checkbox" value="ব্যক্তিত্ব"> 🧠 ব্যক্তিত্ব</label><label><input type="checkbox" value="সম্মান"> 🫶 পারস্পরিক সম্মান</label><label><input type="checkbox" value="দায়িত্বশীলতা"> 🤝 দায়িত্বশীলতা</label></div></div><button>❤️ Preference সংরক্ষণ করুন</button></form></div></main><script>const keys=['minAge','maxAge','height','marital','education','profession','district','family','future','values'];const saved=JSON.parse(localStorage.getItem('joronPreference')||'{}');keys.forEach(k=>{if(saved[k]!=null)document.getElementById(k).value=saved[k]});document.querySelectorAll('.important input').forEach(x=>x.checked=(saved.important||[]).includes(x.value));document.querySelectorAll('.important input').forEach(x=>x.addEventListener('change',()=>{const a=[...document.querySelectorAll('.important input:checked')];if(a.length>3){x.checked=false;alert('সর্বোচ্চ ৩টি নির্বাচন করুন।')}}));document.getElementById('pref').addEventListener('submit',e=>{e.preventDefault();const data={};keys.forEach(k=>data[k]=document.getElementById(k).value);data.important=[...document.querySelectorAll('.important input:checked')].map(x=>x.value);localStorage.setItem('joronPreference',JSON.stringify(data));localStorage.setItem('joronSavedAt',new Date().toISOString());location.href='dashboard.html'});</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 0 24px;margin:0 auto;clear:both}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0;max-width:360px;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border:2px solid rgba(255,255,255,.9);border-radius:15px;color:#fff;background:linear-gradient(135deg,#087b59,#10a978);font:900 15px/1.2 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:translateY(-2px);filter:brightness(1.06)}@media(max-width:600px){.joron-global-page-nav{gap:6px;padding:12px 2px 20px}.joron-global-page-nav a,.joron-global-page-nav button{min-height:48px;padding:11px 8px;font-size:13px;border-width:1.5px;border-radius:12px}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></htm
