<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7ef"><title>J❤️R❤️N — Profile</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><style>
.profile-view-wrap{width:min(920px,92%);margin:auto;padding:28px 0 48px}.profile-view-card{background:var(--paper);border:1px solid var(--gold-line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.profile-view-head{padding:14px 20px;border-bottom:1px solid var(--gold-line);display:flex;justify-content:space-between;align-items:center}.back-link{color:var(--gold-deep);font-weight:700}.profile-view-body{padding:28px}.profile-title{display:flex;gap:20px;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--gold-line)}.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#f5ead4;border:2px solid var(--gold-line)}.name{font-family:"Noto Serif Bengali","Playfair Display",Georgia,serif;font-size:32px;color:var(--gold-deep);font-weight:700}.muted{color:var(--muted)}.privacy-note{margin:22px 0;padding:15px 17px;border:1px solid var(--gold-line);border-radius:15px;background:#f8efdc;color:var(--gold-deep)}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.info-item{padding:16px;border:1px solid var(--gold-line);border-radius:16px;background:#fffdf8}.info-label{font-size:12px;color:var(--muted);margin-bottom:3px}.info-value{font-weight:700;color:var(--ink)}.notice{margin-top:18px;padding:15px;border:1px solid #ead9b5;border-radius:15px;background:#fbf7ef;color:var(--muted)}@media(max-width:600px){.profile-view-wrap{width:calc(100% - 28px);padding-top:16px}.profile-view-head{padding:12px 14px}.profile-view-body{padding:20px 15px}.profile-title{align-items:flex-start;gap:13px}.avatar{width:82px;height:82px}.name{font-size:25px}.info-grid{grid-template-columns:1fr}}
</style></head><body><main class="profile-view-wrap"><section class="profile-view-card"><div class="profile-view-head"><a class="back-link" href="matching.html">← Matching</a><a class="btn" href="profiles.html">Profiles</a></div><div class="profile-view-body"><div id="status" class="muted">Profile নিরাপদভাবে load হচ্ছে…</div><div id="profile"></div></div></section></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const q=new URLSearchParams(location.search).get('uid');const status=document.getElementById('status'),out=document.getElementById('profile');const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));await persistenceReady;onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html?next='+encodeURIComponent(location.pathname+location.search));return}if(!q||q===user.uid){status.textContent='নিজের profile দেখতে Dashboard/Biodata ব্যবহার করুন।';return}try{const snap=await getDoc(doc(db,'biodata',q));if(!snap.exists()||snap.data().visibility!=='public'){status.textContent='এই profile এখন public নয় বা পাওয়া যাচ্ছে না।';return}const d=snap.data();status.remove();out.innerHTML=`<div class="profile-title"><img class="avatar" src="${esc(d.photoUrl||'assets/joron-logo.jpg')}" alt="Profile"><div><div class="name">${esc(d.name||'J❤️R❤️N Member')}</div><div class="muted">${esc(d.age)} বছর · ${esc(d.district)}</div></div></div><div class="privacy-note">🔐 Public profile: private phone, email, exact address ও private biodata এখানে দেখানো হয় না।</div><div class="info-grid">${[['শিক্ষা',d.education],['পেশা',d.profession],['বৈবাহিক অবস্থা',d.marital],['উচ্চতা',d.height],['এলাকা',d.upazila],['পরিবার',d.familyType],['Personality',d.personality]].map(([a,b])=>`<div class="info-item"><div class="info-label">${esc(a)}</div><div class="info-value">${esc(b)}</div></div>`).join('')}</div><div class="notice">❤️ Interest/Chat করার আগে mutual-interest ও block/report controls অনুসরণ করুন।</div>`}catch(e){console.error(e);status.textContent=e?.code==='permission-denied'?'এই profile দেখার অনুমতি নেই।':'Profile load করা যায়নি।'}});</script></body></html>
