<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087b59"><title>J❤️R❤️N — Profile</title><style>body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:#f5fbf8;color:#18252d}.wrap{width:min(720px,92%);margin:auto}.top{padding:18px 0}.card{background:#fff;border:1px solid #e4ece8;border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 14px 40px #164b3910}.back{color:#087b59;font-weight:900;text-decoration:none}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#eaf6f1}.title{display:flex;gap:16px;align-items:center}.name{font-size:28px;color:#087b59;font-weight:900}.muted{color:#718087}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:13px;border-radius:15px;background:#f7fbf9}.label{font-size:11px;color:#718087}.value{font-weight:800}.notice{padding:14px;border-radius:14px;background:#effaf6;color:#075f47}.danger{background:#fff4f7;color:#a9004c}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="matching.html">← Matching</a></div><section class="card"><div id="status" class="muted">Profile নিরাপদভাবে load হচ্ছে…</div><div id="profile"></div></section></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const q=new URLSearchParams(location.search).get('uid');const status=document.getElementById('status'),out=document.getElementById('profile');const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));await persistenceReady;onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html?next='+encodeURIComponent(location.pathname+location.search));return}if(!q||q===user.uid){status.textContent='নিজের profile দেখতে Dashboard/Biodata ব্যবহার করুন।';return}try{const snap=await getDoc(doc(db,'biodata',q));if(!snap.exists()||snap.data().visibility!=='public'){status.textContent='এই profile এখন public নয় বা পাওয়া যাচ্ছে না।';return}const d=snap.data();status.remove();out.innerHTML=`<div class="title"><img class="avatar" src="${esc(d.photoUrl||'assets/joron-logo.jpg')}" alt="Profile"><div><div class="name">${esc(d.name||'J❤️R❤️N Member')}</div><div class="muted">${esc(d.age)} বছর · ${esc(d.district)}</div></div></div><div class="notice" style="margin:18px 0">🔐 Public profile: private phone, email, exact address ও private biodata এখানে দেখানো হয় না।</div><div class="grid">${[['শিক্ষা',d.education],['পেশা',d.profession],['বৈবাহিক অবস্থা',d.marital],['উচ্চতা',d.height],['এলাকা',d.upazila],['পরিবার',d.familyType],['Personality',d.personality]].map(([a,b])=>`<div class="item"><div class="label">${esc(a)}</div><div class="value">${esc(b)}</div></div>`).join('')}</div><div class="notice danger" style="margin-top:16px">❤️ Interest/Chat তৈরি করার আগে mutual-interest ও block/report controls সক্রিয় করা হবে।</div>`}catch(e){console.error(e);status.textContent=e?.code==='permission-denied'?'এই profile দেখার অনুমতি নেই।':'Profile load করা যায়নি।'}});</script></body></html>
