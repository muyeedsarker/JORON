<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087b59"><title>JORON | Profile</title><style>:root{--p:#e81768;--g:#087b59;--deep:#064f3d;--muted:#66737b}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#f7fffb,#fff5f9);color:#17232b}.wrap{width:min(760px,92%);margin:auto}header{padding:14px 0;background:#ffffffed;border-bottom:1px solid #0000000c;position:sticky;top:0;z-index:5}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font:800 30px Georgia,serif;color:var(--g);text-decoration:none}.brand span{color:var(--p)}.back{color:var(--g);font-weight:800;text-decoration:none}.card{margin:35px auto 55px;background:#fff;border:1px solid #e5e8e9;border-radius:28px;overflow:hidden;box-shadow:0 25px 70px #00000012}.hero{background:linear-gradient(135deg,#075f46,#0a8d64);color:#fff;text-align:center;padding:42px 20px}.avatar{width:105px;height:105px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--g);font-size:40px;font-weight:900}.hero h1{margin:15px 0 4px;font-size:32px}.hero p{margin:0;color:#e5fff5}.badge{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:999px;background:#ffffff20;border:1px solid #ffffff35;font-size:12px;font-weight:800}.body{padding:28px}.section{margin-bottom:26px}.section h2{color:var(--deep);font-size:20px;margin:0 0 13px;padding-bottom:8px;border-bottom:1px solid #e6efec}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{padding:13px;border-radius:13px;background:#f7faf9}.item strong{display:block;color:var(--g);font-size:12px;margin-bottom:3px}.text{padding:15px;border-radius:13px;background:#f7faf9;color:#4d5b61;line-height:1.8;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:13px;text-decoration:none;font-weight:900;border:1px solid var(--g);color:var(--g);background:#fff;cursor:pointer}.btn.primary{background:linear-gradient(105deg,var(--p),#ff4f91,var(--g));color:#fff;border:0}.status{text-align:center;color:var(--muted);min-height:24px;margin-top:10px}.loading{text-align:center;padding:60px;color:var(--g)}.error{text-align:center;padding:45px;color:#a00030;line-height:1.8}@media(max-width:600px){.grid{grid-template-columns:1fr}.body{padding:21px}.hero h1{font-size:27px}}</style></head>
<body><header><div class="wrap nav"><a class="brand" href="index.html">J<span>♡</span>RON</a><a class="back" href="profiles.html">← Profiles</a></div></header><main class="wrap"><article class="card"><div id="loading" class="loading">Profile লোড হচ্ছে…</div><div id="error" class="error" hidden></div><div id="content" hidden><section class="hero"><div class="avatar" id="avatar">J</div><h1 id="name">JORON User</h1><p id="summary">—</p><span class="badge">✓ JORON Profile</span></section><div class="body"><section class="section"><h2>👤 ব্যক্তিগত তথ্য</h2><div class="grid"><div class="item"><strong>বয়স</strong><span id="age">—</span></div><div class="item"><strong>লিঙ্গ</strong><span id="gender">—</span></div><div class="item"><strong>জেলা</strong><span id="district">—</span></div><div class="item"><strong>পেশা</strong><span id="profession">—</span></div></div></section><section class="section"><h2>🎓 শিক্ষা</h2><div class="grid"><div class="item"><strong>যোগ্যতা</strong><span id="education">—</span></div><div class="item"><strong>বিষয়</strong><span id="subject">—</span></div><div class="item"><strong>প্রতিষ্ঠান</strong><span id="institution">—</span></div><div class="item"><strong>পাশের সন</strong><span id="passingYear">—</span></div></div></section><section class="section"><h2>❤️ নিজের সম্পর্কে</h2><div class="text" id="about">—</div></section><section class="section"><h2>💍 জীবনসঙ্গীর পছন্দ</h2><div class="text" id="partner">—</div></section><div class="actions"><button class="btn primary" id="interest">❤️ পছন্দ করুন</button><a class="btn" href="profiles.html">← Profile তালিকা</a></div><div id="status" class="status"></div></div></div></article></main>
<script type="module">
import { doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
import { auth, db, requireAuth } from "./assets/firebase-auth.js";

const id = new URLSearchParams(location.search).get("id");
let user, liked = false;
const $ = x => document.getElementById(x);
const showError = m => { $("loading").hidden = true; $("error").hidden = false; $("error").innerHTML = `${m}<br><br><a href="profiles.html">← Profiles-এ ফিরে যান</a>`; };
const set = (id, v) => $(id).textContent = v ?? "—";

async function load() {
  try {
    user = await requireAuth({ redirect: "login.html" });
    if (!user || !id) return showError("Profile ID পাওয়া যায়নি।");
    const snap = await getDoc(doc(db, "biodata", id));
    if (!snap.exists()) return showError("এই Profile পাওয়া যায়নি।");
    const d = snap.data(), name = d.name || "JORON User";
    set("name", name); set("avatar", name.trim().charAt(0) || "J");
    set("age", d.age ? `${d.age} বছর` : "—"); set("gender", d.gender); set("district", d.district);
    set("profession", d.profession); set("education", d.education); set("subject", d.subject);
    set("institution", d.institution); set("passingYear", d.passingYear);
    set("about", d.about || "এই ব্যক্তি নিজের সম্পর্কে কিছু লেখেননি।");
    set("partner", d.partner || "জীবনসঙ্গীর পছন্দ উল্লেখ করা হয়নি.");
    set("summary", `${d.age ?? "—"} বছর • ${d.gender || "—"} • ${d.district || "—"}`);
    liked = (await getDoc(doc(db, "interests", `${user.uid}_${id}`))).exists();
    $("interest").textContent = liked ? "❤️ পছন্দ করা হয়েছে" : "❤️ পছন্দ করুন";
    $("loading").hidden = true; $("content").hidden = false;
  } catch (e) { console.error(e); showError("Profile লোড করা যায়নি। আবার লগইন করে চেষ্টা করুন।"); }
}

$("interest").addEventListener("click", async () => {
  if (!user || !id) return;
  const ref = doc(db, "interests", `${user.uid}_${id}`);
  $("interest").disabled = true; $("status").textContent = "সেভ হচ্ছে…";
  try {
    if (liked) { await deleteDoc(ref); liked = false; }
    else { await setDoc(ref, { fromUserId: user.uid, profileId: id, createdAt: serverTimestamp() }); liked = true; }
    $("interest").textContent = liked ? "❤️ পছন্দ করা হয়েছে" : "❤️ পছন্দ করুন";
    $("status").textContent = liked ? "আপনার পছন্দটি সেভ হয়েছে।" : "পছন্দ বাতিল করা হয়েছে।";
  } catch (e) { console.error(e); $("status").textContent = "পছন্দ সেভ করা যায়নি। পরে আবার চেষ্টা করুন।"; }
  finally { $("interest").disabled = false; }
});
load();
</script></body></html>
