<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#64158f"><title>J❤️R❤️N — Profile</title><link rel="stylesheet" href="assets/style.css"><style id="joron-premium-page-skin">
:root{--joron-p:#64158f;--joron-k:#d90b62;--joron-g:#087b59}
body{background:radial-gradient(circle at 10% 0%,#ffe8f3 0,transparent 28%),radial-gradient(circle at 90% 10%,#eee1ff 0,transparent 30%),linear-gradient(145deg,#fff7fb,#f4efff 55%,#edfff7)!important}
header{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(10px)}
main{min-height:calc(100vh - 170px)}
.card,.profile-card,.form-card,.login-card,.panel,.container>section{box-shadow:0 12px 32px rgba(70,25,90,.10)!important;border-color:#ead8ee!important}
</style></head><body><main class="form-page"><div class="profile-card" style="max-width:820px;margin:auto"><div id="loading" class="status">Profile লোড হচ্ছে...</div><div id="profileContent" style="display:none"><div class="hero-card" style="padding:35px 20px;text-align:center"><div class="avatar" id="avatar">আ</div><h1 id="profileName">নাম</h1><p id="profileSummary">—</p><div class="tag">✓ J❤️R❤️N Profile</div></div><div class="content" style="padding:25px"><section class="section"><h2>👤 ব্যক্তিগত তথ্য</h2><div class="grid"><div class="card"><b>নাম</b><div id="name">—</div></div><div class="card"><b>বয়স</b><div id="age">—</div></div><div class="card"><b>লিঙ্গ</b><div id="gender">—</div></div><div class="card"><b>ধর্ম</b><div id="religion">—</div></div><div class="card"><b>জেলা</b><div id="district">—</div></div><div class="card"><b>পেশা</b><div id="profession">—</div></div></div></section><section class="section"><h2>🎓 শিক্ষাগত তথ্য</h2><div class="grid"><div class="card"><b>শিক্ষাব্যবস্থা</b><div id="educationSystem">—</div></div><div class="card"><b>যোগ্যতা</b><div id="education">—</div></div><div class="card"><b>প্রতিষ্ঠান</b><div id="institution">—</div></div><div class="card"><b>বিভাগ / বিষয়</b><div id="subject">—</div></div><div class="card"><b>পাশের সন</b><div id="passingYear">—</div></div></div></section><section class="section"><h2>💗 নিজের সম্পর্কে</h2><div class="card" id="about">—</div></section><section class="section"><h2>💍 জীবনসঙ্গীর পছন্দ</h2><div class="card" id="partner">—</div></section><div class="buttons" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn pink" id="interestButton">❤️ পছন্দ করুন</button><a class="btn" href="interests.html">❤️ আমার Interests</a><a class="btn" href="profiles.html">← Profiles</a></div><div id="interestStatus" class="status"></div></div></div><div id="errorMessage" class="error" style="display:none"></div></div></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{likeProfile,removeLike,getOutgoingInterests}from'./assets/interest-service.js';const id=new URLSearchParams(location.search).get('id'),btn=document.getElementById('interestButton'),status=document.getElementById('interestStatus');let user=null,liked=false;const esc=v=>String(v??'—');function showError(m){document.getElementById('loading').style.display='none';const e=document.getElementById('errorMessage');e.innerHTML='<div class="card" style="text-align:center"><h2>🔎 Profile পাওয়া যায়নি</h2><p>'+m+'</p><a class="btn" href="profiles.html">← Profile Search</a></div>';e.style.display='block'}async function loadInterest(){if(!user||!id||user.uid===id)return;const list=await getOutgoingInterests();liked=list.some(x=>x.profileId===id);btn.textContent=liked?'❤️ পছন্দ করা হয়েছে':'❤️ পছন্দ করুন'}async function toggle(){if(!user){location.href='login.html?next='+encodeURIComponent(location.href);return}if(user.uid===id){status.textContent='নিজের Profile-এ Interest পাঠানো যাবে না।';return}btn.disabled=true;try{if(liked){await removeLike(id);liked=false;status.textContent='পছন্দ বাতিল হয়েছে।'}else{await likeProfile(id);liked=true;status.textContent='❤️ Interest পাঠানো হয়েছে।'}btn.textContent=liked?'❤️ পছন্দ করা হয়েছে':'❤️ পছন্দ করুন'}catch(e){status.textContent='Interest সংরক্ষণ করা যায়নি।'}finally{btn.disabled=false}}async function load(){if(!id)return showError('এই Profile-এর লিংক অসম্পূর্ণ।');try{const s=await getDoc(doc(db,'biodata',id));if(!s.exists())return showError('এই Profile-এর Biodata পাওয়া যায়নি।');const d=s.data(),name=d.name||'J❤️R❤️N User';document.getElementById('avatar').textContent=name.charAt(0);document.getElementById('profileName').textContent=name;document.getElementById('profileSummary').textContent=`${d.age??'—'} বছর • ${d.gender||'—'} • ${d.district||'—'}`;['name','age','gender','religion','district','profession','educationSystem','education','institution','subject','passingYear','about','partner'].forEach(k=>document.getElementById(k).textContent=esc(d[k]));document.getElementById('loading').style.display='none';document.getElementById('profileContent').style.display='block';if(user)await loadInterest()}catch(e){showError('Profile লোড করা যায়নি। আবার চেষ্টা করুন।')}}btn.addEventListener('click',toggle);await persistenceReady;onAuthStateChanged(auth,async u=>{user=u;if(u)await loadInterest()});load();</script></body></html>
