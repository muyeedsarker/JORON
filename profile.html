<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f0df"><title>JORON Matrimony — Profile</title><link rel="stylesheet" href="assets/joron-theme-2026.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span><strong>JORON</strong><small>সম্পর্ক জুড়ে দেয় জোড়ন</small></span></a><nav class="main-nav"><a href="index.html">হোম</a><a href="profiles.html">প্রোফাইল</a><a href="matching.html">ম্যাচিং</a><a href="help.html">সহায়তা</a><a class="nav-login" href="login.html">লগইন</a><a class="btn btn-gold" href="signup.html">রেজিস্টার</a></nav></div></header><main class="section"><div class="container"><div class="section-heading"><span class="eyebrow">Profile</span><h1>প্রোফাইল দেখুন</h1><p>বিশ্বাস, সম্মান ও পরিচয়ের ভিত্তিতে একজন মানুষকে জানুন।</p></div><section class="card-ivory"><h2 id="profileName">নাম</h2><p id="profileSummary">Profile লোড হচ্ছে...</p><div class="detail-grid"><div>নাম: <strong id="name">—</strong></div><div>বয়স: <strong id="age">—</strong></div><div>লিঙ্গ: <strong id="gender">—</strong></div><div>ধর্ম: <strong id="religion">—</strong></div><div>জেলা: <strong id="district">—</strong></div><div>পেশা: <strong id="profession">—</strong></div><div>শিক্ষা: <strong id="education">—</strong></div></div><div class="hero-actions"><button id="interestBtn" class="btn btn-gold" type="button" style="display:none">💗 Interest পাঠান</button><a class="btn btn-gold" href="smart-biodata.html">Smart Biodata</a><a class="btn btn-outline" href="profiles.html">সব প্রোফাইল</a></div><p id="notice" aria-live="polite"></p></section></div></main><footer class="site-footer"><div class="container footer-bottom">© 2026 JORON — সকল অধিকার সংরক্ষিত।</div></footer><script src="assets/joron-language.js"></script><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);function show(msg){$('profileName').textContent='JORON Profile';$('profileSummary').textContent=msg}function text(v){return String(v??'—')}async function load(user){if(!id){location.replace('profiles.html');return}if(id===user.uid){location.replace('smart-biodata.html');return}try{const s=await getDoc(doc(db,'publicProfiles',id));if(!s.exists()){show('এই Public Profile পাওয়া যায়নি।');return}const d=s.data()||{},name=d.name||'J❤️R❤️N User';$('profileName').textContent=name;$('profileSummary').textContent=`${d.age??'—'} বছর • ${d.gender||'—'} • ${d.district||'—'}`;['name','age','gender','religion','district','profession','education'].forEach(k=>$(k).textContent=text(d[k]));const btn=$('interestBtn');btn.style.display='inline-block';btn.onclick=async()=>{btn.disabled=true;try{await setDoc(doc(db,'interests',`${user.uid}_${id}`),{fromUserId:user.uid,profileId:id,status:'pending',createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});btn.textContent='✓ Interest পাঠানো হয়েছে';$('notice').textContent='Interest সফলভাবে পাঠানো হয়েছে।'}catch(e){console.error(e);btn.disabled=false;$('notice').textContent='Interest পাঠানো যায়নি। আবার চেষ্টা করুন।'}}}catch(e){console.error(e);show(e?.code==='permission-denied'?'এই Profile দেখার অনুমতি নেই।':'Profile লোড করা যায়নি।')}}await persistenceReady;onAuthStateChanged(auth,u=>{if(!u)show('Profile দেখতে আগে JORON-এ Login করুন।');else load(u)});</script></body></html>
