<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J❤️R❤️N — Profile</title><style>body{margin:0;padding:12px;font-family:"Noto Sans Bengali","Hind Siliguri",Arial,sans-serif;background:linear-gradient(145deg,#fff1f7,#f2edff,#eafff5);color:#18232a}.profile{max-width:760px;margin:auto;background:#fff;border:2px solid #ead8ee;border-radius:26px;overflow:hidden;box-shadow:0 20px 60px #46195a18}.top{text-align:center;padding:34px 18px;color:#fff;background:linear-gradient(135deg,#64158f,#d90b62 52%,#087b59)}.avatar{width:105px;height:105px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:#64158f;font-size:42px;font-weight:900}.top h1{margin:15px 0 5px}.content{padding:25px}.section{margin-bottom:22px}.section h2{color:#64158f;border-bottom:2px solid #ead7f2;padding-bottom:8px}.info{display:grid;grid-template-columns:1fr 1fr;gap:11px}.item,.text{background:#fbf7ff;border:1px solid #eadcf0;border-radius:15px;padding:14px}.item strong{display:block;color:#087b59;font-size:13px}.buttons{text-align:center}.btn{display:inline-block;padding:13px 23px;border-radius:28px;margin:5px;border:0;cursor:pointer;font-weight:900}.primary{background:linear-gradient(105deg,#d90b62,#7620ad,#087b59);color:#fff}.secondary{border:2px solid #64158f;color:#64158f;background:#fff;text-decoration:none}.status{text-align:center;min-height:24px;color:#087b59}.error{color:#b00020;text-align:center;padding:30px}@media(max-width:600px){.info{grid-template-columns:1fr}.content{padding:18px}}</style><style id="joron-premium-page-skin">
:root{--joron-p:#64158f;--joron-k:#d90b62;--joron-g:#087b59}
body{background:radial-gradient(circle at 10% 0%,#ffe8f3 0,transparent 28%),radial-gradient(circle at 90% 10%,#eee1ff 0,transparent 30%),linear-gradient(145deg,#fff7fb,#f4efff 55%,#edfff7)!important}
header{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(10px)}
main{min-height:calc(100vh - 170px)}
.card,.profile-card,.form-card,.login-card,.panel,.container>section{box-shadow:0 12px 32px rgba(70,25,90,.10)!important;border-color:#ead8ee!important}
</style><link rel="stylesheet" href="assets/joron-reference-theme.css"></head><body><main class="profile"><div id="loading" class="status" style="padding:45px">Profile লোড হচ্ছে...</div><div id="profileContent" style="display:none"><div class="top"><div class="avatar" id="avatar">আ</div><h1 id="profileName">নাম</h1><p id="profileSummary">—</p><div>✓ J❤️R❤️N Profile</div></div><div class="content"><section class="section"><h2>👤 ব্যক্তিগত তথ্য</h2><div class="info"><div class="item"><strong>নাম</strong><span id="name">—</span></div><div class="item"><strong>বয়স</strong><span id="age">—</span></div><div class="item"><strong>লিঙ্গ</strong><span id="gender">—</span></div><div class="item"><strong>ধর্ম</strong><span id="religion">—</span></div><div class="item"><strong>জেলা</strong><span id="district">—</span></div><div class="item"><strong>পেশা</strong><span id="profession">—</span></div></div></section><section class="section"><h2>🎓 শিক্ষাগত তথ্য</h2><div class="info"><div class="item"><strong>শিক্ষাব্যবস্থা</strong><span id="educationSystem">—</span></div><div class="item"><strong>যোগ্যতা</strong><span id="education">—</span></div><div class="item"><strong>প্রতিষ্ঠান</strong><span id="institution">—</span></div><div class="item"><strong>বিভাগ / বিষয়</strong><span id="subject">—</span></div><div class="item"><strong>পাশের সন</strong><span id="passingYear">—</span></div></div></section><section class="section"><h2>💗 নিজের সম্পর্কে</h2><div class="text" id="about">—</div></section><section class="section"><h2>💍 জীবনসঙ্গীর পছন্দ</h2><div class="text" id="partner">—</div></section><div class="buttons"><button class="btn primary" id="interestButton">❤️ পছন্দ করুন</button><a class="btn secondary" href="interests.html">❤️ আমার Interests</a><a class="btn secondary" href="profiles.html">← Profiles</a><div id="interestStatus" class="status"></div></div></div></div><div id="errorMessage" class="error" style="display:none"></div></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{likeProfile,removeLike,getOutgoingInterests}from'./assets/interest-service.js';const id=new URLSearchParams(location.search).get('id'),btn=document.getElementById('interestButton'),status=document.getElementById('interestStatus');let user=null,liked=false;const esc=v=>String(v??'—');function showError(m){document.getElementById('loading').style.display='none';const e=document.getElementById('errorMessage');e.textContent=m;e.style.display='block'}async function loadInterest(){if(!user||!id||user.uid===id)return;const list=await getOutgoingInterests();liked=list.some(x=>x.profileId===id);btn.textContent=liked?'❤️ পছন্দ করা হয়েছে':'❤️ পছন্দ করুন'}async function toggle(){if(!user){location.href='login.html?next='+encodeURIComponent(location.href);return}if(user.uid===id){status.textContent='নিজের Profile-এ Interest পাঠানো যাবে না।';return}btn.disabled=true;try{if(liked){await removeLike(id);liked=false;status.textContent='পছন্দ বাতিল হয়েছে।'}else{await likeProfile(id);liked=true;status.textContent='❤️ Interest পাঠানো হয়েছে।'}btn.textContent=liked?'❤️ পছন্দ করা হয়েছে':'❤️ পছন্দ করুন'}catch(e){console.error(e);status.textContent='Interest সংরক্ষণ করা যায়নি।'}finally{btn.disabled=false}}async function load(){if(!id)return showError('Profile ID পাওয়া যায়নি।');try{const s=await getDoc(doc(db,'biodata',id));if(!s.exists())return showError('এই Profile-এর Biodata পাওয়া যায়নি।');const d=s.data();const name=d.name||'J❤️R❤️N User';document.getElementById('avatar').textContent=name.charAt(0);document.getElementById('profileName').textContent=name;document.getElementById('profileSummary').textContent=`${d.age??'—'} বছর • ${d.gender||'—'} • ${d.district||'—'}`;['name','age','gender','religion','district','profession','educationSystem','education','institution','subject','passingYear','about','partner'].forEach(k=>document.getElementById(k).textContent=esc(d[k]));document.getElementById('loading').style.display='none';document.getElementById('profileContent').style.display='block';if(user)await loadInterest()}catch(e){console.error(e);showError('Profile লোড করা যায়নি।')}}btn.addEventListener('click',toggle);await persistenceReady;onAuthStateChanged(auth,async u=>{user=u;if(u)await loadInterest()});load();</script></body></html>
