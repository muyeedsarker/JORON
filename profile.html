<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JORON | Profile</title></head><body><main><h1 id="profileName">J❤️R❤️N User</h1><p id="profileSummary">Profile loading…</p><p>বয়স: <span id="age">—</span></p><p>লিঙ্গ: <span id="gender">—</span></p><p>জেলা: <span id="district">—</span></p><p>পেশা: <span id="profession">—</span></p><p id="about">—</p><p id="partner">—</p><button id="interestButton">❤️ পছন্দ করুন</button><p id="interestStatus"></p><p id="loading">Profile লোড হচ্ছে…</p><div id="errorMessage" style="display:none"><span id="errorText">Profile পাওয়া যায়নি।</span><br><a href="profiles.html">← প্রোফাইল তালিকায় ফিরে যান</a></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";import{getFirestore,doc,getDoc,setDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";const firebaseConfig={apiKey:"AIzaSyDWxxu3zwThJp1fuWMhXiRig3Fswt0QARA",authDomain:"joron-d7742.firebaseapp.com",projectId:"joron-d7742",storageBucket:"joron-d7742.firebasestorage.app",messagingSenderId:"907727989078",appId:"1:907727989078:web:4fdd266e3517a862fa0ef7",measurementId:"G-Q8PXH6C5NC"};const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),profileId=new URLSearchParams(location.search).get("id"),interestButton=document.getElementById("interestButton"),interestStatus=document.getElementById("interestStatus");let currentUser=null,isInterested=false;function showError(m){document.getElementById("loading").style.display="none";document.getElementById("errorMessage").style.display="block";document.getElementById("errorText").textContent=m}function updateButton(){interestButton.textContent=isInterested?"❤️ পছন্দ করা হয়েছে":"❤️ পছন্দ করুন";interestButton.disabled=false}async function loadInterest(){if(!currentUser||!profileId)return;const r=doc(db,"interests",currentUser.uid+"_"+profileId);isInterested=(await getDoc(r)).exists();updateButton()}async function toggleInterest(){if(!currentUser||!profileId){interestStatus.textContent="একটু অপেক্ষা করুন...";return}interestButton.disabled=true;try{const r=doc(db,"interests",currentUser.uid+"_"+profileId);if(isInterested){await deleteDoc(r);isInterested=false;interestStatus.textContent="পছন্দ বাতিল করা হয়েছে।"}else{await setDoc(r,{fromUserId:currentUser.uid,profileId,createdAt:serverTimestamp()});isInterested=true;interestStatus.textContent="❤️ আপনার পছন্দটি সেভ হয়েছে।"}updateButton;updateButton();setTimeout(()=>interestStatus.textContent="",2500)}catch(e){console.error(e);interestStatus.textContent="পছন্দ সেভ করা যায়নি।";interestButton.disabled=false}}async function loadProfile(){if(!profileId){showError("Profile ID পাওয়া যায়নি।");return}try{const profileRef=doc(db,"biodata",profileId),snap=await getDoc(profileRef);if(!snap.exists()){showError("এই Profile-এর Biodata পাওয়া যায়নি।");return}const d=snap.data(),name=d.name||"J❤️R❤️N User",age=d.age??"—",gender=d.gender||"—",district=d.district||"—";document.getElementById("profileName").textContent=name;document.getElementById("profileSummary").textContent=age+" বছর • "+gender+" • "+district;document.getElementById("age").textContent=age;document.getElementById("gender").textContent=gender;document.getElementById("district").textContent=district;document.getElementById("profession").textContent=d.profession||"—";document.getElementById("about").textContent=d.about||"এই ব্যক্তি নিজের সম্পর্কে কিছু লেখেননি।";document.getElementById("partner").textContent=d.partner||"জীবনসঙ্গীর পছন্দ উল্লেখ করা হয়নি।";document.getElementById("loading").style.display="none";if(currentUser)await loadInterest()}catch(e){console.error(e);showError("Profile লোড করা যায়নি।")}}interestButton.addEventListener("click",toggleInterest);onAuthStateChanged(auth,async user=>{currentUser=user;if(user)await loadInterest()});signInAnonymously(auth).catch(e=>{console.error(e);interestStatus.textContent="Firebase Authentication চালু করতে হবে।"});loadProfile();</script></body></html>
