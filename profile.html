<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#64158f">
  <title>J❤️R❤️N — Profile</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/joron-reference-theme.css">
  <style>
    :root { --joron-p:#64158f; --joron-k:#d90b62; --joron-g:#087b59; }
    body {
      background: radial-gradient(circle at 10% 0%, #ffe8f3 0, transparent 28%),
                  radial-gradient(circle at 90% 10%, #eee1ff 0, transparent 30%),
                  linear-gradient(145deg, #fff7fb, #f4efff 55%, #edfff7) !important;
    }
    main { min-height: calc(100vh - 170px); }
    .profile-card {
      max-width: 820px; margin: auto;
      box-shadow: 0 12px 32px rgba(70,25,90,.10) !important;
      border-color: #ead8ee !important;
    }
    .hero-card { padding: 35px 20px; text-align: center; }
    .profile-photo {
      width: 100px; height: 100px; margin: 0 auto 12px;
      border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#64158f,#e81768);
      color: #fff; font-size: 40px; font-weight: 900;
      box-shadow: 0 10px 25px rgba(100,21,143,.22);
    }
    .profile-photo img { width:100%; height:100%; object-fit:cover; }
    .content { padding: 25px; }
    .section { margin-bottom: 24px; }
    .section h2 { margin-bottom: 12px; }
    .buttons {
      display:flex; justify-content:center; gap:10px;
      flex-wrap:wrap; margin-top:22px;
    }
    .status { text-align:center; padding:20px; }
    .error { padding: 25px; }
    .joron-global-page-nav {
      width:100%; display:flex; gap:10px; justify-content:center;
      align-items:stretch; padding:14px 10px 24px; box-sizing:border-box;
    }
    .joron-global-page-nav a,
    .joron-global-page-nav button {
      flex:1 1 0; width:50%; max-width:360px; height:54px;
      display:flex; align-items:center; justify-content:center;
      border:2px solid rgba(255,255,255,.95); border-radius:15px;
      color:#fff; background:linear-gradient(135deg,#087b59,#10a978);
      font:900 15px/1 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;
      text-decoration:none; cursor:pointer;
      box-shadow:0 8px 20px rgba(70,25,90,.18), inset 0 1px 0 rgba(255,255,255,.35);
    }
    .joron-global-page-nav button { background:linear-gradient(135deg,#64158f,#a13bc5); }
    @media (max-width:600px) {
      .content { padding:18px 14px; }
      .hero-card { padding:28px 12px; }
      .joron-global-page-nav { gap:6px; padding:12px 2px 20px; }
      .joron-global-page-nav a,
      .joron-global-page-nav button { height:50px; font-size:13px; border-width:1.5px; border-radius:12px; }
    }
  </style>
<style id="joron-premium-page-skin">
:root{--joron-p:#64158f;--joron-k:#d90b62;--joron-g:#087b59}
body{background:radial-gradient(circle at 10% 0%,#ffe8f3 0,transparent 28%),radial-gradient(circle at 90% 10%,#eee1ff 0,transparent 30%),linear-gradient(145deg,#fff7fb,#f4efff 55%,#edfff7)!important}
header{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(10px)}
main{min-height:calc(100vh - 170px)}
.card,.profile-card,.form-card,.login-card,.panel,.container>section{box-shadow:0 12px 32px rgba(70,25,90,.10)!important;border-color:#ead8ee!important}
</style><link rel="stylesheet" href="assets/joron-theme-v2.css"><link rel="stylesheet" href="assets/joron-master-theme.css"><link rel="stylesheet" href="assets/joron-ux-polish.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v1.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v2.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v3.css"></head>
<body>
  <main class="form-page">
    <div class="profile-card">
      <div id="loading" class="status">Profile লোড হচ্ছে...</div>

      <div id="profileContent" style="display:none">
        <div class="hero-card">
          <div class="profile-photo" id="avatar">আ</div>
          <h1 id="profileName">নাম</h1>
          <p id="profileSummary">—</p>
          <div class="tag">✓ J❤️R❤️N Profile</div>
        </div>

        <div class="content">
          <section class="section">
            <h2>👤 ব্যক্তিগত তথ্য</h2>
            <div class="grid">
              <div class="card"><b>নাম</b><div id="name">—</div></div>
              <div class="card"><b>বয়স</b><div id="age">—</div></div>
              <div class="card"><b>লিঙ্গ</b><div id="gender">—</div></div>
              <div class="card"><b>ধর্ম</b><div id="religion">—</div></div>
              <div class="card"><b>জেলা</b><div id="district">—</div></div>
              <div class="card"><b>পেশা</b><div id="profession">—</div></div>
            </div>
          </section>

          <section class="section">
            <h2>🎓 শিক্ষাগত তথ্য</h2>
            <div class="grid">
              <div class="card"><b>শিক্ষাব্যবস্থা</b><div id="educationSystem">—</div></div>
              <div class="card"><b>যোগ্যতা</b><div id="education">—</div></div>
              <div class="card"><b>প্রতিষ্ঠান</b><div id="institution">—</div></div>
              <div class="card"><b>বিভাগ / বিষয়</b><div id="subject">—</div></div>
              <div class="card"><b>পাশের সন</b><div id="passingYear">—</div></div>
            </div>
          </section>

          <section class="section">
            <h2>💗 নিজের সম্পর্কে</h2>
            <div class="card" id="about">—</div>
          </section>

          <section class="section">
            <h2>💍 জীবনসঙ্গীর পছন্দ</h2>
            <div class="card" id="partner">—</div>
          </section>

          <div class="buttons">
            <button class="btn pink" id="interestButton" type="button">❤️ পছন্দ করুন</button>
            <a class="btn" href="interests.html">❤️ আমার Interests</a>
            <a class="btn" href="profiles.html">← Profiles</a>
          </div>
          <div id="interestStatus" class="status"></div>
        </div>
      </div>

      <div id="errorMessage" class="error" style="display:none"></div>
    </div>
  </main>

  <div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation">
    <a href="index.html">🏠 হোম</a>
    <button type="button" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button>
  </div>

  <script type="module">
    import {
      auth,
      db,
      onAuthStateChanged,
      persistenceReady
    } from './assets/firebase-client.js';
    import {
      doc,
      getDoc
    } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
    import {
      likeProfile,
      removeLike,
      getOutgoingInterests
    } from './assets/interest-service.js';

    const id = new URLSearchParams(location.search).get('id');
    const btn = document.getElementById('interestButton');
    const status = document.getElementById('interestStatus');
    let user = null;
    let liked = false;
    let loaded = false;

    const esc = value => String(value ?? '—');

    function showError(message, title = '🔎 Profile পাওয়া যায়নি') {
      document.getElementById('loading').style.display = 'none';
      const box = document.getElementById('errorMessage');
      box.innerHTML = `
        <div class="card" style="text-align:center">
          <h2>${title}</h2>
          <p>${message}</p>
          <a class="btn" href="profiles.html">← Profile Search</a>
        </div>`;
      box.style.display = 'block';
    }

    async function loadInterest() {
      if (!user || !id || user.uid === id) return;
      try {
        const list = await getOutgoingInterests();
        liked = list.some(item => item.profileId === id);
        btn.textContent = liked ? '❤️ পছন্দ করা হয়েছে' : '❤️ পছন্দ করুন';
      } catch (error) {
        console.warn('Interest state unavailable:', error);
      }
    }

    async function toggleInterest() {
      if (!user) {
        location.href = 'login.html?next=' + encodeURIComponent(location.href);
        return;
      }

      if (user.uid === id) {
        status.textContent = 'নিজের Profile-এ Interest পাঠানো যাবে না।';
        return;
      }

      btn.disabled = true;
      try {
        if (liked) {
          await removeLike(id);
          liked = false;
          status.textContent = 'পছন্দ বাতিল হয়েছে।';
        } else {
          await likeProfile(id);
          liked = true;
          status.textContent = '❤️ Interest পাঠানো হয়েছে।';
        }
        btn.textContent = liked ? '❤️ পছন্দ করা হয়েছে' : '❤️ পছন্দ করুন';
      } catch (error) {
        console.error('Interest error:', error);
        status.textContent = 'Interest সংরক্ষণ করা যায়নি।';
      } finally {
        btn.disabled = false;
      }
    }

    async function loadProfile() {
      if (loaded || !id || !user) return;
      loaded = true;

      try {
        const snapshot = await getDoc(doc(db, 'biodata', id));

        if (!snapshot.exists()) {
          loaded = false;
          showError('এই Profile-এর Biodata পাওয়া যায়নি।');
          return;
        }

        const data = snapshot.data();
        const name = data.name || 'J❤️R❤️N User';
        const photo = data.photoUrl || data.photoURL || data.profilePhoto || '';

        const avatar = document.getElementById('avatar');
        if (photo) {
          avatar.innerHTML = `<img src="${esc(photo).replace(/"/g, '&quot;')}" alt="Profile photo">`;
        } else {
          avatar.textContent = name.charAt(0);
        }

        document.getElementById('profileName').textContent = name;
        document.getElementById('profileSummary').textContent =
          `${data.age ?? '—'} বছর • ${data.gender || '—'} • ${data.district || '—'}`;

        [
          'name', 'age', 'gender', 'religion', 'district', 'profession',
          'educationSystem', 'education', 'institution', 'subject',
          'passingYear', 'about', 'partner'
        ].forEach(key => {
          const element = document.getElementById(key);
          if (element) element.textContent = esc(data[key]);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('profileContent').style.display = 'block';
        await loadInterest();
      } catch (error) {
        console.error('Profile load error:', error);
        loaded = false;
        if (error?.code === 'permission-denied') {
          showError('Profile দেখতে আগে J❤️R❤️N-এ Login করুন।', '🔒 Login প্রয়োজন');
        } else {
          showError('Profile লোড করা যায়নি। আবার চেষ্টা করুন।');
        }
      }
    }

    btn.addEventListener('click', toggleInterest);

    // profile.html সরাসরি খোলা হলে id থাকে না।
    // সেক্ষেত্রে ভুল error না দেখিয়ে Profiles পেজে পাঠানো হবে।
    if (!id) {
      location.replace('profiles.html');
    } else {
      await persistenceReady;
      onAuthStateChanged(auth, async currentUser => {
        user = currentUser;
        if (!user) {
          showError('Profile দেখতে আগে J❤️R❤️N-এ Login করুন।', '🔒 Login প্রয়োজন');
          return;
        }
        await loadProfile();
      });
    }
  </script>
</body>
</html>
