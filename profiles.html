<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JORON — Profiles</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:linear-gradient(135deg,#eefcff,#f5efff);color:#183b3a}.wrap{max-width:1100px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173d8f,#168f9b);border-radius:28px;padding:20px;color:white;box-shadow:0 18px 45px #173d8f35;display:flex;align-items:center;gap:16px}.logo{width:78px;height:78px;object-fit:cover;border-radius:20px;border:3px solid white;box-shadow:0 8px 22px #0003}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;opacity:.92}.search{margin:18px 0;background:#ffffffed;border:1px solid #cce7ef;border-radius:22px;padding:14px;box-shadow:0 12px 30px #183b3a12}.search input{width:100%;padding:15px;border:2px solid #dceff2;border-radius:16px;font-size:16px;outline:0}.search input:focus{border-color:#168f9b}.status{text-align:center;padding:22px;color:#168f9b;font-weight:800}.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #cde8e6;border-radius:24px;overflow:hidden;box-shadow:0 14px 38px #173d8f16}.cardtop{padding:24px;text-align:center;background:linear-gradient(145deg,#e9f9ff,#f5ecff);border-bottom:1px solid #e2eaf2}.avatar{width:82px;height:82px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#168f9b,#7656d8);color:#fff;font-size:32px;font-weight:900;border:4px solid white;box-shadow:0 8px 20px #168f9b35}.card h2{margin:10px 0 4px;color:#183b3a}.cardtop p{margin:0;color:#667}.body{padding:18px}.info{display:grid;gap:9px}.info div{padding:11px 12px;border-radius:12px;background:#f7fbfc}.info strong{color:#168f9b}.view{display:block;margin-top:15px;text-align:center;text-decoration:none;padding:13px;border-radius:28px;background:linear-gradient(105deg,#168f9b,#7656d8);color:white;font-weight:900}.empty{grid-column:1/-1;background:white;border-radius:22px;padding:40px;text-align:center;color:#777}@media(max-width:800px){.profiles{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:10px}.hero{padding:16px}.logo{width:62px;height:62px}.hero h1{font-size:25px}.profiles{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="hero"><img class="logo" src="assets/joron-logo.jpg" alt="JORON"><div><h1>JORON — Profiles</h1><p>💙 আপনার পছন্দের মানুষ খুঁজুন • নিরাপদ • স্মার্ট • সম্মানজনক</p></div></section><div class="search"><input id="searchInput" type="search" placeholder="🔎 নাম, জেলা, পেশা বা শিক্ষা দিয়ে খুঁজুন..."></div><div id="status" class="status">Profile লোড হচ্ছে...</div><section id="profiles" class="profiles"></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDWxxu3zwThJp1fuWMhXiRig3Fswt0QARA",authDomain:"joron-d7742.firebaseapp.com",projectId:"joron-d7742",storageBucket:"joron-d7742.firebasestorage.app",messagingSenderId:"907727989078",appId:"1:907727989078:web:4fdd266e3517a862fa0ef7"});const db=getFirestore(app),box=document.getElementById("profiles"),status=document.getElementById("status"),search=document.getElementById("searchInput");let all=[];
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function render(list){if(!list.length){box.innerHTML='<div class="empty">💗 কোনো Profile পাওয়া যায়নি। আবার খুঁজে দেখুন।</div>';return}box.innerHTML=list.map(x=>{let d=x.data,n=d.name||"JORON User";return `<article class="card"><div class="cardtop"><div class="avatar">${esc(n.charAt(0))}</div><h2>${esc(n)}</h2><p>${esc(d.age??"—")} বছর • ${esc(d.gender||"—")}</p></div><div class="body"><div class="info"><div><strong>📍 জেলা:</strong> ${esc(d.district||"—")}</div><div><strong>💼 পেশা:</strong> ${esc(d.profession||"—")}</div></div><a class="view" href="profile.html?id=${encodeURIComponent(x.id)}">প্রোফাইল দেখুন →</a></div></article>`}).join("")}
async function load(){try{let s=await getDocs(collection(db,"biodata"));all=[];s.forEach(d=>all.push({id:d.id,data:d.data()}));status.style.display="none";render(all)}catch(e){console.error(e);status.textContent="Profile লোড করা যায়নি। Firebase Firestore Rules পরীক্ষা করুন।"}}
search.addEventListener("input",()=>{let q=search.value.trim().toLowerCase();render(!q?all:all.filter(x=>[x.data.name,x.data.district,x.data.profession,x.data.gender,x.data.education,x.data.institution].filter(Boolean).join(" ").toLowerCase().includes(q)))});load();
</script></body></html>
