<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087b59">
<title>JORON | Profiles</title>
<style>
:root{--p:#e81768;--g:#087b59;--deep:#064f3d;--ink:#17232b;--muted:#66737b;--line:#e5e8e9}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#f7fffb,#fff5f9);color:var(--ink);line-height:1.6}.wrap{width:min(1100px,92%);margin:auto}header{background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid #0000000c;position:sticky;top:0;z-index:5}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font:800 30px Georgia,serif;color:var(--g);text-decoration:none}.brand span{color:var(--p)}.nav a:last-child{padding:10px 14px;border-radius:12px;background:#087b59;color:#fff;text-decoration:none;font-weight:800}.hero{text-align:center;padding:45px 0 25px}.hero h1{font-size:clamp(30px,5vw,48px);color:var(--deep);margin:0 0 8px}.hero p{color:var(--muted);margin:0 auto;max-width:700px}.tools{margin:25px 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 15px 40px #0000000b;display:grid;grid-template-columns:1fr 190px auto;gap:10px}.tools input,.tools select{min-height:48px;border:1px solid #d9dddd;border-radius:12px;padding:0 12px;font:inherit}.btn{min-height:48px;border:0;border-radius:12px;padding:0 18px;background:linear-gradient(105deg,var(--p),#ff4f91,var(--g));color:#fff;font-weight:900;cursor:pointer}.status{text-align:center;color:var(--muted);min-height:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:10px 0 55px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 50px #0000000b}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dff8ef,#ffe3ed);color:var(--g);font-size:27px;font-weight:900}.card h2{font-size:21px;margin:13px 0 3px}.meta{color:var(--muted);font-size:13px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef9f5;color:var(--g);font-weight:800}.card a{display:block;text-align:center;margin-top:13px;padding:11px;border-radius:12px;background:#f9e8ef;color:#a8004a;text-decoration:none;font-weight:900}.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #cbd8d3;border-radius:18px;padding:35px;color:var(--muted)}footer{text-align:center;padding:25px;color:#d9fff0;background:var(--deep)}@media(max-width:760px){.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.brand{font-size:26px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="index.html">J<span>♡</span>RON</a><a href="signup.html">❤️ Profile তৈরি</a></div></header>
<main class="wrap">
<section class="hero"><h1>🔎 JORON Profiles</h1><p>পছন্দের মানুষ খুঁজুন। সংবেদনশীল তথ্য এখানে দেখানো হয় না; বিস্তারিত দেখতে Profile খুলুন।</p></section>
<section class="tools"><input id="search" type="search" placeholder="নাম, জেলা বা পেশা দিয়ে খুঁজুন" aria-label="Profile search"><select id="gender" aria-label="লিঙ্গ"><option value="">সব</option><option value="পাত্র">পাত্র</option><option value="পাত্রী">পাত্রী</option></select><button class="btn" id="searchBtn">খুঁজুন</button></section>
<div id="status" class="status">Profile লোড হচ্ছে…</div><section id="grid" class="grid" aria-live="polite"></section>
</main><footer>❤️ JORON — বিশ্বাস • সম্মান • সামঞ্জস্য</footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";import{getFirestore,collection,getDocs,limit,query}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDWxxu3zwThJp1fuWMhXiRig3Fswt0QARA",authDomain:"joron-d7742.firebaseapp.com",projectId:"joron-d7742",storageBucket:"joron-d7742.firebasestorage.app",messagingSenderId:"907727989078",appId:"1:907727989078:web:4fdd266e3517a862fa0ef7"};const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);let profiles=[];const grid=document.getElementById('grid'),status=document.getElementById('status');
function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function render(){const term=document.getElementById('search').value.trim().toLowerCase(),gender=document.getElementById('gender').value;const rows=profiles.filter(p=>(!gender||p.gender===gender)&&(!term||[p.name,p.district,p.profession,p.education].filter(Boolean).join(' ').toLowerCase().includes(term)));grid.innerHTML=rows.length?rows.map(p=>`<article class="card"><div class="avatar">${esc((p.name||'J').trim().charAt(0))}</div><h2>${esc(p.name||'JORON User')}</h2><div class="meta">${esc(p.age??'—')} বছর • ${esc(p.gender||'—')} • ${esc(p.district||'—')}</div><div class="tags"><span class="tag">${esc(p.profession||'পেশা উল্লেখ নেই')}</span><span class="tag">${esc(p.education||'শিক্ষা উল্লেখ নেই')}</span></div><a href="profile.html?id=${encodeURIComponent(p.id)}">Profile দেখুন →</a></article>`).join(''):'<div class="empty">এই মুহূর্তে কোনো Profile পাওয়া যায়নি। Search পরিবর্তন করে আবার চেষ্টা করুন।</div>';status.textContent=`${rows.length}টি Profile পাওয়া গেছে`}
async function load(){try{await signInAnonymously(auth);const snap=await getDocs(query(collection(db,'biodata'),limit(100)));profiles=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error(e);status.textContent='Profile লোড করা যায়নি। Firebase Anonymous Authentication/Firestore Rules পরীক্ষা করুন।';grid.innerHTML='<div class="empty">সার্ভার থেকে Profile আনা সম্ভব হয়নি। পরে আবার চেষ্টা করুন।</div>'}}
document.getElementById('searchBtn').addEventListener('click',render);document.getElementById('search').addEventListener('input',render);document.getElementById('gender').addEventListener('change',render);load();
</script></body></html>
