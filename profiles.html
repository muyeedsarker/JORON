<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#64158f"><title>J❤️R❤️N | Profiles</title><link rel="stylesheet" href="assets/style.css"><style>.top{text-align:center;padding:9px;background:linear-gradient(90deg,#3b0a55,#64158f,#e81768);font-weight:900}.searchbox{background:rgba(255,255,255,.08);border:1px solid var(--joron-line);border-radius:24px;padding:18px;margin:18px 0;box-shadow:var(--joron-shadow);backdrop-filter:blur(12px)}.searchline{display:flex;gap:10px}.searchline input,.filters select{width:100%;padding:13px;border:1px solid rgba(255,255,255,.2);border-radius:13px;background:rgba(0,0,0,.22);color:#fff;font:inherit;outline:none}.searchline input{flex:1}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}.filters label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}.filters option{background:#241035}.summary{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.clear{padding:10px 14px;border-radius:12px;border:1px solid var(--joron-line);background:rgba(255,255,255,.08);color:#fff}.profiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:35px}.profiles .card{overflow:hidden}.cardtop{text-align:center;padding:20px;background:linear-gradient(145deg,rgba(232,23,104,.13),rgba(100,21,143,.14))}.cardtop h2{margin:8px 0 3px}.summaryline{color:var(--joron-muted);font-size:13px}.info{display:grid;gap:7px;margin-top:14px}.info div{padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.17);font-size:12px}.info strong{color:#ff9fc4}.view{display:block;text-align:center;margin-top:12px;padding:11px;border-radius:13px;background:linear-gradient(105deg,var(--joron-pink),var(--joron-purple));font-weight:900}.verified{display:inline-block;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:#ffd0e1;font-size:10px}.empty{grid-column:1/-1;text-align:center}@media(max-width:1050px){.profiles{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.profiles{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}.searchline{flex-direction:column}}@media(max-width:450px){.profiles{gap:9px}.filters{grid-template-columns:1fr}.cardtop{padding:14px 8px}.avatar{width:70px;height:70px;font-size:26px}.card h2{font-size:15px}.info div{font-size:10px;padding:7px}.view{font-size:11px;padding:9px}.summary{align-items:flex-start;gap:8px;flex-direction:column}}</style><link rel="stylesheet" href="assets/joron-reference-theme.css"></head><body><div class="top">❤️ J❤️R❤️N • নিরাপদ • সম্মানজনক • Smart Search</div><header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/joron-logo.jpg" alt="J❤️R❤️N" style="width:52px;height:52px;border-radius:50%;object-fit:cover"><div><b>J❤️R❤️N</b><small>সম্পর্ক জুড়ে দেয় জোড়ন</small></div></a><nav class="navlinks"><a href="index.html">🏠 হোম</a><a href="matching.html">❤️ Match</a><a href="payment.html">💎 Premium</a><a href="login.html">🔒 Login</a><a href="signup.html">❤️ Profile তৈরি</a></nav></div></header><main class="container"><section class="hero"><h1>আপনার জীবনসঙ্গী খুঁজুন</h1><p>নাম, জেলা, পেশা, শিক্ষা বা ধর্ম দিয়ে Profile খুঁজুন।</p><div class="searchbox"><div class="searchline"><input id="searchInput" type="search" placeholder="🔎 নাম, জেলা, পেশা, শিক্ষা, ধর্ম বা প্রতিষ্ঠান..."><button id="searchBtn" class="btn pink" type="button">খুঁজুন</button></div><div class="filters"><div><label>লিঙ্গ</label><select id="genderFilter"><option value="">সব লিঙ্গ</option><option>পুরুষ</option><option>নারী</option></select></div><div><label>বয়স</label><select id="ageFilter"><option value="">সব বয়স</option><option value="18-24">১৮–২৪</option><option value="25-29">২৫–২৯</option><option value="30-34">৩০–৩৪</option><option value="35-39">৩৫–৩৯</option><option value="40+">৪০+</option></select></div><div><label>জেলা</label><select id="districtFilter"><option value="">সব জেলা</option></select></div><div><label>শিক্ষাব্যবস্থা</label><select id="educationFilter"><option value="">সব শিক্ষা</option></select></div><div><label>পেশা</label><select id="professionFilter"><option value="">সব পেশা</option></select></div><div><label>ধর্ম</label><select id="religionFilter"><option value="">সব ধর্ম</option></select></div></div></div></section><div class="summary"><span id="count" class="tag">লোড হচ্ছে...</span><button id="clearBtn" class="clear">↺ পরিষ্কার</button></div><div id="status" class="status">Profile লোড হচ্ছে...</div><section id="profiles" class="profiles"></section></main><footer class="footer">© J❤️R❤️N (জোড়ন) • বিশ্বাস • নিরাপত্তা • সম্মান</footer><script type="module">import{db}from'./assets/firebase-client.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const $=x=>document.getElementById(x),box=$('profiles');let all=[];const val=(d,...k)=>{for(const x of k)if(d[x]!=null&&String(d[x]).trim())return d[x];return''};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function ageOk(v,r){if(!r)return true;let n=parseInt(String(v).replace(/\D/g,''));if(!Number.isFinite(n))return false;if(r==='40+')return n>=40;let[a,b]=r.split('-').map(Number);return n>=a&&n<=b}function render(){let q=$('searchInput').value.trim().toLowerCase(),f={g:$('genderFilter').value,a:$('ageFilter').value,d:$('districtFilter').value,e:$('educationFilter').value,p:$('professionFilter').value,r:$('religionFilter').value};let rows=all.filter(x=>{let d=x.data,hay=[d.name,d.district,d.profession,d.gender,d.education,d.educationSystem,d.institution,d.religion].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!f.g||val(d,'gender')===f.g)&&ageOk(d.age,f.a)&&(!f.d||val(d,'district')===f.d)&&(!f.e||val(d,'educationSystem')===f.e)&&(!f.p||val(d,'profession')===f.p)&&(!f.r||val(d,'religion','religious')===f.r)});$('count').textContent=`${rows.length}টি Profile`;box.innerHTML=rows.length?rows.map(x=>{let d=x.data,n=val(d,'name')||'J❤️R❤️N User',photo=val(d,'photoUrl','photoURL','profilePhoto');return`<article class="card"><div class="cardtop">${val(d,'verified','isVerified')?'<span class="verified">✓ যাচাইকৃত</span>':''}<div class="avatar">${photo?`<img src="${esc(photo)}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:esc(n.charAt(0))}</div><h2>${esc(n)}</h2><p class="summaryline">${esc(val(d,'age')||'—')} বছর • ${esc(val(d,'gender')||'—')} • ${esc(val(d,'district')||'—')}</p></div><div class="body"><div class="info"><div><strong>🎓 শিক্ষা:</strong> ${esc(val(d,'education','educationLevel')||val(d,'educationSystem')||'—')}</div><div><strong>💼 পেশা:</strong> ${esc(val(d,'profession')||'—')}</div><div><strong>🕌 ধর্ম:</strong> ${esc(val(d,'religion','religious')||'—')}</div></div><a class="view" href="profile.html?id=${encodeURIComponent(x.id)}">প্রোফাইল দেখুন →</a></div></article>`}).join(''):'<div class="empty"><h2>💗 কোনো Profile পাওয়া যায়নি</h2><p>Search বা Filter পরিবর্তন করে আবার চেষ্টা করুন।</p></div>'}function opts(id,key,label){let s=$(id),a=[...new Set(all.map(x=>val(x.data,key)).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'bn'));s.innerHTML=`<option value="">${label}</option>`+a.map(v=>`<option>${esc(v)}</option>`).join('')}async function load(){try{let s=await getDocs(collection(db,'biodata'));all=s.docs.map(x=>({id:x.id,data:x.data()}));opts('districtFilter','district','সব জেলা');opts('educationFilter','educationSystem','সব শিক্ষা');opts('professionFilter','profession','সব পেশা');opts('religionFilter','religion','সব ধর্ম');$('status').style.display='none';render()}catch(e){console.error(e);$('status').textContent='Profile লোড করা যায়নি।'}}['searchInput','genderFilter','ageFilter','districtFilter','educationFilter','professionFilter','religionFilter'].forEach(id=>$(id).addEventListener(id==='searchInput'?'input':'change',render));$('searchBtn').onclick=render;$('clearBtn').onclick=()=>{['searchInput','genderFilter','ageFilter','districtFilter','educationFilter','professionFilter','religionFilter'].forEach(id=>$(id).value='');render()};load();</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%!important;display:flex!important;flex-direction:row!important;gap:10px!important;justify-content:center!important;align-items:stretch!important;padding:14px 0 24px!important;margin:0!important;clear:both!important;box-sizing:border-box!important}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0!important;width:50%!important;max-width:360px!important;height:54px!important;min-height:54px!important;box-sizing:border-box!important;margin:0!important;padding:0 16px!important;display:flex!important;align-items:center!important;justify-content:center!important;vertical-align:middle!important;border:2px solid rgba(255,255,255,.95)!important;border-radius:15px!important;color:#fff!important;background:linear-gradient(135deg,#087b59,#10a978)!important;font:900 15px/1 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif!important;text-decoration:none!important;cursor:pointer!important;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35)!important;transition:filter .2s!important;appearance:none!important;-webkit-appearance:none!important}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)!important}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:none!important;filter:brightness(1.06)!important}@media(max-width:600px){.joron-global-page-nav{gap:6px!important;padding:12px 2px 20px!important}.joron-global-page-nav a,.joron-global-page-nav button{width:50%!important;height:50px!important;min-height:50px!important;padding:0 8px!important;font-size:13px!important;border-width:1.5px!important;border-radius:12px!important}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
