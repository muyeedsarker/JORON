<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#64158f"><title>JORON Matrimony | সম্পর্ক</title><link rel="stylesheet" href="assets/joron-theme-2026.css"><script src="assets/joron-language.js"></script><script>(function(){const M={"❤️ সম্পর্ক জুড়ে দিন":{en:"❤️ Build a Connection",hi:"❤️ रिश्ता जोड़ें"},"আপনার পাঠানো ও পাওয়া Interest এখানে নিরাপদভাবে পরিচালনা করুন।":{en:"Manage your sent and received Interests safely here.",hi:"अपने भेजे और प्राप्त Interests को यहां सुरक्षित रूप से प्रबंधित करें।"},"📥 পাওয়া Interest":{en:"📥 Received Interest",hi:"📥 प्राप्त Interest"},"📤 পাঠানো Interest":{en:"📤 Sent Interest",hi:"📤 भेजे गए Interest"},"সম্পর্কের তথ্য লোড হচ্ছে…":{en:"Loading relationship information…",hi:"रिश्ते की जानकारी लोड हो रही है…"},"তথ্য লোড হচ্ছে…":{en:"Loading information…",hi:"जानकारी लोड हो रही है…"},"এখনও কোনো Interest নেই।":{en:"No Interest yet.",hi:"अभी कोई Interest नहीं है।"},"প্রোফাইল":{en:"Profile",hi:"प्रोफ़ाइल"},"Profile":{en:"Profile",hi:"प्रोफ़ाइल"},"✓ গ্রহণ":{en:"✓ Accept",hi:"✓ स्वीकार करें"},"✕ প্রত্যাখ্যান":{en:"✕ Reject",hi:"✕ अस्वीकार करें"},"Interest বাতিল":{en:"Cancel Interest",hi:"Interest रद्द करें"},"এই Interest বাতিল করবেন?":{en:"Cancel this Interest?",hi:"क्या यह Interest रद्द करें?"},"পরিবর্তন করা যায়নি।":{en:"Could not make the change.",hi:"परिवर्तन नहीं किया जा सका।"},"Interest বাতিল করা যায়নি।":{en:"Interest could not be cancelled.",hi:"Interest रद्द नहीं किया जा सका।"},"❌ সম্পর্কের তথ্য লোড করা যাচ্ছে না।":{en:"❌ Relationship information could not be loaded.",hi:"❌ रिश्ते की जानकारी लोड नहीं हो सकी।"}};function apply(){const l=localStorage.getItem("joronLanguage")||"bn";document.querySelectorAll("body *").forEach(e=>{if(e.children.length)return;const t=(e.textContent||"").trim();if(M[t])e.textContent=l==='bn'?t:M[t][l]||t});document.querySelectorAll("input[placeholder]").forEach(e=>{const t=e.getAttribute('placeholder');if(M[t])e.setAttribute('placeholder',l==='bn'?t:M[t][l]||t)})}window.addEventListener('joron-language-change',apply);new MutationObserver(apply).observe(document.body,{subtree:true,childList:true});apply()})();</script></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span><strong>JORON Matrimony</strong><small>সম্পর্ক জুড়ে দেয় জোড়ন</small></span></a><nav class="main-nav"><a href="index.html">হোম</a><a href="profiles.html">প্রোফাইল</a><a href="matching.html">ম্যাচিং</a><a href="relationship.html">সম্পর্ক</a><a class="btn btn-gold" href="dashboard.html">Dashboard</a></nav></div></header><main class="wrap"><section class="hero"><h1>❤️ সম্পর্ক জুড়ে দিন</h1><p>আপনার পাঠানো ও পাওয়া Interest এখানে নিরাপদভাবে পরিচালনা করুন।</p><div class="tabs"><button class="tab active" data-tab="received">📥 পাওয়া Interest</button><button class="tab" data-tab="sent">📤 পাঠানো Interest</button></div></section><section class="card"><div id="status" class="status">সম্পর্কের তথ্য লোড হচ্ছে…</div><div id="list" class="list"></div></section></main><script type="module">import{auth,db,onAuthStateChanged,persistenceReady}from'./assets/firebase-client.js';import{collection,query,where,getDocs,doc,getDoc,updateDoc,deleteDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const status=document.getElementById('status'),list=document.getElementById('list');let uid='',received=[],sent=[],tab='received';const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function profile(id){try{const s=await getDoc(doc(db,'publicProfiles',id));return s.exists()?s.data():{name:'JORON Member',id}}catch{return{name:'JORON Member',id}}}async function load(){status.textContent='তথ্য লোড হচ্ছে…';try{const [r,s]=await Promise.all([getDocs(query(collection(db,'interests'),where('profileId','==',uid))),getDocs(query(collection(db,'interests'),where('fromUserId','==',uid)))]);received=await Promise.all(r.docs.map(async d=>({...d.data(),id:d.id,profile:await profile(d.data().fromUserId)})));sent=await Promise.all(s.docs.map(async d=>({...d.data(),id:d.id,profile:await profile(d.data().profileId)})));render()}catch(e){console.error(e);status.textContent='❌ সম্পর্কের তথ্য লোড করা যাচ্ছে না।';list.innerHTML=''}}function render(){const rows=tab==='received'?received:sent;status.textContent=rows.length?`${rows.length}টি ${tab==='received'?'পাওয়া':'পাঠানো'} Interest`:'এখনও কোনো Interest নেই।';list.innerHTML=rows.map(x=>`<article class="item"><div><h3>${esc(x.profile?.name||'JORON Member')}</h3><div class="meta">${x.profile?.age?esc(x.profile.age)+' বছর · ':''}${esc(x.profile?.district||'')} · Status: ${esc(x.status)}</div></div><div class="actions"><a class="btn profile" href="profile.html?id=${encodeURIComponent(tab==='received'?x.fromUserId:x.profileId)}">Profile</a>${tab==='received'&&x.status==='pending'?`<button class="btn accept" data-action="accepted" data-id="${esc(x.id)}">✓ গ্রহণ</button><button class="btn reject" data-action="rejected" data-id="${esc(x.id)}">✕ প্রত্যাখ্যান</button>`:''}${tab==='sent'&&x.status==='pending'?`<button class="btn reject" data-delete="${esc(x.id)}">Interest বাতিল</button>`:''}</div></article>`).join('');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await updateDoc(doc(db,'interests',b.dataset.id),{status:b.dataset.action,updatedAt:new Date()});await load()}catch(e){b.disabled=false;alert('পরিবর্তন করা যায়নি।')}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('এই Interest বাতিল করবেন?'))return;b.disabled=true;try{await deleteDoc(doc(db,'interests',b.dataset.delete));await load()}catch(e){b.disabled=false;alert('Interest বাতিল করা যায়নি।')}})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});await persistenceReady;onAuthStateChanged(auth,user=>{if(!user)return location.replace('login.html?next=relationship.html');uid=user.uid;load()});</script></body></html>
