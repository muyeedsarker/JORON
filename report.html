<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J❤️R❤️N | Safety Report</title><link rel="stylesheet" href="assets/joron-theme-2026.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">♡</span><span><strong>JORON</strong><small>সম্পর্ক জুড়ে দেয় জোড়ন</small></span></a><nav class="main-nav"><a href="index.html">হোম</a><a href="profiles.html">প্রোফাইল</a><a href="help.html">সহায়তা</a><a class="nav-login" href="login.html">লগইন</a></nav></div></header><main class="section"><div class="container"><section class="card-ivory report-card"><div class="section-heading"><span class="eyebrow">Safety & Trust</span><h1>🚨 Profile / Safety Report</h1><p>Fake Profile, Fake Photo, Fraud, Scam, Harassment বা Privacy Violation দেখলে রিপোর্ট করুন।</p></div><form id="form"><label for="reportCategory">Report Category</label><select id="reportCategory" required><option value="">নির্বাচন করুন</option><option>Fake Profile</option><option>Fake Photo</option><option>Fraud / Scam</option><option>Harassment</option><option>Inappropriate Message</option><option>Fake Information</option><option>Duplicate Account</option><option>Privacy Violation</option><option>Other</option></select><label for="reference">Profile / Reference</label><input id="reference" placeholder="নাম বা Profile ID (যদি থাকে)"><label for="details">বিস্তারিত</label><textarea id="details" required placeholder="সমস্যাটি সংক্ষেপে লিখুন…"></textarea><label for="screenshot">Screenshot (ঐচ্ছিক)</label><input id="screenshot" type="file" accept="image/*"><button class="btn btn-gold" type="submit">🚨 Report Submit করুন</button></form><div class="success" id="ok">✅ রিপোর্টটি এই ডিভাইসে Draft হিসেবে সংরক্ষিত হয়েছে। Production-এ Admin Review backend-এর সঙ্গে যুক্ত করতে হবে।</div></section></div></main><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('joronLastReport',new Date().toISOString());document.getElementById('ok').style.display='block';e.target.reset()})</script></body></html>
