<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J❤️R❤️N | Report</title><style>:root{--p:#e81768;--g:#087b59}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#fff8fc,#effff8);color:#17232b}.wrap{width:min(700px,92%);margin:auto}header{background:#fff;border-top:3px solid var(--p);box-shadow:0 10px 30px #0001}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}.brand strong{font:700 32px Georgia,serif;color:var(--g)}.box{margin:25px 0;background:#fff;border:1px solid #e8eaeb;border-radius:24px;padding:24px;box-shadow:0 18px 55px #00000010}label{display:block;font-weight:900;margin:14px 0 6px}select,textarea,input{width:100%;border:1px solid #dce0e0;border-radius:12px;padding:12px;font:inherit}textarea{min-height:130px;resize:vertical}button{width:100%;margin-top:17px;min-height:55px;border:0;border-radius:16px;background:linear-gradient(105deg,var(--p),#ff4f91,var(--g));color:#fff;font-weight:900;font-size:16px}.ok{display:none;padding:14px;border-radius:14px;background:#eaf9f2;color:var(--g);font-weight:900;margin-top:15px}</style><link rel="stylesheet" href="assets/joron-reference-theme.css"><link rel="stylesheet" href="assets/joron-theme-v2.css"><link rel="stylesheet" href="assets/joron-master-theme.css"><link rel="stylesheet" href="assets/joron-ux-polish.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v1.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v2.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v3.css"><link rel="stylesheet" href="assets/joron-visual-redesign-v4.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/joron-logo.jpg" alt="J❤️R❤️N"><strong>J❤️R❤️N</strong></a><a href="dashboard.html">← Dashboard</a></div></header><main class="wrap"><div class="box"><h1>🚨 Profile / Safety Report</h1><p style="color:#68747a">Fake Profile, Fake Photo, Fraud, Scam, Harassment বা Privacy Violation দেখলে রিপোর্ট করুন।</p><form id="form"><label>Report Category</label><select required><option value="">নির্বাচন করুন</option><option>Fake Profile</option><option>Fake Photo</option><option>Fraud / Scam</option><option>Harassment</option><option>Inappropriate Message</option><option>Fake Information</option><option>Duplicate Account</option><option>Privacy Violation</option><option>Other</option></select><label>Profile / Reference</label><input placeholder="নাম বা Profile ID (যদি থাকে)"><label>বিস্তারিত</label><textarea required placeholder="সমস্যাটি সংক্ষেপে লিখুন…"></textarea><label>Screenshot (ঐচ্ছিক)</label><input type="file" accept="image/*"><button>🚨 Report Submit করুন</button></form><div class="ok" id="ok">✅ রিপোর্টটি এই ডিভাইসে Draft হিসেবে সংরক্ষিত হয়েছে। Production-এ Admin Review backend-এর সঙ্গে যুক্ত করতে হবে।</div></div></main><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('joronLastReport',new Date().toISOString());document.getElementById('ok').style.display='block';e.target.reset()})</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 0 24px;margin:0 auto;clear:both}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0;max-width:360px;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border:2px solid rgba(255,255,255,.9);border-radius:15px;color:#fff;background:linear-gradient(135deg,#087b59,#10a978);font:900 15px/1.2 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:translateY(-2px);filter:brightness(1.06)}@media(max-width:600px){.joron-global-page-nav{gap:6px;padding:12px 2px 20px}.joron-global-page-nav a,.joron-global-page-nav button{min-height:48px;padding:11px 8px;font-size:13px;border-width:1.5px;border-radius:12px}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
