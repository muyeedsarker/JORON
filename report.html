<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON | Report</title><style>:root{--p:#e81768;--g:#087b59}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(135deg,#fff8fc,#effff8);color:#17232b}.wrap{width:min(700px,92%);margin:auto}header{background:#fff;border-top:3px solid var(--p);box-shadow:0 10px 30px #0001}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}.brand strong{font:700 32px Georgia,serif;color:var(--g)}.box{margin:25px 0;background:#fff;border:1px solid #e8eaeb;border-radius:24px;padding:24px;box-shadow:0 18px 55px #00000010}label{display:block;font-weight:900;margin:14px 0 6px}select,textarea,input{width:100%;border:1px solid #dce0e0;border-radius:12px;padding:12px;font:inherit}textarea{min-height:130px;resize:vertical}button{width:100%;margin-top:17px;min-height:55px;border:0;border-radius:16px;background:linear-gradient(105deg,var(--p),#ff4f91,var(--g));color:#fff;font-weight:900;font-size:16px}.ok{display:none;padding:14px;border-radius:14px;background:#eaf9f2;color:var(--g);font-weight:900;margin-top:15px}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/joron-logo.jpg" alt="JORON"><strong>JORON</strong></a><a href="dashboard.html">← Dashboard</a></div></header><main class="wrap"><div class="box"><h1>🚨 Profile / Safety Report</h1><p style="color:#68747a">Fake Profile, Fake Photo, Fraud, Scam, Harassment বা Privacy Violation দেখলে রিপোর্ট করুন।</p><form id="form"><label>Report Category</label><select required><option value="">নির্বাচন করুন</option><option>Fake Profile</option><option>Fake Photo</option><option>Fraud / Scam</option><option>Harassment</option><option>Inappropriate Message</option><option>Fake Information</option><option>Duplicate Account</option><option>Privacy Violation</option><option>Other</option></select><label>Profile / Reference</label><input placeholder="নাম বা Profile ID (যদি থাকে)"><label>বিস্তারিত</label><textarea required placeholder="সমস্যাটি সংক্ষেপে লিখুন…"></textarea><label>Screenshot (ঐচ্ছিক)</label><input type="file" accept="image/*"><button>🚨 Report Submit করুন</button></form><div class="ok" id="ok">✅ রিপোর্টটি এই ডিভাইসে Draft হিসেবে সংরক্ষিত হয়েছে। Production-এ Admin Review backend-এর সঙ্গে যুক্ত করতে হবে।</div></div></main><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('joronLastReport',new Date().toISOString());document.getElementById('ok').style.display='block';e.target.reset()})</script></body></html>
