<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087b59"><title>JORON | Smart Matching</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:linear-gradient(145deg,#fff7fb,#f2efff,#edfff7);color:#18232a}.wrap{width:min(1050px,94%);margin:auto}.top{background:#064f3d;color:#fff;text-align:center;padding:9px;font-weight:900}.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.brand{font:bold 30px Georgia;color:#087b59;text-decoration:none}.nav a{padding:9px 14px;border:1px solid #e6dfe8;border-radius:12px;background:#fff;text-decoration:none;font-weight:800}.hero{text-align:center;padding:24px 0}.hero h1{font-size:40px;color:#d90b62;margin:8px}.hero p{color:#66737b}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#fff;border:1px solid #eadfea;border-radius:22px;padding:18px;box-shadow:0 15px 40px #46195a10}.filters label{font-size:12px;font-weight:900;color:#087b59}.filters input,.filters select{width:100%;margin-top:6px;height:44px;border:1px solid #e4dbe5;border-radius:12px;padding:0 10px;font:inherit;background:#fff}.button{grid-column:1/-1;border:0;border-radius:13px;height:48px;background:linear-gradient(105deg,#e81768,#64158f,#087b59);color:#fff;font-weight:900;cursor:pointer}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:18px 0 35px}.profile{background:#fff;border:1px solid #eadfea;border-radius:22px;padding:18px;box-shadow:0 15px 40px #46195a10}.avatar{height:130px;border-radius:18px;background:linear-gradient(145deg,#ffe4ef,#eee3ff,#dffbed);display:flex;align-items:center;justify-content:center;font-size:55px}.profile h2{margin:12px 0 4px;color:#087b59}.profile p{margin:4px 0;color:#66737b;font-size:13px}.match{display:inline-block;margin-top:10px;padding:7px 10px;border-radius:999px;background:#fff0f6;color:#d90b62;font-weight:900;font-size:12px}.note{padding:15px;border-radius:15px;background:#e9fbf3;color:#087b59;font-size:13px;font-weight:700;margin-bottom:25px}.status{text-align:center;margin:14px 0;font-weight:800}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.results{grid-template-columns:1fr 1fr}}@media(max-width:500px){.brand{font-size:25px}.nav a{font-size:11px}.filters,.results{grid-template-columns:1fr}.hero h1{font-size:33px}}</style><link rel="stylesheet" href="assets/joron-theme-2026.css">
</head><body><div class="top">❤️ JORON Smart Matching • আপনার পছন্দ, মূল্যবোধ ও ভবিষ্যৎ পরিকল্পনা অনুযায়ী</div><div class="wrap nav"><a class="brand" href="index.html">JORON</a><a href="features.html">← Features</a></div><main><section class="hero"><h1>❤️ Smart Matching</h1><p>Firebase-এর প্রকাশ্য Profile থেকে সম্ভাব্য Match খুঁজুন।</p></section><section class="filters"><div><label>বয়স</label><input id="age" type="text" placeholder="যেমন 25-30"></div><div><label>জেলা</label><input id="location" type="text" placeholder="যেমন Gazipur"></div><div><label>শিক্ষা</label><select id="education"><option value="">সব</option><option>SSC</option><option>HSC</option><option>Graduate</option><option>Postgraduate</option></select></div><div><label>পেশা</label><input id="profession" type="text" placeholder="পছন্দের পেশা"></div><button class="button" id="match">🔎 বাস্তব Match খুঁজুন</button></section><div class="status" id="status">Login করে Match খুঁজুন।</div><section class="results" id="results"></section><div class="note">🤖 Match score একটি preference-based সহায়ক হিসাব; এটি সম্পর্ক বা সামঞ্জস্যের নিশ্চয়তা নয়।</div></main><script type="module">import { auth } from './assets/firebase-client.js';import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';import { findMatches } from './assets/matching-service.js';const results=document.getElementById('results'),status=document.getElementById('status');let user=null;let profile=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=items=>{results.innerHTML=items.length?items.map(x=>`<article class="profile"><div class="avatar">👤</div><h2>${esc(x.name||'JORON Member')}</h2><p>${esc(x.age?x.age+' বছর':'বয়স তথ্য নেই')} • ${esc(x.district||'জেলা নেই')}</p><p>${esc(x.education||'শিক্ষা নেই')} • ${esc(x.profession||'পেশা নেই')}</p><span class="match">⭐ ${x.score}% সম্ভাব্য Match</span></article>`).join(''):'<article class="profile"><h2>কোনো প্রকাশ্য Profile পাওয়া যায়নি</h2><p>আপনার preference পরিবর্তন করে আবার চেষ্টা করুন।</p></article>'};onAuthStateChanged(auth,async u=>{user=u;if(!u){status.textContent='🔐 আগে Login করুন।';return}status.textContent='';try{const {doc,getDoc}=await import('https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js');const {db}=await import('./assets/firebase-client.js');const snap=await getDoc(doc(db,'biodata',u.uid));profile=snap.exists()?snap.data():{};}catch(e){profile={};status.textContent='Profile data পাওয়া যায়নি; আবার চেষ্টা করুন।'}});document.getElementById('match').onclick=async()=>{if(!user){status.textContent='🔐 Match দেখতে Login প্রয়োজন।';return}status.textContent='🔎 Firebase থেকে বাস্তব Match খোঁজা হচ্ছে...';try{let items=await findMatches(user.uid,profile||{},100);const age=document.getElementById('age').value.trim(),loc=document.getElementById('location').value.trim().toLowerCase(),edu=document.getElementById('education').value.trim().toLowerCase(),job=document.getElementById('profession').value.trim().toLowerCase();if(loc)items=items.filter(x=>String(x.district||'').toLowerCase().includes(loc));if(edu)items=items.filter(x=>String(x.education||'').toLowerCase().includes(edu));if(job)items=items.filter(x=>String(x.profession||'').toLowerCase().includes(job));if(age){const m=age.match(/(\d+)\s*[-–]\s*(\d+)/);if(m){const a=+m[1],b=+m[2];items=items.filter(x=>Number(x.age)>=a&&Number(x.age)<=b)}}render(items);status.textContent=`✅ ${items.length}টি বাস্তব Match পাওয়া গেছে।`}catch(e){console.error(e);status.textContent='❌ Match খুঁজতে সমস্যা হয়েছে। Firebase/permission পরীক্ষা করুন।'}};</script><style id="joron-global-page-nav-style">.joron-global-page-nav{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;padding:14px 0 24px;margin:0 auto;clear:both}.joron-global-page-nav a,.joron-global-page-nav button{flex:1 1 0;max-width:360px;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border:2px solid rgba(255,255,255,.9);border-radius:15px;color:#fff;background:linear-gradient(135deg,#087b59,#10a978);font:900 15px/1.2 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(70,25,90,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}.joron-global-page-nav button{background:linear-gradient(135deg,#64158f,#a13bc5)}.joron-global-page-nav a:hover,.joron-global-page-nav button:hover{transform:translateY(-2px);filter:brightness(1.06)}@media(max-width:600px){.joron-global-page-nav{gap:6px;padding:12px 2px 20px}.joron-global-page-nav a,.joron-global-page-nav button{min-height:48px;padding:11px 8px;font-size:13px;border-width:1.5px;border-radius:12px}}</style><div id="joron-global-page-nav" class="joron-global-page-nav" aria-label="JORON page navigation"><a href="index.html" class="joron-home-btn">🏠 হোম</a><button type="button" class="joron-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">↩️ Back</button></div></body></html>
