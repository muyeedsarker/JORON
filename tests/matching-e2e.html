<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JORON Matrimony — Matching E2E Test</title><style>body{font-family:Arial,sans-serif;background:#fbf7ef;color:#2c2925;margin:0;padding:20px}.box{max-width:760px;margin:auto;background:#fffdf8;border:1px solid #dfcda8;border-radius:18px;padding:20px;box-shadow:0 10px 26px rgba(150,110,50,.08)}h1{color:#8d682d}.case{padding:14px;margin:12px 0;border:1px solid #ead9b5;border-radius:12px}.pass{border-color:#667a67}.fail{border-color:#a85d68}.small{color:#746e65;font-size:14px}code{word-break:break-all}</style></head><body><main class="box"><h1>JORON Matrimony — Matching E2E</h1><p class="small">Test-only reader. এটি কোনো Firebase document তৈরি/পরিবর্তন করে না। শুধু JORON_TEST_* profile পড়ে Matching logic চালায়।</p><div id="status">Test শুরু হচ্ছে…</div><div id="results"></div></main><script type="module">import {auth,db} from '../assets/firebase-client.js';import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import {preferenceCompatible} from '../assets/matching-service.js';
const el=id=>document.getElementById(id);const results=el('results');
const me={age:40,gender:'পুরুষ',partnerGender:'নারী',partnerAgeMin:25,partnerAgeMax:30,partnerReligion:'ইসলাম',partnerCommunity:'সুন্নি',partnerDistrict:'গাজীপুর',partnerEducation:'SSC+'};
const cases=[['JORON_TEST_COMPATIBLE',true],['JORON_TEST_RELIGION_DISTRICT_EDUCATION_MISMATCH',false],['JORON_TEST_AGE_GENDER_MISMATCH',false]];
async function run(){const u=auth.currentUser;if(!u){el('status').textContent='🔐 Test account দিয়ে Login করুন।';return}el('status').textContent='Firebase test profile পড়া হচ্ছে…';let found=0;for(const [id,expected] of cases){const s=await getDoc(doc(db,'publicProfiles',id));const profile=s.exists()?s.data():null;const actual=profile?preferenceCompatible(me,profile):null;const ok=profile?actual===expected:false;if(profile)found++;const box=document.createElement('div');box.className='case '+(ok?'pass':'fail');box.innerHTML=`<b>${ok?'✅':'❌'} ${id}</b><br>Expected: <code>${expected}</code><br>Actual: <code>${profile?actual:'profile not found'}</code>`;results.appendChild(box)}el('status').textContent=`Firebase read complete — ${found}/3 test profiles পাওয়া গেছে।`;}
auth.onAuthStateChanged(()=>run());</script></body></html>
